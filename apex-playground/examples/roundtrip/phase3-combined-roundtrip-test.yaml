    execution-order: 5
    failure-policy: "continue-with-warnings"

component-refs:
  - file: "components/nested-component.yaml"
    execution-order: 10
    failure-policy: "flag-for-review"

config-files:
  - file: "configs/extra-config.yaml"
    execution-order: 15
    failure-policy: "terminate"
