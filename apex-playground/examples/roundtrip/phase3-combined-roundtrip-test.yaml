metadata:
  id: "combined-phase3-component"
  name: "Phase 3 Combined Test Component"
  version: "1.0.0"
  type: "component"
  description: "Tests all component ref types together"
  business-domain: "Testing"
  owner: "test-team"
  created-by: "tester"
  created-date: "2025-01-01"
  last-modified: "2025-12-31"
  criticality: "medium"
  sla-ms: 300
  tags:
    - test
    - phase3

rule-configurations:
  - file: "rules/rule-set-a.yaml"
    execution-order: 1
    failure-policy: "terminate"

enrichment-refs:
