metadata:
  id: "basic-rules-test"
  name: "Basic Rules Test"
  version: "1.0"
  type: "rule-config"
  description: "Test basic rule block import"
  author: "APEX Demo Team"

rules:
  - id: "rule-001"
    name: "CUSIP Required"
    condition: "#customerId != null"
    message: "Customer ID is required"
    severity: "ERROR"
  
  - id: "rule-002"
    name: "Positive Quantity"
    condition: "#amount > 0"
    message: "Amount must be positive"
    severity: "WARNING"
  
  - id: "rule-003"
    name: "Minimum Price"
    condition: "#currency != null"
    message: "Currency must be present"
    severity: "INFO"
