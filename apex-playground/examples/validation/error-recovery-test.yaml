metadata:
  id: "error-recovery-test"
  name: "Error Recovery Test"
  version: "1.0"
  type: "rule-config"
  description: "Test error recovery configuration"
  author: "APEX Demo Team"

error-recovery:
  enabled: true
  log-recovery-attempts: true
  metrics-enabled: false
  default-strategy: "CONTINUE_WITH_DEFAULT"
  severity-policies:
    ERROR:
      recovery-enabled: false
      strategy: "FAIL_FAST"
      max-retries: 0
      retry-delay: 0

    WARNING:
      recovery-enabled: true
      strategy: "CONTINUE_WITH_DEFAULT"
      max-retries: 1
      retry-delay: 100

rules:
  - id: "error-recovery-placeholder"
    name: "Error Recovery Placeholder"
    condition: "#amount != null"
    message: "Amount field is present"
    severity: "INFO"
