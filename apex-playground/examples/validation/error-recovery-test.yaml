metadata:
  id: "error-recovery-test"
  name: "Error Recovery Test"
  version: "1.0"
  type: "rule-config"
  description: "Test error recovery configuration"
  author: "APEX Demo Team"

error-recovery:
  default-action: "CONTINUE"
  severity-policies:
    - severity: "ERROR"
      action: "FAIL"
      max-errors: 0
    
    - severity: "WARNING"
      action: "CONTINUE"
      max-errors: 10
      log-level: "WARN"
