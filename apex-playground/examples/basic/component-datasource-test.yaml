metadata:
  name: "Component Test"
  version: "1.0"

data-source-refs:
  - name: "trade-database"
    source: "data-sources/trade-db.yaml"
    enabled: true

components:
  - id: "trade-validator"
    name: "Trade Validation Component"
    description: "Validates trade data"
    rules:
      - id: "trade-001"
        condition: "#tradeId != null"
        message: "Trade ID required"
        severity: "ERROR"
