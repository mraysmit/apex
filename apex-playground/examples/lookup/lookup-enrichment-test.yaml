metadata:
  id: "lookup-enrichment-test"
  name: "Lookup Enrichment Test"
  version: "1.0"
  type: "rule-config"
  description: "Test lookup-based enrichment configuration"
  author: "APEX Demo Team"

enrichments:
  - id: "currency-lookup"
    type: "lookup-enrichment"
    source-field: "#currencyCode"
    lookup-config:
      lookup-dataset:
        type: "yaml-data"
        yaml-data-file: "data/currencies.yaml"
      lookup-key-field: "code"
      result-mapping:
        - source-field: "name"
          target-field: "currencyName"
        - source-field: "symbol"
          target-field: "currencySymbol"
