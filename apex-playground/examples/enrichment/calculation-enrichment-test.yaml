metadata:
  id: "calculation-enrichment-test"
  name: "Calculation Test"
  version: "1.0"
  type: "rule-config"
  description: "Test calculation-based enrichments"
  author: "APEX Demo Team"

enrichments:
  - id: "total-value-calc"
    type: "calculation-enrichment"
    source-fields:
      - "#quantity"
      - "#price"
    calculation:
      expression: "#quantity * #price"
      result-field: "totalValue"
