metadata:
  name: "Component Groups Test"
  version: "1.0"
  type: "rule-config"
  description: "Test multiple components with grouping and organization"

components:
  - id: "data-validation-component"
    name: "Data Validation Component"
    description: "Validates core data fields"
    enabled: true
    execution-order: 1
    rules:
      - id: "data-val-001"
        condition: "#customerId != null"
        message: "Customer ID required"
        severity: "ERROR"
      
      - id: "data-val-002"
        condition: "#orderDate != null"
        message: "Order date required"
        severity: "ERROR"

  - id: "business-logic-component"
    name: "Business Logic Component"
    description: "Applies business rules and calculations"
    enabled: true
    execution-order: 2
    enrichments:
      - id: "total-calculation"
        type: "calculation-enrichment"
        source-fields:
          - "#quantity"
          - "#unitPrice"
        calculation:
          expression: "#quantity * #unitPrice"
          result-field: "lineTotal"
    
    rules:
      - id: "business-logic-001"
        condition: "#lineTotal > 0"
        message: "Line total must be positive"
        severity: "ERROR"

  - id: "compliance-component"
    name: "Compliance Component"
    description: "Ensures regulatory compliance"
    enabled: true
    execution-order: 3
    rules:
      - id: "compliance-001"
        condition: "#lineTotal < 10000 || #approvalRequired == true"
        message: "Orders over $10,000 require approval"
        severity: "WARNING"
