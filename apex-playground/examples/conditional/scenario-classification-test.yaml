metadata:
  id: "scenario-classification-test"
  name: "Scenario Test"
  version: "1.0"
  type: "rule-config"
  description: "Test scenario-based classification routing"
  author: "APEX Demo Team"

scenario:
  name: "Trade Classification"
  classification:
    field-name: "tradeType"
    classifications:
      - value: "EQUITY"
        rules-ref: "equity-rules.yaml"
      - value: "BOND"
        rules-ref: "bond-rules.yaml"
      - value: "DERIVATIVE"
        rules-ref: "derivative-rules.yaml"
