<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>APEX Visual Rule Editor</title>
        <script src="https://unpkg.com/blockly/blockly.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <!-- Prism.js for YAML syntax highlighting -->
        <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
        <style>
            body {
                background-color: #f5f5f5;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            header {
                background-color: #2c3e50;
                color: white;
                padding: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
            }

            #main-container {
                display: flex;
                flex: 1;
                overflow: hidden;
            }

            #blocklyDiv {
                flex: 2;
                height: 100%;
            }

            #outputDiv {
                flex: 1;
                background-color: #1e1e1e;
                color: #d4d4d4;
                padding: 1rem;
                overflow: auto;
                border-left: 1px solid #ccc;
                font-family: 'Consolas', 'Monaco', monospace;
                display: flex;
                flex-direction: column;
            }

            #yamlOutput {
                white-space: pre;
                flex: 1;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                line-height: 1.6;
                overflow: auto;
            }

            #yamlOutput pre {
                margin: 0;
                padding: 0;
            }

            #yamlOutput code {
                display: block;
                background: transparent !important;
            }

            /* Override Prism theme for better contrast */
            #yamlOutput code[class*="language-"],
            #yamlOutput pre[class*="language-"] {
                background: transparent !important;
                color: #e2e8f0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* APEX Keyword Colorization - matching d3-tree-viewer */
            /* Metadata keywords - Blue */
            .token.apex-metadata {
                color: #64B5F6 !important;
                font-weight: bold;
            }

            /* Rules section keywords - Green */
            .token.apex-rules {
                color: #81C784 !important;
                font-weight: bold;
            }

            /* Enrichment keywords - Purple */
            .token.apex-enrichment {
                color: #BA68C8 !important;
                font-weight: bold;
            }

            /* Rule Groups keywords - Orange */
            .token.apex-rulegroup {
                color: #FFB74D !important;
                font-weight: bold;
            }

            /* Data Source keywords - Cyan */
            .token.apex-datasource {
                color: #4DD0E1 !important;
                font-weight: bold;
            }

            /* Scenario keywords - Pink */
            .token.apex-scenario {
                color: #F48FB1 !important;
                font-weight: bold;
            }

            /* Pipeline keywords - Lime */
            .token.apex-pipeline {
                color: #AED581 !important;
                font-weight: bold;
            }

            /* Common keywords - Light Yellow */
            .token.apex-common {
                color: #FFE082 !important;
                font-weight: bold;
            }

            /* SpEL expressions - Red */
            .token.apex-spel {
                color: #EF5350 !important;
            }

            /* Collapsible sections */
            .yaml-section {
                cursor: pointer;
                user-select: none;
            }
            .yaml-section:hover {
                background-color: rgba(255,255,255,0.05);
            }
            .yaml-toggle {
                display: inline-block;
                width: 1em;
                color: #888;
            }
            .yaml-collapsed > .yaml-children {
                display: none;
            }
            .yaml-collapsed > .yaml-toggle::before {
                content: '+';
            }
            .yaml-expanded > .yaml-toggle::before {
                content: '-';
            }
            .yaml-children {
                display: block;
            }
            .yaml-placeholder {
                color: #888;
                font-style: italic;
            }

            .btn {
                background-color: #3498db;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                cursor: pointer;
                border-radius: 4px;
                font-size: 1rem;
            }

            .btn:hover {
                background-color: #2980b9;
            }

            h2 {
                margin-top: 0;
                color: #ecf0f1;
                font-size: 1.2rem;
                border-bottom: 1px solid #555;
                padding-bottom: 0.5rem;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Apex Visual Rule Editor <span style="font-size: 0.8rem; opacity: 0.8;">(Prototype)</span></h1>
            <div style="display: flex; gap: 0.5rem;">
                <button class="btn" onclick="openSaveTemplateModal()">Save Template</button>
                <button class="btn" onclick="openYamlImportModal()">Open in APEX Editor</button>
                <button class="btn" onclick="downloadYaml()">Download YAML</button>
            </div>
        </header>

        <!-- YAML Import Modal -->
        <div id="yamlImportModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: #2c3e50; padding: 1.5rem; border-radius: 8px; width: 80%; max-width: 800px; max-height: 80vh; display: flex; flex-direction: column;">
                <h2 style="color: white; margin: 0 0 1rem 0;">Import APEX YAML Configuration</h2>
                <textarea id="yamlImportInput" placeholder="Paste your APEX YAML configuration here..." style="flex: 1; min-height: 400px; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.9rem; padding: 1rem; border: none; border-radius: 4px; background: #1e1e1e; color: #d4d4d4; resize: none;"></textarea>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button class="btn" style="background-color: #7f8c8d;" onclick="closeYamlImportModal()">Cancel</button>
                    <button class="btn" onclick="importYamlToBlocks()">Import</button>
                </div>
            </div>
        </div>

        <!-- Save Template Modal -->
        <div id="saveTemplateModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: #2c3e50; padding: 1.5rem; border-radius: 8px; width: 400px; display: flex; flex-direction: column;">
                <h2 style="color: white; margin: 0 0 1rem 0;">Save as Template</h2>
                <p style="color: #bdc3c7; margin: 0 0 1rem 0; font-size: 0.9rem;">Save the current workspace as a reusable template.</p>
                <input type="text" id="templateNameInput" placeholder="Template name..." style="padding: 0.75rem; border: none; border-radius: 4px; background: #1e1e1e; color: #d4d4d4; font-size: 1rem; margin-bottom: 1rem;">
                <textarea id="templateDescInput" placeholder="Description (optional)..." style="height: 80px; font-family: inherit; font-size: 0.9rem; padding: 0.75rem; border: none; border-radius: 4px; background: #1e1e1e; color: #d4d4d4; resize: none; margin-bottom: 1rem;"></textarea>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button class="btn" style="background-color: #7f8c8d;" onclick="closeSaveTemplateModal()">Cancel</button>
                    <button class="btn" onclick="saveTemplate()">Save</button>
                </div>
            </div>
        </div>

        <!-- Manage Templates Modal -->
        <div id="manageTemplatesModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
            <div style="background: #2c3e50; padding: 1.5rem; border-radius: 8px; width: 500px; max-height: 80vh; display: flex; flex-direction: column;">
                <h2 style="color: white; margin: 0 0 1rem 0;">Manage Templates</h2>
                <div id="templatesList" style="flex: 1; overflow-y: auto; max-height: 400px;"></div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 1rem;">
                    <button class="btn" style="background-color: #7f8c8d;" onclick="closeManageTemplatesModal()">Close</button>
                </div>
            </div>
        </div>

        <div id="main-container">
            <div id="blocklyDiv"></div>
            <div id="outputDiv">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h2 style="margin: 0;">Generated YAML</h2>
                    <div style="display: flex; gap: 0.25rem; align-items: center;">
                        <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; min-width: 28px;" onclick="zoomYaml(-1)" title="Zoom out">-</button>
                        <span id="zoomLevel" style="font-size: 0.7rem; color: #aaa; min-width: 35px; text-align: center;">14px</span>
                        <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; min-width: 28px;" onclick="zoomYaml(1)" title="Zoom in">+</button>
                        <button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; margin-left: 0.5rem;" onclick="copyYamlToClipboard()" title="Copy to clipboard">Copy</button>
                    </div>
                </div>
                <div id="yamlOutput"># Drag blocks to generate YAML...</div>
            </div>
        </div>

        <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none">
            <category name="Configuration" colour="#5C81A6">
                <block type="apex_rule_config"></block>
                <block type="apex_data_source_config"></block>
            </category>
            <category name="Sections" colour="#7C5CA6">
                <block type="apex_section_data_source_refs"></block>
                <block type="apex_section_enrichment_groups"></block>
                <block type="apex_section_enrichments"></block>
                <block type="apex_section_rule_groups"></block>
                <block type="apex_section_rules"></block>
                <block type="apex_section_transformations"></block>
            </category>
            <category name="Data Sources" colour="#A65C5C">
                <block type="apex_data_source_database"></block>
                <block type="apex_data_source_rest"></block>
                <block type="apex_data_source_file"></block>
                <block type="apex_data_source_query"></block>
                <block type="apex_data_source_endpoint"></block>
                <block type="apex_data_source_ref"></block>
            </category>
            <category name="Rules" colour="#5CA681">
                <block type="apex_rule"></block>
                <block type="apex_rule_group"></block>
                <block type="apex_rule_ref"></block>
            </category>
            <category name="Transformations" colour="#A6815C">
                <block type="apex_conditional_transformation"></block>
                <block type="apex_action_set_field"></block>
            </category>
            <category name="Enrichments" colour="#A65C81">
                <block type="apex_enrichment_group"></block>
                <block type="apex_enrichment_ref"></block>
                <block type="apex_enrichment_calculation"></block>
                <block type="apex_enrichment_field"></block>
                <block type="apex_field_mapping"></block>
            </category>
            <category name="Lookups" colour="#805CA6">
                <block type="apex_enrichment_lookup"></block>
                <block type="apex_lookup_dataset_reference"></block>
                <block type="apex_lookup_dataset_database"></block>
                <block type="apex_lookup_parameter"></block>
            </category>
            <category name="Logic" colour="#5C81A6">
                <block type="apex_condition_compare"></block>
                <block type="apex_condition_logic"></block>
                <block type="apex_field_ref"></block>
                <block type="text"></block>
                <block type="math_number"></block>
                <block type="logic_boolean"></block>
            </category>
            <sep></sep>
            <category name="Templates" colour="#E67E22" custom="TEMPLATES"></category>
        </xml>

        <script>
            // --- 1. Define Custom Blocks (JSON Array for static blocks) ---

            Blockly.defineBlocksWithJsonArray([
                {
                    "type": "apex_rule_config",
                    "message0": "Configuration %1 ID: %2 %3 Version: %4 %5 Description: %6 %7 Author: %8 %9 Business Domain: %10 %11 Effective Date: %12 %13 Expiration Date: %14 %15 Tags (comma-sep): %16 %17 Sections: %18",
                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "ID", "text": "my-config" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "VERSION", "text": "1.0.0" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "DESCRIPTION", "text": "My configuration" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "AUTHOR", "text": "user@example.com" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "BUSINESS_DOMAIN", "text": "Trade Processing" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "EFFECTIVE_DATE", "text": "" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "EXPIRATION_DATE", "text": "" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "TAGS", "text": "tag1, tag2" },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "SECTIONS", "check": "Section" }
                    ],
                    "colour": 230,
                    "tooltip": "Top-level configuration file - drag section blocks here",
                    "helpUrl": ""
                },
                {
                    "type": "apex_section_data_source_refs",
                    "message0": "Data Source Refs Section %1 %2",
                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "DATA_SOURCE_REFS", "check": "DataSourceRef" }
                    ],
                    "previousStatement": "Section",
                    "nextStatement": "Section",
                    "colour": 0,
                    "tooltip": "Container for data source references",
                    "helpUrl": ""
                },
                {
                    "type": "apex_data_source_ref",
                    "message0": "Data Source Ref %1 Name: %2 %3 Source: %4 %5 Enabled: %6 %7 Description: %8",
                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "NAME", "text": "my-db" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "SOURCE", "text": "data-sources/my-db.yaml" },
                        { "type": "input_dummy" },
                        { "type": "field_checkbox", "name": "ENABLED", "checked": true },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "DESCRIPTION", "text": "" }

                    "previousStatement": "DataSourceRef",
                    "nextStatement": "DataSourceRef",
                    "colour": 0,
                    "tooltip": "Reference to an external data source configuration",
                    "helpUrl": ""
                },
                {
                    "type": "apex_section_rules",

                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "RULES", "check": "Rule" }
                    ],
                    "previousStatement": "Section",
                    "nextStatement": "Section",
                    "colour": 120,
                    "tooltip": "Container for rules",
                    "helpUrl": ""
                },
                {
                    "type": "apex_section_rule_groups",

                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "RULE_GROUPS", "check": "RuleGroup" }
                    ],
                    "previousStatement": "Section",

                    "tooltip": "Container for rule groups",

                },
                {
                    "type": "apex_section_enrichments",

                    "args0": [

                    ],
                    "previousStatement": "Section",

                {

                {

                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "TRANSFORMATIONS", "check": "Transformation" }
                    ],
                    "previousStatement": "Section",

                {
                    "type": "apex_rule",

                    "args0": [

                        { "type": "field_input", "name": "ID", "text": "rule-1" },
                        { "type": "input_dummy" },

                        { "type": "field_dropdown", "name": "SEVERITY", "options": [["ERROR", "ERROR"], ["WARNING", "WARNING"], ["INFO", "INFO"]] },

                    ],
                    "previousStatement": "Rule",

                        { "type": "input_dummy" },
                        { "type": "field_checkbox", "name": "ENABLED", "checked": true },
                        { "type": "input_dummy" },

                        { "type": "field_input", "name": "ID", "text": "eg-1" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "NAME", "text": "My Enrichment Group" },
                        { "type": "input_dummy" },
                        { "type": "field_checkbox", "name": "ENABLED", "checked": true },
                        { "type": "input_dummy" },
                        { "type": "field_dropdown", "name": "OPERATOR", "options": [["AND", "AND"], ["OR", "OR"]] },
                        { "type": "input_dummy" },
                        { "type": "input_statement", "name": "ENRICHMENT_IDS", "check": "EnrichmentRef" }

                    "previousStatement": "EnrichmentGroup",
                    "nextStatement": "EnrichmentGroup",
                    "colour": 180,
                    "tooltip": "Groups enrichments together",
                    "helpUrl": ""
                },
                {
                    "type": "apex_enrichment_ref",

                    ],
                    "previousStatement": "EnrichmentRef",
                    "nextStatement": "EnrichmentRef",
                    "colour": 180,
                    "tooltip": "Reference to an enrichment ID",
                    "helpUrl": ""
                },
                {
                    "type": "apex_enrichment_calculation",
                    "message0": "Calculation Enrichment %1 ID: %2 %3 Enabled: %4 %5 Condition: %6 %7 Expression: %8 %9 Result Field: %10",
                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "ID", "text": "calc-1" },
                        { "type": "input_dummy" },
                        { "type": "field_checkbox", "name": "ENABLED", "checked": true },
                        { "type": "input_dummy" },

                    ],
                    "previousStatement": "Enrichment",
                    "nextStatement": "Enrichment",
                    "colour": 300,
                    "tooltip": "Performs a calculation and stores the result",
                    "helpUrl": ""
                },
                {
                    "type": "apex_enrichment_field",
                    "message0": "Field Enrichment %1 ID: %2 %3 Enabled: %4 %5 Condition: %6 %7 Transformations: %8",
                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "ID", "text": "field-enrich-1" },
                        { "type": "input_dummy" },
                        { "type": "field_checkbox", "name": "ENABLED", "checked": true },

                    ],
                    "previousStatement": "Enrichment",
                    "nextStatement": "Enrichment",

                },
                {
                    "type": "apex_field_mapping",

                    "args0": [
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "SOURCE", "text": "sourceField" },
                        { "type": "input_dummy" },
                        { "type": "field_input", "name": "TARGET", "text": "targetField" },
                        { "type": "input_dummy" },
                        { "type": "input_value", "name": "EXPRESSION", "check": ["String", "Number"] }
                    ],
                    "previousStatement": "Transformation",
                    "nextStatement": "Transformation",
                    "colour": 330,
                    "tooltip": "Maps a single field",
                    "helpUrl": ""
                },
                {
                    "type": "apex_conditional_transformation",
                    "message0": "Conditional Transformation %1 ID (Optional): %2 %3 Enabled: %4 %5 Condition: %6 %7 Actions (True): %8 %9 Actions (False): %10",
                    "args0": [

            // --- 1b. Define Dynamic Blocks ---

            // Helper function to get all rule IDs in the workspace
            function getRuleOptions() {
                var workspace = Blockly.getMainWorkspace();
                if (!workspace) return [['(no rules)', '']];

                var ruleBlocks = workspace.getBlocksByType('apex_rule', false);
                if (ruleBlocks.length === 0) return [['(no rules)', '']];

                var options = [];
                ruleBlocks.forEach(function(block) {
                    var id = block.getFieldValue('ID');
                    if (id) {
                        options.push([id, id]);
                    }
                });

                return options.length > 0 ? options : [['(no rules)', '']];
            }

            // Rule Reference block with dynamic dropdown
            Blockly.Blocks['apex_rule_ref'] = {
                init: function() {
                    this.appendDummyInput()
                        .appendField("Rule ID:")
                        .appendField(new Blockly.FieldDropdown(getRuleOptions), "RULE_ID");
                    this.setPreviousStatement(true, "RuleRef");
                    this.setNextStatement(true, "RuleRef");
                    this.setColour(180);
                    this.setTooltip("Reference to a rule ID");
                }
            };

            // --- 2. Define Generators (Block -> Object Model) ---

            const apexGenerator = new Blockly.Generator('APEX');

            apexGenerator.forBlock['apex_rule_config'] = function (block, generator) {
                const id = block.getFieldValue('ID');
                const version = block.getFieldValue('VERSION');
                const description = block.getFieldValue('DESCRIPTION');
                const author = block.getFieldValue('AUTHOR');
                const businessDomain = block.getFieldValue('BUSINESS_DOMAIN');
                const effectiveDate = block.getFieldValue('EFFECTIVE_DATE');
                const expirationDate = block.getFieldValue('EXPIRATION_DATE');
                const tagsStr = block.getFieldValue('TAGS');
                const sectionsCode = generator.statementToCode(block, 'SECTIONS');

                // Parse sections
                let rules = [];
                let ruleGroups = [];
                let enrichments = [];
                let enrichmentGroups = [];
                let transformations = [];
                let dataSourceRefs = [];

                if (sectionsCode) {
                    const sections = JSON.parse(`[${sectionsCode.replace(/,\s*$/, '')}]`);
                    sections.forEach(section => {
                        if (section.type === 'rules') rules = section.content;
                        if (section.type === 'rule-groups') ruleGroups = section.content;
                        if (section.type === 'enrichments') enrichments = section.content;
                        if (section.type === 'enrichment-groups') enrichmentGroups = section.content;
                        if (section.type === 'transformations') transformations = section.content;
                        if (section.type === 'data-source-refs') dataSourceRefs = section.content;
                    });
                }

                const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

                const metadata = {
                    id: id,
                    type: transformations.length > 0 ? "transformation-config" : "rule-config",
                    version: version
                };

                // Conditionally add optional fields
                if (description) metadata.description = description;
                if (author) metadata.author = author;
                if (businessDomain) metadata["business-domain"] = businessDomain;
                if (effectiveDate) metadata["effective-date"] = effectiveDate;
                if (expirationDate) metadata["expiration-date"] = expirationDate;
                if (tags.length > 0) metadata.tags = tags;

                const config = {
                    metadata: metadata
                };

                // Only add non-empty sections
                if (dataSourceRefs.length > 0) config["data-source-refs"] = dataSourceRefs;
                if (rules.length > 0) config.rules = rules;
                if (ruleGroups.length > 0) config["rule-groups"] = ruleGroups;
                if (enrichments.length > 0) config.enrichments = enrichments;
                if (enrichmentGroups.length > 0) config["enrichment-groups"] = enrichmentGroups;
                if (transformations.length > 0) config.transformations = transformations;

                return JSON.stringify(config, null, 2);
            };

            apexGenerator.forBlock['apex_section_data_source_refs'] = function (block, generator) {
                const refsCode = generator.statementToCode(block, 'DATA_SOURCE_REFS');

                return JSON.stringify({ type: 'data-source-refs', content: refs }) + ',';

            apexGenerator.forBlock['apex_rule'] = function (block, generator) {
                const id = block.getFieldValue('ID');
                const name = block.getFieldValue('NAME');
                const enabled = block.getFieldValue('ENABLED') === 'TRUE';
                const message = block.getFieldValue('MESSAGE');
                const severity = block.getFieldValue('SEVERITY');
                const priority = block.getFieldValue('PRIORITY');
                const category = block.getFieldValue('CATEGORY');
                const resultFieldCode = generator.valueToCode(block, 'RESULT_FIELD', 0);
                const condition = generator.valueToCode(block, 'CONDITION', 0) || "true";

            apexGenerator.forBlock['apex_action_set_field'] = function (block, generator) {
                const fieldCode = generator.valueToCode(block, 'FIELD', 0) || "'fieldName'";
                const valueCode = generator.valueToCode(block, 'VALUE', 0) || "null";

                // Process Field
                let field = fieldCode;
                if (field.startsWith("'") || field.startsWith('"')) {
                    field = field.replace(/^['"]|['"]$/g, "");
                }
                if (field.startsWith("#")) {
                    field = field.substring(1);
                }

                // Process Value
                let value = valueCode;
                if (typeof value === 'string') {
                    if (value.startsWith("'") || value.startsWith('"')) {
                        value = value.replace(/^['"]|['"]$/g, "");
                    } else if (value === "true" || value === "false") {
                        value = (value === "true");
                    } else if (!isNaN(value) && value.trim() !== '') {
                        value = Number(value);
                    }
                }

                const actionObj = {
                    "type": "set-field",
                    "field": field,
                    "value": value

            // Configuration for block ID prefixes and field names
            const BLOCK_ID_CONFIG = {

                'apex_enrichment_calculation': { prefix: 'enrichment-', field: 'ID' },

            };

            // Generate unique ID for a block type
            function generateUniqueId(workspace, blockType) {
                return generateUniqueIdExcluding(workspace, blockType, null);
            }

            // Generate unique ID for a block type, excluding a specific block ID
            function generateUniqueIdExcluding(workspace, blockType, excludeBlockId) {
                var config = BLOCK_ID_CONFIG[blockType];
                if (!config) return null;

                var prefix = config.prefix;
                var allBlocks = workspace.getAllBlocks(false);
                var existingIds = allBlocks
                    .filter(function(b) {
                        // Exclude the specified block
                        if (excludeBlockId && b.id === excludeBlockId) return false;
                        return b.getField(config.field);
                    })
                    .map(function(b) { return b.getFieldValue(config.field); })
                    .filter(function(id) { return id && id.startsWith(prefix); });

                var maxNum = 0;
                existingIds.forEach(function(id) {
                    var num = parseInt(id.substring(prefix.length), 10);
                    if (!isNaN(num) && num > maxNum) {
                        maxNum = num;
                    }
                });

                return prefix + (maxNum + 1);
            }

            // Find the first rule ID in the workspace
            function findFirstRuleId(workspace) {
                var allBlocks = workspace.getAllBlocks(false);
                for (var i = 0; i < allBlocks.length; i++) {
                    if (allBlocks[i].type === 'apex_rule') {
                        return allBlocks[i].getFieldValue('ID');
                    }
                }
                return null;
            }

            // Find the first enrichment ID in the workspace
            function findFirstEnrichmentId(workspace) {
                var allBlocks = workspace.getAllBlocks(false);
                for (var i = 0; i < allBlocks.length; i++) {
                    var t = allBlocks[i].type;
                    if (t === 'apex_enrichment_calculation' || t === 'apex_enrichment_field' || t === 'apex_enrichment_lookup') {
                        return allBlocks[i].getFieldValue('ID');
                    }
                }
                return null;
            }

            // Create context menu handler for a specific block type
            function createContextMenuHandler(blockType) {
                return function(options) {
                    var menuItems = CONTEXT_MENU_CONFIG[blockType];
                    var self = this;

                    for (var i = 0; i < menuItems.length; i++) {
                        (function(item) {
                            var input = self.getInput(item.input);
                            if (!input) return;

                            var isStack = input.type === Blockly.NEXT_STATEMENT;
                            var isConnected = input.connection && input.connection.targetConnection;

                            if (!isStack && isConnected) return;

                            options.push({
                                enabled: true,
                                text: item.text,
                                callback: function() {
                                    var workspace = self.workspace;
                                    var newBlock = workspace.newBlock(item.type);
                                    newBlock.initSvg();
                                    newBlock.render();

                                    // Auto-generate unique ID for blocks with ID fields
                                    var uniqueId = generateUniqueId(workspace, item.type);
                                    if (uniqueId) {
                                        newBlock.setFieldValue(uniqueId, 'ID');
                                    }

                                    // If creating a rule reference, use the first rule's ID
                                    if (item.type === 'apex_rule_ref') {
                                        var firstRuleId = findFirstRuleId(workspace);
                                        if (firstRuleId) {
                                            newBlock.setFieldValue(firstRuleId, 'RULE_ID');
                                        }
                                    }

                                    // If creating an enrichment reference, use the first enrichment's ID
                                    if (item.type === 'apex_enrichment_ref') {
                                        var firstEnrichmentId = findFirstEnrichmentId(workspace);
                                        if (firstEnrichmentId) {
                                            newBlock.setFieldValue(firstEnrichmentId, 'ENRICHMENT_ID');
                                        }
                                    }

                                    var parentConnection = input.connection;

                                    if (isStack) {
                                        while (parentConnection.targetConnection) {
                                            parentConnection = parentConnection.targetConnection.sourceBlock_.nextConnection;
                                            if (!parentConnection) break;
                                        }
                                        if (parentConnection) {
                                            parentConnection.connect(newBlock.previousConnection);
                                        }
                                    } else {
                                        var childConnection = newBlock.outputConnection || newBlock.previousConnection;
                                        parentConnection.connect(childConnection);
                                    }

                                    newBlock.select();
                                }
                            });
                        })(menuItems[i]);
                    }
                };
            }

            // Apply Context Menus
            for (var blockType in CONTEXT_MENU_CONFIG) {
                if (CONTEXT_MENU_CONFIG.hasOwnProperty(blockType) && Blockly.Blocks[blockType]) {
                    Blockly.Blocks[blockType].customContextMenu = createContextMenuHandler(blockType);

            // --- 4. Live Update Logic ---

            function updateYaml() {
                const topBlocks = workspace.getTopBlocks(true); // Order by position
                if (topBlocks.length === 0) {
                    document.getElementById('yamlOutput').textContent = "# Drag 'Configuration' or 'Data Source Config' block to start";
                    return;
                }

                const configBlocks = topBlocks.filter(b => b.type === 'apex_rule_config' || b.type === 'apex_data_source_config');

                if (configBlocks.length === 0) {
                    document.getElementById('yamlOutput').innerHTML = '<span class="yaml-comment"># Please start with a \'Configuration\' or \'Data Source Config\' block</span>';
                    return;
                }

                try {
                    const yamlParts = [];

                    configBlocks.forEach(block => {
                        const jsonStr = apexGenerator.blockToCode(block);
                        if (jsonStr && jsonStr.trim()) {
                            const jsonObj = JSON.parse(jsonStr);
                            const yamlStr = jsyaml.dump(jsonObj);
                            yamlParts.push(yamlStr);
                        }
                    });

                    if (yamlParts.length > 0) {
                        const yamlText = yamlParts.join('\n---\n');
                        currentYamlText = yamlText; // Store for copy/download
                        renderYamlWithPrism(yamlText);
                    }
                } catch (e) {
                    console.error(e);
                    document.getElementById('yamlOutput').innerHTML = '<pre style="color: #6a9955;"># Error generating YAML: ' + e.message + '</pre>';
                }

            // --- 4b. Render YAML with Prism.js and APEX keyword highlighting ---
            function renderYamlWithPrism(yamlText) {
                const outputDiv = document.getElementById('yamlOutput');
                outputDiv.innerHTML = '<pre><code class="language-yaml" id="yaml-code"></code></pre>';

                const codeElement = document.getElementById('yaml-code');
                codeElement.textContent = yamlText;

                // Apply Prism syntax highlighting
                Prism.highlightElement(codeElement);

                // Apply APEX keyword colorization
                applyApexKeywordColors(codeElement);
            }

            // APEX keyword categories for colorization (matching d3-tree-viewer)
            const APEX_KEYWORDS = {
                metadata: ['metadata', 'id', 'type', 'version', 'description', 'author', 'business-domain', 'effective-date', 'expiration-date', 'tags'],
                rules: ['rules', 'rule', 'condition', 'message', 'severity', 'priority', 'category', 'result-field', 'error-code', 'success-code'],
                enrichment: ['enrichments', 'enrichment', 'enrichment-groups', 'field-mappings', 'source-field', 'target-field', 'expression', 'calculation-config', 'lookup-config', 'lookup-key', 'lookup-dataset', 'field-enrichment', 'calculation-enrichment', 'lookup-enrichment'],
                rulegroup: ['rule-groups', 'rule-group', 'rule-ids', 'operator', 'enrichment-ids'],

                scenario: ['scenario', 'scenarios', 'input-type', 'rule-config', 'enrichment-config'],
                pipeline: ['pipeline', 'pipelines', 'stages', 'stage', 'mode', 'error-handling', 'max-retries', 'retry-delay-ms'],
                common: ['enabled', 'name', 'source', 'value', 'field', 'key-field']
            };

            function applyApexKeywordColors(codeElement) {
                // Find all Prism key tokens and apply APEX-specific colors
                const keyTokens = codeElement.querySelectorAll('.token.key, .token.atrule');

                keyTokens.forEach(token => {
                    const text = token.textContent.trim();

                    for (const [category, keywords] of Object.entries(APEX_KEYWORDS)) {
                        if (keywords.includes(text)) {
                            token.classList.add('apex-' + category);
                            break;
                        }
                    }
                });

                // Highlight SpEL expressions (strings containing #)
                const stringTokens = codeElement.querySelectorAll('.token.string');
                stringTokens.forEach(token => {
                    if (token.textContent.includes('#')) {
                        token.classList.add('apex-spel');
                    }
                });
            }

            // --- 5. Download Function ---
            function downloadYaml() {
                const yamlContent = currentYamlText || document.getElementById('yamlOutput').textContent;
                const blob = new Blob([yamlContent], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'apex-rules.yaml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // --- 5a. Copy to Clipboard Function ---
            function copyYamlToClipboard() {
                const yamlContent = currentYamlText || document.getElementById('yamlOutput').textContent;
                const btn = event.target;

                // Create temporary textarea for copying
                const textarea = document.createElement('textarea');
                textarea.value = yamlContent;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                document.body.appendChild(textarea);
                textarea.select();

                try {
                    document.execCommand('copy');
                    // Brief visual feedback
                    const originalText = btn.textContent;
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = originalText; }, 1000);
                } catch (err) {
                    console.error('Failed to copy:', err);
                    alert('Failed to copy to clipboard');

                    document.body.removeChild(textarea);

            function openYamlImportModal() {
