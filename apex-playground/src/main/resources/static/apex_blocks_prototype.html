            // --- 5d. Template Functions ---

            const TEMPLATES_STORAGE_KEY = 'apex_visual_editor_templates';

            function getTemplates() {
                try {
                    const stored = localStorage.getItem(TEMPLATES_STORAGE_KEY);
                    return stored ? JSON.parse(stored) : [];
                } catch (e) {
                    console.error('Error loading templates:', e);
                    return [];
                }
            }

            function saveTemplates(templates) {
                try {
                    localStorage.setItem(TEMPLATES_STORAGE_KEY, JSON.stringify(templates));
                } catch (e) {
                    console.error('Error saving templates:', e);
                    alert('Error saving template: ' + e.message);
                }
            }

            function openSaveTemplateModal() {
                document.getElementById('saveTemplateModal').style.display = 'flex';
                document.getElementById('templateNameInput').value = '';
                document.getElementById('templateDescInput').value = '';
                document.getElementById('templateNameInput').focus();
            }

            function closeSaveTemplateModal() {
                document.getElementById('saveTemplateModal').style.display = 'none';
            }

            function saveTemplate() {
                const name = document.getElementById('templateNameInput').value.trim();
                if (!name) {
                    alert('Please enter a template name.');
                    return;
                }

                const description = document.getElementById('templateDescInput').value.trim();

                // Serialize the current workspace
                const state = Blockly.serialization.workspaces.save(workspace);

                const templates = getTemplates();

                // Check if template with same name exists
                const existingIndex = templates.findIndex(t => t.name === name);
                if (existingIndex >= 0) {
                    if (!confirm('A template with this name already exists. Overwrite?')) {
                        return;
                    }
                    templates[existingIndex] = {
                        name: name,
                        description: description,
                        state: state,
                        createdAt: templates[existingIndex].createdAt,
                        updatedAt: new Date().toISOString()
                    };
                } else {
                    templates.push({
                        name: name,
                        description: description,
                        state: state,
                        createdAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                }

                saveTemplates(templates);
                closeSaveTemplateModal();

                // Refresh the toolbox to show the new template
                workspace.updateToolbox(document.getElementById('toolbox'));

                alert('Template "' + name + '" saved successfully!');
            }

            function loadTemplate(templateName) {
                const templates = getTemplates();
                const template = templates.find(t => t.name === templateName);

                if (!template) {
                    alert('Template not found.');
                    return;
                }

                if (workspace.getAllBlocks(false).length > 0) {
                    if (!confirm('This will replace all current blocks. Continue?')) {
                        return;
                    }
                }

                workspace.clear();
                Blockly.serialization.workspaces.load(template.state, workspace);
                updateYaml();
            }

            function deleteTemplate(templateName) {
                if (!confirm('Delete template "' + templateName + '"?')) {
                    return;
                }

                const templates = getTemplates();
                const filtered = templates.filter(t => t.name !== templateName);
                saveTemplates(filtered);

                // Refresh the toolbox
                workspace.updateToolbox(document.getElementById('toolbox'));

                // Refresh the manage modal if open
                if (document.getElementById('manageTemplatesModal').style.display === 'flex') {
                    renderTemplatesList();
                }
            }

            function openManageTemplatesModal() {
                document.getElementById('manageTemplatesModal').style.display = 'flex';
                renderTemplatesList();
            }

            function closeManageTemplatesModal() {
                document.getElementById('manageTemplatesModal').style.display = 'none';
            }

            function renderTemplatesList() {
                const templates = getTemplates();
                const container = document.getElementById('templatesList');

                if (templates.length === 0) {
                    container.innerHTML = '<p style="color: #bdc3c7; text-align: center;">No templates saved yet.</p>';
                    return;
                }

                let html = '';
                templates.forEach(function(template) {
                    const date = new Date(template.updatedAt || template.createdAt).toLocaleDateString();
                    html += '<div style="background: #34495e; padding: 0.75rem; border-radius: 4px; margin-bottom: 0.5rem;">';
                    html += '<div style="display: flex; justify-content: space-between; align-items: center;">';
                    html += '<div>';
                    html += '<strong style="color: white;">' + escapeHtml(template.name) + '</strong>';
                    html += '<span style="color: #7f8c8d; font-size: 0.8rem; margin-left: 0.5rem;">' + date + '</span>';
                    if (template.description) {
                        html += '<p style="color: #bdc3c7; margin: 0.25rem 0 0 0; font-size: 0.85rem;">' + escapeHtml(template.description) + '</p>';
                    }
                    html += '</div>';
                    html += '<div style="display: flex; gap: 0.25rem;">';
                    html += '<button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem;" onclick="loadTemplate(\'' + escapeHtml(template.name).replace(/'/g, "\\'") + '\'); closeManageTemplatesModal();">Load</button>';
                    html += '<button class="btn" style="padding: 0.25rem 0.5rem; font-size: 0.75rem; background-color: #c0392b;" onclick="deleteTemplate(\'' + escapeHtml(template.name).replace(/'/g, "\\'") + '\')">Delete</button>';
                    html += '</div>';
                    html += '</div>';
                    html += '</div>';
                });

                container.innerHTML = html;
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }

            // Register custom toolbox category for Templates
            // Store button callbacks for testing access
            var templateButtonCallbacks = {};

            function registerTemplatesCategory() {
                const templatesCallback = function(ws) {
                    const templates = getTemplates();
                    const blockList = [];

                    // Add "Manage Templates" button
                    const manageButton = document.createElement('button');
                    manageButton.setAttribute('text', 'Manage Templates');
                    manageButton.setAttribute('callbackKey', 'manageTemplates');
                    blockList.push(manageButton);

                    if (templates.length === 0) {
                        // Add a label indicating no templates
                        const label = document.createElement('label');
                        label.setAttribute('text', 'No templates saved');
                        blockList.push(label);
                    } else {
                        // Add a label
                        const label = document.createElement('label');
                        label.setAttribute('text', 'Click to load:');
                        blockList.push(label);

                        // Add each template as a button and register its callback
                        templates.forEach(function(template) {
                            const button = document.createElement('button');
                            button.setAttribute('text', template.name);
                            const callbackKey = 'loadTemplate_' + template.name;
                            button.setAttribute('callbackKey', callbackKey);
                            blockList.push(button);

                            // Create and store callback for this template
                            var callback = function() {
                                loadTemplate(template.name);
                            };
                            templateButtonCallbacks[callbackKey] = callback;

                            // Register callback for this template (re-registers each time category is opened)
                            workspace.registerButtonCallback(callbackKey, callback);
                        });
                    }

                    return blockList;
                };

                workspace.registerToolboxCategoryCallback('TEMPLATES', templatesCallback);

                // Register the manage templates button callback
                workspace.registerButtonCallback('manageTemplates', function() {
                    openManageTemplatesModal();
                });
            }

            // Function to trigger a template button callback (for testing)
            function triggerTemplateCallback(callbackKey) {
                if (templateButtonCallbacks[callbackKey]) {
                    templateButtonCallbacks[callbackKey]();
                    return true;
                }
                return false;
            }

            function importYamlToBlocks() {
                const yamlText = document.getElementById('yamlImportInput').value.trim();
                if (!yamlText) {
                    alert('Please paste YAML content to import.');
                    return;
                }

                try {
                    const config = jsyaml.load(yamlText);
                    if (!config || !config.metadata) {
                        alert('Invalid APEX YAML: missing metadata section.');
                        return;
                    }

                    // Clear existing blocks
                    workspace.clear();

                    // Determine config type and create root block
                    const configType = config.metadata.type || 'rule-config';

                    if (configType === 'data-source-config') {
                        createDataSourceConfigBlock(config);
                    } else {
                        createRuleConfigBlock(config);
                    }

                    closeYamlImportModal();
                    updateYaml();

                } catch (e) {
                    console.error('YAML Import Error:', e);
                    alert('Error parsing YAML: ' + e.message);
                }
            }

            function createRuleConfigBlock(config) {
                const block = workspace.newBlock('apex_rule_config');
                const meta = config.metadata || {};

                block.setFieldValue(meta.id || 'imported-config', 'ID');
                block.setFieldValue(meta.version || '1.0.0', 'VERSION');
                block.setFieldValue(meta.description || '', 'DESCRIPTION');
                block.setFieldValue(meta.author || '', 'AUTHOR');
                block.setFieldValue(meta['business-domain'] || '', 'BUSINESS_DOMAIN');
                block.setFieldValue(meta['effective-date'] || '', 'EFFECTIVE_DATE');
                block.setFieldValue(meta['expiration-date'] || '', 'EXPIRATION_DATE');
                block.setFieldValue((meta.tags || []).join(', '), 'TAGS');

                block.initSvg();
                block.render();
                block.moveBy(50, 50);

                let lastSectionBlock = null;

                // Create Data Source Refs Section
                if (config['data-source-refs'] && config['data-source-refs'].length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_data_source_refs', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastRefBlock = null;
                    config['data-source-refs'].forEach(ref => {
                        const refBlock = workspace.newBlock('apex_data_source_ref');
                        refBlock.setFieldValue(ref.name || '', 'NAME');
                        refBlock.setFieldValue(ref.source || '', 'SOURCE');
                        refBlock.setFieldValue(ref.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                        refBlock.setFieldValue(ref.description || '', 'DESCRIPTION');
                        refBlock.initSvg();
                        refBlock.render();

                        connectToStatement(sectionBlock, 'DATA_SOURCE_REFS', refBlock, lastRefBlock);
                        lastRefBlock = refBlock;
                    });
                }

                // Create Rules Section
                if (config.rules && config.rules.length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_rules', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastRuleBlock = null;
                    config.rules.forEach(rule => {
                        const ruleBlock = createRuleBlock(rule);
                        connectToStatement(sectionBlock, 'RULES', ruleBlock, lastRuleBlock);
                        lastRuleBlock = ruleBlock;
                    });
                }

                // Create Rule Groups Section
                if (config['rule-groups'] && config['rule-groups'].length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_rule_groups', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastGroupBlock = null;
                    config['rule-groups'].forEach(group => {
                        const groupBlock = createRuleGroupBlock(group);
                        connectToStatement(sectionBlock, 'RULE_GROUPS', groupBlock, lastGroupBlock);
                        lastGroupBlock = groupBlock;
                    });
                }

                // Create Enrichments Section
                if (config.enrichments && config.enrichments.length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_enrichments', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastEnrichBlock = null;
                    config.enrichments.forEach(enrich => {
                        const enrichBlock = createEnrichmentBlock(enrich);
                        if (enrichBlock) {
                            connectToStatement(sectionBlock, 'ENRICHMENTS', enrichBlock, lastEnrichBlock);
                            lastEnrichBlock = enrichBlock;
                        }
                    });
                }

                // Create Enrichment Groups Section
                if (config['enrichment-groups'] && config['enrichment-groups'].length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_enrichment_groups', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastGroupBlock = null;
                    config['enrichment-groups'].forEach(group => {
                        const groupBlock = createEnrichmentGroupBlock(group);
                        connectToStatement(sectionBlock, 'ENRICHMENT_GROUPS', groupBlock, lastGroupBlock);
                        lastGroupBlock = groupBlock;
                    });
                }

                // Create Transformations Section
                if (config.transformations && config.transformations.length > 0) {
                    const sectionBlock = createSectionBlock('apex_section_transformations', block, 'SECTIONS', lastSectionBlock);
                    lastSectionBlock = sectionBlock;

                    let lastTransformBlock = null;
                    config.transformations.forEach(transform => {
                        const transformBlock = createTransformationBlock(transform);
                        if (transformBlock) {
                            connectToStatement(sectionBlock, 'TRANSFORMATIONS', transformBlock, lastTransformBlock);
                            lastTransformBlock = transformBlock;
                        }
                    });
                }

                return block;
            }

            function createDataSourceConfigBlock(config) {
                const block = workspace.newBlock('apex_data_source_config');
                const meta = config.metadata || {};

                block.setFieldValue(meta.id || 'imported-ds-config', 'ID');
                block.setFieldValue(meta.version || '1.0.0', 'VERSION');
                block.setFieldValue(meta.description || '', 'DESCRIPTION');
                block.setFieldValue(meta.author || '', 'AUTHOR');
                block.setFieldValue(meta['business-domain'] || '', 'BUSINESS_DOMAIN');
                block.setFieldValue(meta['effective-date'] || '', 'EFFECTIVE_DATE');
                block.setFieldValue(meta['expiration-date'] || '', 'EXPIRATION_DATE');
                block.setFieldValue((meta.tags || []).join(', '), 'TAGS');

                block.initSvg();
                block.render();
                block.moveBy(50, 50);

                // Create Data Sources
                if (config['data-sources'] && config['data-sources'].length > 0) {
                    let lastDsBlock = null;
                    config['data-sources'].forEach(ds => {
                        const dsBlock = createDataSourceBlock(ds);
                        if (dsBlock) {
                            connectToStatement(block, 'DATA_SOURCES', dsBlock, lastDsBlock);
                            lastDsBlock = dsBlock;
                        }
                    });
                }

                return block;
            }

            function createSectionBlock(type, parentBlock, inputName, lastSectionBlock) {
                const sectionBlock = workspace.newBlock(type);
                sectionBlock.initSvg();
                sectionBlock.render();

                const input = parentBlock.getInput(inputName);
                if (lastSectionBlock) {
                    lastSectionBlock.nextConnection.connect(sectionBlock.previousConnection);
                } else if (input && input.connection) {
                    input.connection.connect(sectionBlock.previousConnection);
                }

                return sectionBlock;
            }

            function connectToStatement(parentBlock, inputName, childBlock, lastBlock) {
                if (lastBlock) {
                    lastBlock.nextConnection.connect(childBlock.previousConnection);
                } else {
                    const input = parentBlock.getInput(inputName);
                    if (input && input.connection) {
                        input.connection.connect(childBlock.previousConnection);
                    }
                }
            }

            function createRuleBlock(rule) {
                const block = workspace.newBlock('apex_rule');
                block.setFieldValue(rule.id || '', 'ID');
                block.setFieldValue(rule.name || '', 'NAME');
                block.setFieldValue(rule.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.setFieldValue(rule.message || '', 'MESSAGE');
                block.setFieldValue(rule.severity || 'ERROR', 'SEVERITY');
                block.setFieldValue(rule.priority !== undefined ? String(rule.priority) : '', 'PRIORITY');
                block.setFieldValue(rule.category || '', 'CATEGORY');
                block.initSvg();
                block.render();

                // Create condition block if present
                if (rule.condition) {
                    const conditionBlock = createConditionBlock(rule.condition);
                    if (conditionBlock) {
                        const condInput = block.getInput('CONDITION');
                        if (condInput && condInput.connection) {
                            condInput.connection.connect(conditionBlock.outputConnection);
                        }
                    }
                }

                // Create result-field block if present
                if (rule['result-field']) {
                    const textBlock = workspace.newBlock('text');
                    textBlock.setFieldValue(rule['result-field'], 'TEXT');
                    textBlock.initSvg();
                    textBlock.render();
                    const rfInput = block.getInput('RESULT_FIELD');
                    if (rfInput && rfInput.connection) {
                        rfInput.connection.connect(textBlock.outputConnection);
                    }
                }

                return block;
            }

            function createRuleGroupBlock(group) {
                const block = workspace.newBlock('apex_rule_group');
                block.setFieldValue(group.id || '', 'ID');
                block.setFieldValue(group.name || '', 'NAME');
                block.setFieldValue(group.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.setFieldValue(group.operator || 'AND', 'OPERATOR');
                block.initSvg();
                block.render();

                // Create rule references
                const ruleIds = group['rule-ids'] || [];
                let lastRefBlock = null;
                ruleIds.forEach(ruleId => {
                    const refBlock = workspace.newBlock('apex_rule_ref');
                    refBlock.setFieldValue(ruleId, 'RULE_ID');
                    refBlock.initSvg();
                    refBlock.render();
                    connectToStatement(block, 'RULE_IDS', refBlock, lastRefBlock);
                    lastRefBlock = refBlock;
                });

                return block;
            }

            function createEnrichmentGroupBlock(group) {
                const block = workspace.newBlock('apex_enrichment_group');
                block.setFieldValue(group.id || '', 'ID');
                block.setFieldValue(group.name || '', 'NAME');
                block.setFieldValue(group.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.setFieldValue(group.operator || 'AND', 'OPERATOR');
                block.initSvg();
                block.render();

                // Create enrichment references
                const enrichmentIds = group['enrichment-ids'] || [];
                let lastRefBlock = null;
                enrichmentIds.forEach(enrichId => {
                    const refBlock = workspace.newBlock('apex_enrichment_ref');
                    refBlock.setFieldValue(enrichId, 'ENRICHMENT_ID');
                    refBlock.initSvg();
                    refBlock.render();
                    connectToStatement(block, 'ENRICHMENT_IDS', refBlock, lastRefBlock);
                    lastRefBlock = refBlock;
                });

                return block;
            }

            function createEnrichmentBlock(enrich) {
                const type = enrich.type || '';

                if (type === 'calculation-enrichment') {
                    return createCalculationEnrichmentBlock(enrich);
                } else if (type === 'field-enrichment') {
                    return createFieldEnrichmentBlock(enrich);
                } else if (type === 'lookup-enrichment') {
                    return createLookupEnrichmentBlock(enrich);
                }

                return null;
            }

            function createCalculationEnrichmentBlock(enrich) {
                const block = workspace.newBlock('apex_enrichment_calculation');
                block.setFieldValue(enrich.id || '', 'ID');
                block.setFieldValue(enrich.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');

                const calcConfig = enrich['calculation-config'] || {};
                block.setFieldValue(calcConfig['result-field'] || '', 'RESULT_FIELD');
                block.initSvg();
                block.render();

                // Create condition
                if (enrich.condition) {
                    const condBlock = createConditionBlock(enrich.condition);
                    if (condBlock) {
                        const condInput = block.getInput('CONDITION');
                        if (condInput && condInput.connection) {
                            condInput.connection.connect(condBlock.outputConnection);
                        }
                    }
                }

                // Create expression
                if (calcConfig.expression) {
                    const exprBlock = workspace.newBlock('text');
                    exprBlock.setFieldValue(calcConfig.expression, 'TEXT');
                    exprBlock.initSvg();
                    exprBlock.render();
                    const exprInput = block.getInput('EXPRESSION');
                    if (exprInput && exprInput.connection) {
                        exprInput.connection.connect(exprBlock.outputConnection);
                    }
                }

                return block;
            }

            function createFieldEnrichmentBlock(enrich) {
                const block = workspace.newBlock('apex_enrichment_field');
                block.setFieldValue(enrich.id || '', 'ID');
                block.setFieldValue(enrich.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.initSvg();
                block.render();

                // Create condition
                if (enrich.condition) {
                    const condBlock = createConditionBlock(enrich.condition);
                    if (condBlock) {
                        const condInput = block.getInput('CONDITION');
                        if (condInput && condInput.connection) {
                            condInput.connection.connect(condBlock.outputConnection);
                        }
                    }
                }

                // Create field mappings
                const mappings = enrich['field-mappings'] || [];
                let lastMappingBlock = null;
                mappings.forEach(mapping => {
                    const mappingBlock = createFieldMappingBlock(mapping);
                    connectToStatement(block, 'MAPPINGS', mappingBlock, lastMappingBlock);
                    lastMappingBlock = mappingBlock;
                });

                return block;
            }

            function createLookupEnrichmentBlock(enrich) {
                const block = workspace.newBlock('apex_enrichment_lookup');
                block.setFieldValue(enrich.id || '', 'ID');
                block.setFieldValue(enrich.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.initSvg();
                block.render();

                // Create condition
                if (enrich.condition) {
                    const condBlock = createConditionBlock(enrich.condition);
                    if (condBlock) {
                        const condInput = block.getInput('CONDITION');
                        if (condInput && condInput.connection) {
                            condInput.connection.connect(condBlock.outputConnection);
                        }
                    }
                }

                // Create lookup key
                const lookupConfig = enrich['lookup-config'] || {};
                if (lookupConfig['lookup-key']) {
                    const keyBlock = createConditionBlock(lookupConfig['lookup-key']);
                    if (keyBlock) {
                        const keyInput = block.getInput('KEY');
                        if (keyInput && keyInput.connection) {
                            keyInput.connection.connect(keyBlock.outputConnection);
                        }
                    }
                }

                // Create dataset config
                const dataset = lookupConfig['lookup-dataset'];
                if (dataset) {
                    const datasetBlock = createDatasetBlock(dataset);
                    if (datasetBlock) {
                        const dsInput = block.getInput('DATASET');
                        if (dsInput && dsInput.connection) {
                            dsInput.connection.connect(datasetBlock.outputConnection);
                        }
                    }
                }

                // Create field mappings
                const mappings = enrich['field-mappings'] || [];
                let lastMappingBlock = null;
                mappings.forEach(mapping => {
                    const mappingBlock = createFieldMappingBlock(mapping);
                    connectToStatement(block, 'MAPPINGS', mappingBlock, lastMappingBlock);
                    lastMappingBlock = mappingBlock;
                });

                return block;
            }

            function createDatasetBlock(dataset) {
                const type = dataset.type || 'reference';

                if (type === 'reference') {
                    const block = workspace.newBlock('apex_lookup_dataset_reference');
                    block.setFieldValue(dataset.id || '', 'ID');
                    block.setFieldValue(dataset['key-field'] || '', 'KEY_FIELD');
                    block.initSvg();
                    block.render();
                    return block;
                } else if (type === 'database') {
                    const block = workspace.newBlock('apex_lookup_dataset_database');
                    block.setFieldValue(dataset['data-source-ref'] || '', 'DS_REF');
                    block.setFieldValue(dataset.query || '', 'QUERY');
                    block.initSvg();
                    block.render();

                    // Create parameters
                    const params = dataset.parameters || [];
                    let lastParamBlock = null;
                    params.forEach(param => {
                        const paramBlock = workspace.newBlock('apex_lookup_parameter');
                        paramBlock.setFieldValue(param.field || '', 'FIELD');
                        paramBlock.setFieldValue(param.type || 'string', 'TYPE');
                        paramBlock.initSvg();
                        paramBlock.render();
                        connectToStatement(block, 'PARAMETERS', paramBlock, lastParamBlock);
                        lastParamBlock = paramBlock;
                    });

                    return block;
                }

                return null;
            }

            function createFieldMappingBlock(mapping) {
                const block = workspace.newBlock('apex_field_mapping');
                block.setFieldValue(mapping['source-field'] || '', 'SOURCE');
                block.setFieldValue(mapping['target-field'] || '', 'TARGET');
                block.initSvg();
                block.render();

                if (mapping.expression) {
                    const exprBlock = workspace.newBlock('text');
                    exprBlock.setFieldValue(mapping.expression, 'TEXT');
                    exprBlock.initSvg();
                    exprBlock.render();
                    const exprInput = block.getInput('EXPRESSION');
                    if (exprInput && exprInput.connection) {
                        exprInput.connection.connect(exprBlock.outputConnection);
                    }
                }

                return block;
            }

            function createTransformationBlock(transform) {
                const type = transform.type || '';

                if (type === 'conditional-transformation') {
                    return createConditionalTransformationBlock(transform);
                } else if (type === 'set-field') {
                    return createSetFieldBlock(transform);
                }

                return null;
            }

            function createConditionalTransformationBlock(transform) {
                const block = workspace.newBlock('apex_conditional_transformation');
                block.setFieldValue(transform.id || '', 'ID');
                block.setFieldValue(transform.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                block.initSvg();
                block.render();

                // Process transformation rules (take first one for now)
                const rules = transform['transformation-rules'] || [];
                if (rules.length > 0) {
                    const rule = rules[0];

                    // Create condition
                    if (rule.condition) {
                        const condBlock = createConditionBlock(rule.condition);
                        if (condBlock) {
                            const condInput = block.getInput('CONDITION');
                            if (condInput && condInput.connection) {
                                condInput.connection.connect(condBlock.outputConnection);
                            }
                        }
                    }

                    // Create actions-true
                    const actionsTrue = rule['actions-true'] || [];
                    let lastTrueBlock = null;
                    actionsTrue.forEach(action => {
                        const actionBlock = createTransformationBlock(action);
                        if (actionBlock) {
                            connectToStatement(block, 'ACTIONS_TRUE', actionBlock, lastTrueBlock);
                            lastTrueBlock = actionBlock;
                        }
                    });

                    // Create actions-false
                    const actionsFalse = rule['actions-false'] || [];
                    let lastFalseBlock = null;
                    actionsFalse.forEach(action => {
                        const actionBlock = createTransformationBlock(action);
                        if (actionBlock) {
                            connectToStatement(block, 'ACTIONS_FALSE', actionBlock, lastFalseBlock);
                            lastFalseBlock = actionBlock;
                        }
                    });
                }

                return block;
            }

            function createSetFieldBlock(action) {
                const block = workspace.newBlock('apex_action_set_field');
                block.initSvg();
                block.render();

                // Create field reference
                if (action.field) {
                    const fieldBlock = workspace.newBlock('apex_field_ref');
                    fieldBlock.setFieldValue(action.field, 'FIELD');
                    fieldBlock.initSvg();
                    fieldBlock.render();
                    const fieldInput = block.getInput('FIELD');
                    if (fieldInput && fieldInput.connection) {
                        fieldInput.connection.connect(fieldBlock.outputConnection);
                    }
                }

                // Create value
                if (action.value !== undefined) {
                    let valueBlock;
                    if (typeof action.value === 'boolean') {
                        valueBlock = workspace.newBlock('logic_boolean');
                        valueBlock.setFieldValue(action.value ? 'TRUE' : 'FALSE', 'BOOL');
                    } else if (typeof action.value === 'number') {
                        valueBlock = workspace.newBlock('math_number');
                        valueBlock.setFieldValue(action.value, 'NUM');
                    } else {
                        valueBlock = workspace.newBlock('text');
                        valueBlock.setFieldValue(String(action.value), 'TEXT');
                    }
                    valueBlock.initSvg();
                    valueBlock.render();
                    const valueInput = block.getInput('VALUE');
                    if (valueInput && valueInput.connection) {
                        valueInput.connection.connect(valueBlock.outputConnection);
                    }
                }

                return block;
            }

            function createDataSourceBlock(ds) {
                const type = ds.type || '';

                if (type === 'DATABASE') {
                    const block = workspace.newBlock('apex_data_source_database');
                    block.setFieldValue(ds.id || '', 'ID');
                    block.setFieldValue(ds.name || '', 'NAME');
                    block.setFieldValue(ds.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                    block.setFieldValue(ds.description || '', 'DESCRIPTION');

                    const connConfig = ds['connection-config'] || {};
                    block.setFieldValue(connConfig.host || 'localhost', 'HOST');
                    block.setFieldValue(connConfig.port || 5432, 'PORT');
                    block.setFieldValue(connConfig.database || '', 'DATABASE');
                    block.setFieldValue(connConfig.username || '', 'USERNAME');
                    block.setFieldValue(connConfig.password || '', 'PASSWORD');
                    block.initSvg();
                    block.render();

                    // Create queries
                    const queries = ds.queries || [];
                    let lastQueryBlock = null;
                    queries.forEach(query => {
                        const queryBlock = workspace.newBlock('apex_data_source_query');
                        queryBlock.setFieldValue(query.id || '', 'ID');
                        queryBlock.setFieldValue(query.name || '', 'NAME');
                        queryBlock.setFieldValue(query.query || '', 'QUERY');
                        queryBlock.initSvg();
                        queryBlock.render();
                        connectToStatement(block, 'QUERIES', queryBlock, lastQueryBlock);
                        lastQueryBlock = queryBlock;
                    });

                    return block;
                } else if (type === 'REST_API') {
                    const block = workspace.newBlock('apex_data_source_rest');
                    block.setFieldValue(ds.id || '', 'ID');
                    block.setFieldValue(ds.name || '', 'NAME');
                    block.setFieldValue(ds.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                    block.setFieldValue(ds.description || '', 'DESCRIPTION');

                    const connConfig = ds['connection-config'] || {};
                    block.setFieldValue(connConfig['base-url'] || '', 'BASE_URL');
                    block.setFieldValue(connConfig.timeout || 30000, 'TIMEOUT');
                    block.initSvg();
                    block.render();

                    // Create endpoints
                    const endpoints = ds.endpoints || [];
                    let lastEndpointBlock = null;
                    endpoints.forEach(ep => {
                        const epBlock = workspace.newBlock('apex_data_source_endpoint');
                        epBlock.setFieldValue(ep.id || '', 'ID');
                        epBlock.setFieldValue(ep.name || '', 'NAME');
                        epBlock.setFieldValue(ep.path || '', 'PATH');
                        epBlock.initSvg();
                        epBlock.render();
                        connectToStatement(block, 'ENDPOINTS', epBlock, lastEndpointBlock);
                        lastEndpointBlock = epBlock;
                    });

                    return block;
                } else if (type === 'FILE_SYSTEM') {
                    const block = workspace.newBlock('apex_data_source_file');
                    block.setFieldValue(ds.id || '', 'ID');
                    block.setFieldValue(ds.name || '', 'NAME');
                    block.setFieldValue(ds.enabled !== false ? 'TRUE' : 'FALSE', 'ENABLED');
                    block.setFieldValue(ds.description || '', 'DESCRIPTION');

                    const connConfig = ds['connection-config'] || {};
                    block.setFieldValue(connConfig['base-path'] || '', 'BASE_PATH');
                    block.setFieldValue(connConfig['file-pattern'] || '', 'FILE_PATTERN');
                    block.setFieldValue(connConfig.format || 'csv', 'FORMAT');
                    block.initSvg();
                    block.render();

                    return block;
                }

                return null;
            }

            function createConditionBlock(condition) {
                if (typeof condition !== 'string') return null;

                const trimmed = condition.trim();

                // Try to parse complex conditions (with && or ||)
                const logicMatch = trimmed.match(/^(.+?)\s*(&&|\|\|)\s*(.+)$/);
                if (logicMatch) {
                    const block = workspace.newBlock('apex_condition_logic');
                    block.setFieldValue(logicMatch[2], 'OP');
                    block.initSvg();
                    block.render();

                    const leftBlock = createConditionBlock(logicMatch[1]);
                    if (leftBlock) {
                        const aInput = block.getInput('A');
                        if (aInput && aInput.connection) {
                            aInput.connection.connect(leftBlock.outputConnection);
                        }
                    }

                    const rightBlock = createConditionBlock(logicMatch[3]);
                    if (rightBlock) {
                        const bInput = block.getInput('B');
                        if (bInput && bInput.connection) {
                            bInput.connection.connect(rightBlock.outputConnection);
                        }
                    }

                    return block;
                }

                // Try to parse comparison (==, !=, >, <, >=, <=)
                const compareMatch = trimmed.match(/^(.+?)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);
                if (compareMatch) {
                    const block = workspace.newBlock('apex_condition_compare');
                    block.setFieldValue(compareMatch[2], 'OP');
                    block.initSvg();
                    block.render();

                    const leftBlock = createValueBlock(compareMatch[1].trim());
                    if (leftBlock) {
                        const aInput = block.getInput('A');
                        if (aInput && aInput.connection) {
                            aInput.connection.connect(leftBlock.outputConnection);
                        }
                    }

                    const rightBlock = createValueBlock(compareMatch[3].trim());
                    if (rightBlock) {
                        const bInput = block.getInput('B');
                        if (bInput && bInput.connection) {
                            bInput.connection.connect(rightBlock.outputConnection);
                        }
                    }

                    return block;
                }

                // Fall back to text block for unparseable conditions
                return createValueBlock(trimmed);
            }

            function createValueBlock(value) {
                const trimmed = value.trim();

                // Field reference (#field)
                if (trimmed.startsWith('#')) {
                    const block = workspace.newBlock('apex_field_ref');
                    block.setFieldValue(trimmed.substring(1), 'FIELD');
                    block.initSvg();
                    block.render();
                    return block;
                }

                // Boolean
                if (trimmed === 'true' || trimmed === 'false') {
                    const block = workspace.newBlock('logic_boolean');
                    block.setFieldValue(trimmed.toUpperCase(), 'BOOL');
                    block.initSvg();
                    block.render();
                    return block;
                }

                // Number
                if (!isNaN(trimmed) && trimmed !== '') {
                    const block = workspace.newBlock('math_number');
                    block.setFieldValue(Number(trimmed), 'NUM');
                    block.initSvg();
                    block.render();
                    return block;
                }

                // String (remove quotes if present)
                let textValue = trimmed;
                if ((textValue.startsWith("'") && textValue.endsWith("'")) ||
                    (textValue.startsWith('"') && textValue.endsWith('"'))) {
                    textValue = textValue.slice(1, -1);
                }

                const block = workspace.newBlock('text');
                block.setFieldValue(textValue, 'TEXT');
                block.initSvg();
                block.render();
                return block;
            }

            // --- 6. Click-to-Fill Support (Event Listener) ---
            
            const AUTO_FILL_MAP = {
                'apex_rule_config': {
                    'SECTIONS': [
                        'apex_section_data_source_refs',
                        'apex_section_rules',
                        'apex_section_rule_groups',
                        'apex_section_enrichments',
                        'apex_section_enrichment_groups',
                        'apex_section_transformations'
                    ]
                },
                'apex_data_source_config': {
                    'DATA_SOURCES': [
                        'apex_data_source_database',
                        'apex_data_source_rest',
                        'apex_data_source_file',
                        'apex_data_source_query',
                        'apex_data_source_endpoint',
                        'apex_data_source_ref'
                    ]
                },
                'apex_section_data_source_refs': { 'DATA_SOURCE_REFS': 'apex_data_source_ref' },
                'apex_section_rules': { 'RULES': 'apex_rule' },
                'apex_section_rule_groups': { 'RULE_GROUPS': 'apex_rule_group' },
                'apex_section_enrichments': { 
                    'ENRICHMENTS': [
                        'apex_enrichment_calculation',
                        'apex_enrichment_field',
                        'apex_enrichment_lookup'
                    ]
                },
                'apex_section_enrichment_groups': { 'ENRICHMENT_GROUPS': 'apex_enrichment_group' },
                'apex_section_transformations': { 
                    'TRANSFORMATIONS': [
                        'apex_conditional_transformation',
                        'apex_action_set_field'
                    ]
                },
                
                'apex_rule': {
                    'CONDITION': 'apex_condition_compare',
                    'RESULT_FIELD': 'text'
                },
                'apex_rule_group': { 'RULE_IDS': 'apex_rule_ref' },
                
                'apex_enrichment_group': { 'ENRICHMENT_IDS': 'apex_enrichment_ref' },
                'apex_enrichment_calculation': { 
                    'CONDITION': 'apex_condition_compare',
                    'EXPRESSION': 'text'
                },
                'apex_enrichment_field': {
                    'CONDITION': 'apex_condition_compare',
                    'MAPPINGS': 'apex_field_mapping'
                },
                'apex_enrichment_lookup': {
                    'CONDITION': 'apex_condition_compare',
                    'KEY': 'text',
                    'DATASET': 'apex_lookup_dataset_reference',
                    'MAPPINGS': 'apex_field_mapping'
                },
                
                'apex_data_source_database': { 'QUERIES': 'apex_data_source_query' },
                'apex_data_source_rest': { 'ENDPOINTS': 'apex_data_source_endpoint' },
                'apex_lookup_dataset_database': { 'PARAMETERS': 'apex_lookup_parameter' },
                
                'apex_conditional_transformation': {
                    'CONDITION': 'apex_condition_compare',
                    'ACTIONS_TRUE': 'apex_action_set_field',
                    'ACTIONS_FALSE': 'apex_action_set_field'
                },
                
                'apex_action_set_field': {
                    'FIELD': 'apex_field_ref',
                    'VALUE': 'text'
                },
                'apex_field_mapping': { 'EXPRESSION': 'text' },
                
                'apex_condition_compare': {
                    'A': 'apex_field_ref',
                    'B': 'text'
                },
                'apex_condition_logic': {
                    'A': 'apex_condition_compare',
                    'B': 'apex_condition_compare'
                }
            };

            let lastClickTime = 0;
            let lastClickedBlockId = null;

            function onBlockClick(event) {
                // We only care about click events on blocks
                if (event.type === Blockly.Events.CLICK && event.blockId) {
                    const workspace = Blockly.getMainWorkspace();
                    const block = workspace.getBlockById(event.blockId);
                    
                    if (!block) return;

                    // Double Click to Delete
                    const currentTime = new Date().getTime();
                    const isDoubleClick = (event.blockId === lastClickedBlockId) && ((currentTime - lastClickTime) < 400);
                    
                    lastClickTime = currentTime;
                    lastClickedBlockId = event.blockId;

                    if (isDoubleClick) {
                        if (block.isDeletable()) {
                            block.dispose(true);
                            updateYaml();
                        }
                        return;
                    }
                    
                    const config = AUTO_FILL_MAP[block.type];
                    if (!config) return;

                    // Find the first empty input defined in our map
                    for (const inputName in config) {
                        const input = block.getInput(inputName);
                        if (!input || !input.connection) continue;
                        
                        const targetConfig = config[inputName];
                        
                        // Case 1: Array (Rotation/Cycle - Replace existing)
                        if (Array.isArray(targetConfig)) {
                            const parentConnection = input.connection;
                            const targetConnection = parentConnection.targetConnection;
                            
                            let nextType = targetConfig[0];
                            
                            if (targetConnection) {
                                // There is already a block connected
                                const existingBlock = targetConnection.sourceBlock_;
                                
                                // Check if the existing block has any children (content)
                                // We iterate over inputs (like 'RULES', 'ENRICHMENTS') to see if they are populated
                                const hasChildren = existingBlock.inputList.some(inp => 
                                    inp.connection && inp.connection.targetConnection
                                );

                                if (hasChildren) {
                                    // If populated, do NOT rotate/replace. 
                                    // This prevents accidental deletion of user data.
                                    return;
                                }

                                const idx = targetConfig.indexOf(existingBlock.type);
                                
                                // Calculate next type
                                if (idx !== -1) {
                                    nextType = targetConfig[(idx + 1) % targetConfig.length];
                                }
                                
                                // Remove the existing block (healStack=true preserves blocks connected after it)
                                existingBlock.dispose(true);
                            }
                            
                            // Create and connect the new block
                            createAndConnect(workspace, nextType, parentConnection);
                            return; 
                        }
                        // Case 2: String (Single Input or Append to Stack)
                        else if (typeof targetConfig === 'string') {
                            // Check if it's a statement input (stack) - 3 is NEXT_STATEMENT (Input Type)
                            if (input.type === 3) { 
                                // Walk to the end of the stack
                                let connection = input.connection;
                                while (connection.targetConnection) {
                                    connection = connection.targetConnection.sourceBlock_.nextConnection;
                                    if (!connection) break; 
                                }
                                if (connection) {
                                    createAndConnect(workspace, targetConfig, connection);
                                    return;
                                }
                            } else {
                                // Value or Dummy input - only fill if empty
                                if (!input.connection.targetConnection) {
                                    createAndConnect(workspace, targetConfig, input.connection);
                                    return;
                                }
                            }
                        }
                    }
                }
            }
            
            function createAndConnect(workspace, type, parentConnection) {
                 console.log("Auto-filling " + type);
                 const newBlock = workspace.newBlock(type);
                 newBlock.initSvg();
                 newBlock.render();
                 
                 const childConnection = newBlock.outputConnection || newBlock.previousConnection;
                 if (childConnection) {
                     parentConnection.connect(childConnection);
                     newBlock.select();
                     updateYaml();
                 }
            }

            workspace.addChangeListener(onBlockClick);

            // Listen for block creation to auto-generate unique IDs
            workspace.addChangeListener(function(event) {
                if (event.type === Blockly.Events.BLOCK_CREATE) {
                    var block = workspace.getBlockById(event.blockId);
                    if (!block) return;

                    var config = BLOCK_ID_CONFIG[block.type];
                    if (config) {
                        var currentId = block.getFieldValue(config.field);
                        var defaultId = config.prefix + '1';

                        // Only auto-generate if the block has the default ID
                        // This prevents overwriting manually set IDs
                        if (currentId === defaultId) {
                            // Generate unique ID, excluding this block from the count
                            var uniqueId = generateUniqueIdExcluding(workspace, block.type, block.id);
                            if (uniqueId) {
                                block.setFieldValue(uniqueId, config.field);
                            }
                        }
                    }
                }
            });

            // Force initial update
            if (typeof jsyaml === 'undefined') {
                document.getElementById('yamlOutput').textContent = "# Error: js-yaml library failed to load. Please check your internet connection.";
            } else {
                updateYaml();
            }
        </script>
    </body>
