<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">APEX Playground - Examples</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/playground">APEX Playground</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/playground">Playground</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/playground/examples">Examples</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/playground/help">Help</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">Examples Catalog</h1>
        <a href="/playground" class="btn btn-outline-primary btn-sm">Open Playground</a>
    </div>

    <p class="text-muted">Examples are loaded from the server endpoint and grouped by category.</p>

    <div id="examplesAlert" class="alert alert-danger d-none" role="alert"></div>
    <div id="examplesLoading" class="text-muted mb-3">
        <i class="fas fa-spinner fa-spin me-2"></i>Loading examples...
    </div>

    <div id="examplesContainer" class="row g-3"></div>
</div>

<script>
async function loadExamples() {
    const loadingEl = document.getElementById('examplesLoading');
    const alertEl = document.getElementById('examplesAlert');
    const containerEl = document.getElementById('examplesContainer');

    try {
        const response = await fetch('/playground/api/examples');
        if (!response.ok) {
            throw new Error('HTTP ' + response.status);
        }

        const data = await response.json();
        const keys = Object.keys(data)
            .filter(k => Array.isArray(data[k]))
            .sort((a, b) => a.localeCompare(b));

        if (keys.length === 0) {
            containerEl.innerHTML = '<div class="col-12"><div class="alert alert-secondary mb-0">No examples available.</div></div>';
            return;
        }

        containerEl.innerHTML = keys.map(category => {
            const items = data[category] || [];
            const list = items.slice(0, 8).map(item => {
                const name = (item && item.name) ? item.name : (item && item.id ? item.id : 'Unnamed');
                return '<li class="list-group-item d-flex justify-content-between align-items-center">' +
                    '<span>' + name + '</span>' +
                    '<span class="badge bg-secondary">' + (item && item.id ? item.id : '-') + '</span>' +
                    '</li>';
            }).join('');

            return '<div class="col-12 col-lg-6">' +
                '<div class="card h-100">' +
                '<div class="card-header d-flex justify-content-between align-items-center">' +
                '<strong>' + category + '</strong>' +
                '<span class="badge bg-primary">' + items.length + '</span>' +
                '</div>' +
                '<ul class="list-group list-group-flush">' + list + '</ul>' +
                '</div>' +
                '</div>';
        }).join('');
    } catch (error) {
        alertEl.textContent = 'Failed to load examples: ' + error.message;
        alertEl.classList.remove('d-none');
    } finally {
        loadingEl.classList.add('d-none');
    }
}

loadExamples();
</script>
</body>
</html>
