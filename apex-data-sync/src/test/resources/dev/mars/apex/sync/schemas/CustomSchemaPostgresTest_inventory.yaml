# =====================================================================================
# APEX Custom Schema Test - INVENTORY Schema (PostgreSQL)
# =====================================================================================
#
# Purpose:
#   Tests reading schema from a non-default PostgreSQL schema (inventory), validating
#   schema parameter handling for inventory management tables.
#
# Test Scenarios:
#   1. Connect to PostgreSQL database with multiple schemas
#   2. Read schema from inventory.products table (non-default schema)
#   3. Validate schema parameter correctly targets inventory schema
#   4. Confirm table metadata retrieved from correct namespace
#
# Database Setup:
#   - Platform: PostgreSQL (via Testcontainers)
#   - Connection: Environment variables (POSTGRES_HOST, POSTGRES_PORT, etc.)
#   - Schema: inventory (non-default)
#   - Table: products
#
# Test Data:
#   - inventory.products table in non-default schema
#   - Tests schema isolation and qualified table access
#
# PostgreSQL Schema Isolation:
#   - Prevents table name collisions across schemas
#   - Example: sales.products vs inventory.products (different tables)
#   - Schema acts as namespace for database objects
#
# Expected Results:
#   - Schema read successfully from inventory.products
#   - Correct schema parameter applied in pipeline step
#   - Table metadata retrieved from inventory schema only
#   - No confusion with public schema or other schemas
#
# Related Tests:
#   - CustomSchemaPostgresTest_sales: Tests sales schema
#   - CustomSchemaPostgresTest_hr: Tests hr schema
#   - CustomSchemaPostgresTest_cross_schema: Tests cross-schema comparison
#
# =====================================================================================

metadata:
  name: "Custom Schema Test - INVENTORY"
  description: "Read schema from inventory.products table"
  version: "1.0"

data-sources:
  # PostgreSQL database with inventory schema
  - name: "inventory-db"
    type: "database"
    source-type: "postgresql"  # PostgreSQL database
    connection:
      host: "localhost"  # Testcontainers provides this
      port: 5432  # Default PostgreSQL port
      database: "custom_schema_test"  # Test database
      username: "test"
      password: "test"
      schema: "inventory"  # Non-default schema

pipeline:
  name: "read-inventory-schema"
  execution:
    mode: "sequential"  # Steps execute in order
    max-retries: 1
    error-handling: "fail-fast"  # Stop on first error
  steps:
    # Read schema from inventory.products table
    - name: "read-products-schema"
      type: "read-schema"
      source: "inventory-db"
      parameters:
        table: "products"  # Table name in inventory schema
        schema: "inventory"  # Schema-qualified access
