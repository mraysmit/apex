# =====================================================================================
# APEX SQL Server Platform-Specific Table Enumeration with Report
# =====================================================================================
#
# Purpose:
#   Platform-specific test for SQL Server table enumeration with HTML report,
#   validating SQL Server-specific schema handling.
#
# Test Setup:
#   - Database: SQL Server (localhost:1433)
#   - Schema: dbo (default SQL Server schema)
#   - Report: target/reports/sqlserver-all-tables-schema-report.html
#
# SQL Server-Specific Features:
#   - Default schema: dbo
#   - Multi-schema support (dbo, guest, custom schemas)
#   - System table exclusion (sys.*, INFORMATION_SCHEMA)
#
# Expected Results:
#   - All tables in dbo schema enumerated
#   - HTML report generated
#   - SQL Server schema conventions handled
#
# Related Tests:
#   - MsSqlToPostgresSyncTest: SQL Server sync pipeline
#
# =====================================================================================

metadata:
  name: "SQL Server: Multi-Table Enumeration with HTML Report Test"
  description: "SQL Server test configuration for enumerating all tables and generating HTML report"
  version: "1.0"

data-sources:
  - name: "sqlserver-enumeration-db"
    type: "database"
    source-type: "sqlserver"  # SQL Server database
    connection:
      host: "localhost"  # Provided by Testcontainers
      port: 1433
      database: "test_db"
      username: "${SQLSERVER_USER:sa}"  # Environment variable with default
      password: "${SQLSERVER_PASSWORD:YourStrong@Passw0rd}"  # Environment variable with default
    enabled: true

pipeline:
  name: "enumerate-and-report"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Enumerate all tables without specifying individual table names
    - name: "enumerate-all-tables"
      type: "read-schema"  # Read schema from database
      source: "sqlserver-enumeration-db"
      description: "Enumerate all tables in database and generate HTML report"
      parameters:
        # No table parameter - this triggers enumeration
        schema: "dbo"  # SQL Server default schema
        report-output: "target/reports/sqlserver-all-tables-schema-report.html"  # HTML report
