# =====================================================================================
# APEX Custom Schema Test - HR Schema (PostgreSQL)
# =====================================================================================
#
# Purpose:
#   Tests reading schema from a non-default PostgreSQL schema (hr), validating
#   schema parameter handling for human resources tables.
#
# Test Scenarios:
#   1. Connect to PostgreSQL database with multiple schemas
#   2. Read schema from hr.employees table (non-default schema)
#   3. Validate schema parameter correctly targets hr schema
#   4. Confirm table metadata retrieved from correct namespace
#
# Database Setup:
#   - Platform: PostgreSQL (via Testcontainers)
#   - Connection: Environment variables or hardcoded localhost
#   - Schema: hr (non-default)
#   - Table: employees
#
# Test Data:
#   - hr.employees table in non-default schema
#   - Tests schema-qualified access for HR data
#
# Multi-Schema Use Cases:
#   - Separation of concerns (sales vs hr vs inventory)
#   - Access control (different schemas have different permissions)
#   - Organizational structure mirrored in database design
#
# Expected Results:
#   - Schema read successfully from hr.employees
#   - Correct schema parameter applied in read-schema step
#   - Table metadata retrieved from hr schema only
#   - Validates schema isolation and qualified table access
#
# Related Tests:
#   - CustomSchemaPostgresTest_sales: Tests sales schema
#   - CustomSchemaPostgresTest_inventory: Tests inventory schema
#   - CustomSchemaPostgresTest_cross_schema: Tests cross-schema comparison
#
# =====================================================================================

metadata:
  name: "Custom Schema Test - HR"
  description: "Read schema from hr.employees table"
  version: "1.0"

data-sources:
  # PostgreSQL database with hr schema
  - name: "hr-db"
    type: "database"
    source-type: "postgresql"  # PostgreSQL database
    connection:
      host: "localhost"  # Testcontainers provides this
      port: 5432  # Default PostgreSQL port
      database: "custom_schema_test"  # Test database
      username: "test"
      password: "test"
      schema: "hr"  # Non-default schema

pipeline:
  name: "read-hr-schema"
  execution:
    mode: "sequential"  # Steps execute in order
    max-retries: 1
    error-handling: "fail-fast"  # Stop on first error
  steps:
    # Read schema from hr.employees table
    - name: "read-employees-schema"
      type: "read-schema"
      source: "hr-db"
      parameters:
        table: "employees"  # Table name in hr schema
        schema: "hr"  # Schema-qualified access
