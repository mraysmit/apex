metadata:
  type: "pipeline-config"
  name: "Schema Diff Dual Output Test"
  description: "Test pipeline that generates both HTML and JSON reports"
  version: "1.0"

pipelines:
  - name: "schema-diff-dual-output"
    description: "Generate both HTML and JSON reports from schema comparison"
    
    steps:
      # Step 1: Read source schema
      - name: "read-source"
        type: "read-schema"
        source: "customers-csv"
        parameters:
          file-path: "demo-data/csv/customers.csv"
          has-header: true
      
      # Step 2: Read target schema
      - name: "read-target"
        type: "read-schema"
        source: "customers-target"
        parameters:
          schema-definition:
            table-name: "customers"
            columns:
              - name: "customer_id"
                type: "VARCHAR"
                maxLength: 50
                nullable: false
              - name: "first_name"
                type: "VARCHAR"
                maxLength: 100
                nullable: true
              - name: "last_name"
                type: "VARCHAR"
                maxLength: 100
                nullable: true
              - name: "email"
                type: "VARCHAR"
                maxLength: 255
                nullable: true
              - name: "phone"
                type: "VARCHAR"
                maxLength: 20
                nullable: true
      
      # Step 3: Compare and generate both reports
      - name: "compare-with-reports"
        type: "schema-diff"
        parameters:
          source-step: "read-source"
          target-step: "read-target"
          report-output: "schema-diff-dual-test.html"
          json-report-output: "schema-diff-dual-test.json"
          fail-on-incompatibility: false

data-source-refs:
  - name: "customers-csv"
    source: "data-sources/customers-csv.yaml"
    enabled: true
  - name: "customers-target"
    source: "data-sources/customers-target.yaml"
    enabled: true
