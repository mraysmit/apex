metadata:
  type: "pipeline-config"
  version: "1.0"
  description: "Test pipeline for database table enumeration with exclusion list"

data-sources:
  - name: "test-h2-db"
    type: "database"
    source-type: "h2"
    connection:
      database: "./target/h2-demo/schema_enum_test"
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "enumerate-tables-with-exclusions"
  execution:
    max-retries: 0
    timeout-seconds: 30
  steps:
    - name: "read-filtered-table-schemas"
      type: "read-schema"
      source: "test-h2-db"
      description: "Enumerate all tables except temp and system tables"
      parameters:
        schema: "PUBLIC"
        exclude-tables:
          - "temp_data"
          - "system_log"
