# =====================================================================================
# APEX PostgreSQL Platform-Specific Table Enumeration with Report
# =====================================================================================
#
# Purpose:
#   Platform-specific test for PostgreSQL table enumeration with HTML report,
#   validating PostgreSQL-specific schema handling.
#
# Test Setup:
#   - Database: PostgreSQL (environment variables: PG_HOST, PG_PORT, etc.)
#   - Schema: test_schema (lowercase - PostgreSQL convention)
#   - Report: reports/postgresql-all-tables-schema-report.html
#
# PostgreSQL-Specific Features:
#   - Lowercase schema names (test_schema)
#   - Multi-schema support
#   - System table exclusion (pg_catalog, information_schema)
#
# Expected Results:
#   - All tables in test_schema enumerated
#   - HTML report generated
#   - PostgreSQL schema conventions handled
#
# Related Tests:
#   - ReadSchemaDatabasePipelineStageTest_h2_*: H2 version
#   - CustomSchemaPostgresTest_*: PostgreSQL schema tests
#
# =====================================================================================

metadata:
  name: "PostgreSQL: Multi-Table Enumeration with HTML Report Test"
  description: "PostgreSQL test configuration for enumerating all tables and generating HTML report"
  version: "1.0"

data-sources:
  - name: "postgresql-enumeration-db"
    type: "database"
    source-type: "postgresql"  # PostgreSQL database
    connection:
      host: "${PG_HOST:localhost}"  # Provided by Testcontainers
      port: ${PG_PORT:5432}
      database: "${PG_DATABASE:test_db}"
      username: "${PG_USERNAME:postgres}"  # Environment variable with default
      password: "${PG_PASSWORD:postgres}"  # Environment variable with default
    enabled: true

pipeline:
  name: "enumerate-and-report"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Enumerate all tables without specifying individual table names
    - name: "enumerate-all-tables"
      type: "read-schema"  # Read schema from database
      source: "postgresql-enumeration-db"
      description: "Enumerate all tables in database and generate HTML report"
      parameters:
        # No table parameter - this triggers enumeration
        schema: "test_schema"  # Only enumerate tables in test_schema (not system tables)
        report-output: "reports/postgresql-all-tables-schema-report.html"  # HTML report
