# =====================================================================================
# APEX Customer Data Sync Pipeline (SQL Server → PostgreSQL)
# =====================================================================================
#
# Purpose:
#   Production-style customer data synchronization pipeline from legacy SQL Server
#   to modern PostgreSQL, demonstrating external data-source references.
#
# Test Scenarios:
#   1. Fetch delta changes from legacy SQL Server
#   2. Upsert customer records into PostgreSQL
#   3. Track sync timestamp (synced_at column)
#
# Database Setup:
#   - Source: External data-source reference (MsSqlToPostgresSyncTest-source.yaml)
#   - Target: H2 database (PostgreSQL mode) - modern-postgres-sink
#   - MERGE/UPSERT operation for idempotent syncs
#
# External Data-Source Reference:
#   - Demonstrates APEX 2.1 clean architecture
#   - Source configuration externalized to separate file
#   - Business logic separated from infrastructure
#
# Pipeline Features:
#   - Sequential execution mode
#   - Max 3 retries for resilience
#   - Continue-on-error for partial sync capability
#   - Auto-create target schema
#
# Data Sync Pattern:
#   - Extract: fetch-delta-changes (batch extraction)
#   - Load: push-to-postgres (MERGE upsert)
#   - Dependency: load depends on extract
#
# Expected Results:
#   - Customer data extracted from SQL Server
#   - Data upserted into PostgreSQL (no duplicates)
#   - synced_at timestamp recorded
#   - Pipeline executes with retry logic
#
# Related Tests:
#   - MsSqlToPostgresSyncTest-source.yaml: External source configuration
#   - SyncPipelineContainersTest: Testcontainers version
#
# =====================================================================================

metadata:
  id: "customer-sync-pipeline"
  type: "pipeline-config"
  author: "Integration Team"
  description: "Pipeline to sync Customers from Legacy SQL Server to Modern PostgreSQL"

data-source-refs:
  - name: "legacy-sqlserver"
    source: "src/test/java/dev/mars/apex/sync/pipeline/MsSqlToPostgresSyncTest-source.yaml"

data-sinks:
  - name: "modern-postgres-sink"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      # Using H2 database parameter format (not full JDBC URL)
      database: "mem:postgres_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"  # PostgreSQL compatibility mode
      username: "postgres"
      password: "pass"
    enabled: true
    operations:
      upsertCustomer: |
        MERGE INTO customers (id, name, status, email, synced_at)
        KEY (id)
        VALUES (:id, :name, :status, :email, CURRENT_TIMESTAMP)
    schema:
      auto-create: true
      table-name: "customers"
      init-script: |
        CREATE TABLE IF NOT EXISTS customers (
          id VARCHAR(50) PRIMARY KEY,
          name VARCHAR(255),
          email VARCHAR(255),
          status VARCHAR(20),
          synced_at TIMESTAMP
        );

pipeline:
  name: "customer-sync-orchestration"
  execution:
    mode: "sequential"  # Steps execute in order
    max-retries: 3
    error-handling: "continue-on-error"

  steps:
    - name: "fetch-delta-changes"
      type: "extract"  # Extract data from source
      source: "legacy-sqlserver"  # External data-source reference
      operation: "extractCustomersBatch"  # Query from external config

    - name: "push-to-postgres"
      type: "load"  # Load data to target
      sink: "modern-postgres-sink"
      operation: "upsertCustomer"  # MERGE operation
      depends-on: ["fetch-delta-changes"]  # Wait for extraction
