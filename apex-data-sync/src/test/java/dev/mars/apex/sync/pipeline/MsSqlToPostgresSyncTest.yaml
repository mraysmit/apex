metadata:
  id: "customer-sync-pipeline"
  type: "pipeline-config"
  author: "Integration Team"
  description: "Pipeline to sync Customers from Legacy SQL Server to Modern PostgreSQL"

data-source-refs:
  - name: "legacy-sqlserver"
    source: "src/test/java/dev/mars/apex/sync/pipeline/MsSqlToPostgresSyncTest-source.yaml"

data-sinks:
  - name: "modern-postgres-sink"
    type: "database"
    source-type: "h2"
    connection:
      # Using H2 database parameter format (not full JDBC URL)
      database: "mem:postgres_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
      username: "postgres"
      password: "pass"
    enabled: true
    operations:
      upsertCustomer: |
        MERGE INTO customers (id, name, status, email, synced_at)
        KEY (id)
        VALUES (:id, :name, :status, :email, CURRENT_TIMESTAMP)
    schema:
      auto-create: true
      table-name: "customers"
      init-script: |
        CREATE TABLE IF NOT EXISTS customers (
          id VARCHAR(50) PRIMARY KEY,
          name VARCHAR(255),
          email VARCHAR(255),
          status VARCHAR(20),
          synced_at TIMESTAMP
        );

pipeline:
  name: "customer-sync-orchestration"
  execution:
    mode: "sequential"
    max-retries: 3
    error-handling: "continue-on-error"

  steps:
    - name: "fetch-delta-changes"
      type: "extract"
      source: "legacy-sqlserver"
      operation: "extractCustomersBatch"

    - name: "push-to-postgres"
      type: "load"
      sink: "modern-postgres-sink"
      operation: "upsertCustomer"
      depends-on: ["fetch-delta-changes"]
