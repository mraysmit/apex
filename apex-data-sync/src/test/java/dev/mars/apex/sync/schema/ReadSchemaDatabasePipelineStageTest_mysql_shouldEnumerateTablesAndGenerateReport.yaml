# =====================================================================================
# APEX MySQL Platform-Specific Table Enumeration with Report
# =====================================================================================
#
# Purpose:
#   Platform-specific test for MySQL table enumeration with HTML report,
#   validating MySQL-specific schema handling.
#
# Test Setup:
#   - Database: MySQL (localhost:3306)
#   - Schema: test_db (MySQL uses database name as schema)
#   - Report: target/reports/mysql-all-tables-schema-report.html
#
# MySQL-Specific Features:
#   - Database name = schema (no separate schema concept)
#   - System database exclusion (mysql, sys, performance_schema)
#   - Case sensitivity depends on OS (Windows: insensitive, Linux: sensitive)
#
# Expected Results:
#   - All tables in test_db enumerated
#   - HTML report generated
#   - MySQL schema conventions handled
#
# Related Tests:
#   - ReadSchemaDatabasePipelineStageTest_postgresql_*: PostgreSQL version
#
# =====================================================================================

metadata:
  name: "MySQL: Multi-Table Enumeration with HTML Report Test"
  description: "MySQL test configuration for enumerating all tables and generating HTML report"
  version: "1.0"

data-sources:
  - name: "mysql-enumeration-db"
    type: "database"
    source-type: "mysql"  # MySQL database
    connection:
      host: "localhost"  # Provided by Testcontainers
      port: 3306
      database: "test_db"  # MySQL uses database name as schema
      username: "${MYSQL_USER:root}"  # Environment variable with default
      password: "${MYSQL_PASSWORD:mysql}"  # Environment variable with default
    enabled: true

pipeline:
  name: "enumerate-and-report"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Enumerate all tables without specifying individual table names
    - name: "enumerate-all-tables"
      type: "read-schema"  # Read schema from database
      source: "mysql-enumeration-db"
      description: "Enumerate all tables in database and generate HTML report"
      parameters:
        # No table parameter - this triggers enumeration
        schema: "test_db"  # MySQL uses database name as schema
        report-output: "target/reports/mysql-all-tables-schema-report.html"  # HTML report
