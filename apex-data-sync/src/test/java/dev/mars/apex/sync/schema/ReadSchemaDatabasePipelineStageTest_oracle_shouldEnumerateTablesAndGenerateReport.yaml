# =====================================================================================
# APEX Oracle Platform-Specific Table Enumeration with Report
# =====================================================================================
#
# Purpose:
#   Platform-specific test for Oracle table enumeration with HTML report,
#   validating Oracle-specific schema handling.
#
# Test Setup:
#   - Database: Oracle (localhost:1521, service: TESTDB)
#   - Schema: TEST_SCHEMA (uppercase - Oracle convention)
#   - Report: target/reports/oracle-all-tables-schema-report.html
#
# Oracle-Specific Features:
#   - Uppercase schema names (TEST_SCHEMA)
#   - Schema = user in Oracle terminology
#   - System schema exclusion (SYS, SYSTEM, DBSNMP, etc.)
#
# Expected Results:
#   - All tables in TEST_SCHEMA enumerated
#   - HTML report generated
#   - Oracle schema conventions handled (uppercase)
#
# Related Tests:
#   - ReadSchemaDatabasePipelineStageTest_postgresql_*: PostgreSQL version
#
# =====================================================================================

metadata:
  name: "Oracle: Multi-Table Enumeration with HTML Report Test"
  description: "Oracle test configuration for enumerating all tables and generating HTML report"
  version: "1.0"

data-sources:
  - name: "oracle-enumeration-db"
    type: "database"
    source-type: "oracle"  # Oracle database
    connection:
      host: "localhost"  # Provided by Testcontainers
      port: 1521
      database: "TESTDB"  # Oracle service name or SID
      username: "${ORACLE_USER:system}"  # Environment variable with default
      password: "${ORACLE_PASSWORD:oracle}"  # Environment variable with default
    enabled: true

pipeline:
  name: "enumerate-and-report"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Enumerate all tables without specifying individual table names
    - name: "enumerate-all-tables"
      type: "read-schema"  # Read schema from database
      source: "oracle-enumeration-db"
      description: "Enumerate all tables in database and generate HTML report"
      parameters:
        # No table parameter - this triggers enumeration
        schema: "TEST_SCHEMA"  # Oracle schema (usually uppercase)
        report-output: "target/reports/oracle-all-tables-schema-report.html"  # HTML report
