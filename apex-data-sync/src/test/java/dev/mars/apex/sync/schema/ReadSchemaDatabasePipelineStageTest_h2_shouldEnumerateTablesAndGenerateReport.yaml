# =====================================================================================
# APEX H2 Platform-Specific Table Enumeration with Report
# =====================================================================================
#
# Purpose:
#   Platform-specific test for H2 database table enumeration and HTML report
#   generation, validating H2-specific schema handling.
#
# Test Setup:
#   - Database: H2 mem:enumeration_test (PostgreSQL compatibility mode)
#   - Schema: TEST_SCHEMA (uppercase - H2 convention)
#   - Report: target/reports/h2-all-tables-schema-report.html
#
# H2-Specific Features:
#   - Uppercase schema names (TEST_SCHEMA not test_schema)
#   - PostgreSQL compatibility mode
#   - In-memory database for fast testing
#
# Expected Results:
#   - All tables in TEST_SCHEMA enumerated
#   - HTML report generated
#   - H2-specific schema conventions handled
#
# Related Tests:
#   - ReadSchemaDatabasePipelineStageTest_postgresql_*: PostgreSQL version
#   - ReadSchemaDatabasePipelineStageTestH2Enumeration: Duplicate test
#
# =====================================================================================

metadata:
  name: "H2: Multi-Table Enumeration with HTML Report Test"
  description: "H2 test configuration for enumerating all tables and generating HTML report"
  version: "1.0"

data-sources:
  - name: "h2-enumeration-db"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      database: "mem:enumeration_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "enumerate-and-report"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Enumerate all tables without specifying individual table names
    - name: "enumerate-all-tables"
      type: "read-schema"  # Read schema from database
      source: "h2-enumeration-db"
      description: "Enumerate all tables in database and generate HTML report"
      parameters:
        # No table parameter - this triggers enumeration
        schema: "TEST_SCHEMA"  # H2 stores schemas in uppercase - must match exactly
        report-output: "target/reports/h2-all-tables-schema-report.html"  # HTML report
