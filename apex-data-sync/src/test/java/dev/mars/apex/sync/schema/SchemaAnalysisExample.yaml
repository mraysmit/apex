metadata:
  type: "pipeline"
  name: "Database Schema Analysis Example"
  description: "Example demonstrating schema analysis with automatic report generation"
  version: "2.1.0"

data-source-refs:
  - name: "my-database"
    source: "data-sources/my-database.yaml"
    enabled: true

pipeline:
  name: "schema-analysis"
  execution:
    mode: "sequential"
  
  steps:
    # Example 1: Single table schema with report in default 'reports/' directory
    - name: "analyze-customers-table"
      type: "read-schema"
      source: "my-database"
      description: "Read customers table schema"
      parameters:
        table: "customers"
        report-output: "customers-schema.html"  # Saved to: reports/customers-schema.html
    
    # Example 2: Enumerate all tables with report in custom subdirectory
    - name: "enumerate-all-tables"
      type: "read-schema"
      source: "my-database"
      description: "Enumerate all tables in database"
      parameters:
        # Omit 'table' parameter to enumerate all tables
        schema-filter: "public"  # Optional: filter by schema name
        report-output: "analysis/full-database-schema.html"  # Saved to: analysis/full-database-schema.html
    
    # Example 3: Multiple tables with custom output directory
    - name: "analyze-orders-table"
      type: "read-schema"
      source: "my-database"
      description: "Read orders table schema"
      parameters:
        table: "orders"
        report-output: "output/reports/orders-schema.html"  # Custom path
