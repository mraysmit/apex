# =====================================================================================
# APEX Data Sync Pipeline - Testcontainers Integration Test
# =====================================================================================
#
# Purpose:
#   Tests complete ETL pipeline using real SQL Server and PostgreSQL databases
#   via Testcontainers, validating production-like behavior.
#
# Test Scenarios:
#   1. Extract: Read data from real SQL Server container
#   2. Load: Insert data into real PostgreSQL container
#   3. Validate: End-to-end sync with actual database engines
#
# Database Setup:
#   - Source: SQL Server container (localhost:1433, connection details injected)
#   - Target: PostgreSQL container (localhost:5432, connection details injected)
#   - Containers started by test, connections configured programmatically
#
# Testcontainers Benefits:
#   - Tests against real database engines (not H2 emulation)
#   - Validates SQL Server and PostgreSQL specific behavior
#   - Catches platform-specific issues
#   - Production-like testing environment
#
# Pipeline Configuration:
#   - Connection details overwritten by test at runtime
#   - extract-from-sqlserver: Real SQL Server query
#   - load-into-postgresql: Real PostgreSQL insert
#   - Sequential execution with error handling
#
# Expected Results:
#   - Data extracted from SQL Server container
#   - Data loaded into PostgreSQL container
#   - Pipeline executes with real database engines
#   - Validates production-ready sync logic
#
# Related Tests:
#   - SyncPipelineH2Test: H2 compatibility mode version
#   - MsSqlToPostgresSyncTest: Production sync configuration
#
# =====================================================================================

# APEX Database Table Sync - Containers Test Pipeline
# Real SQL Server to PostgreSQL sync using TestContainers.
# Connection details are populated programmatically by the test.

metadata:
  id: "test-sync-pipeline-containers"
  name: "Containers Test Sync Pipeline"
  version: "1.0"
  type: "pipeline-config"
  author: "Test User"
  description: "Real database pipeline via TestContainers"

data-sources:
  - name: "sqlserver-source"
    type: "database"
    source-type: "sqlserver"  # Real SQL Server via Testcontainers
    connection:
      # These values are overwritten programmatically by the test
      host: "localhost"  # Provided by Testcontainers
      port: 1433
      database: "master"
      username: "sa"
      password: "placeholder"  # Provided by Testcontainers
    enabled: true
    queries:
      extractCustomers: "SELECT id, name FROM customers"

data-sinks:
  - name: "postgresql-target"
    type: "database"
    source-type: "postgresql"  # Real PostgreSQL via Testcontainers
    connection:
      # These values are overwritten programmatically by the test
      host: "localhost"  # Provided by Testcontainers
      port: 5432
      database: "test"
      username: "test"
      password: "placeholder"  # Provided by Testcontainers
    enabled: true
    operations:
      upsertCustomer: "INSERT INTO customers (id, name) VALUES (:id, :name)"
    schema:
      auto-create: true
      table-name: "customers"
      init-script: "CREATE TABLE IF NOT EXISTS customers (id INT PRIMARY KEY, name VARCHAR(255))"

pipeline:
  name: "containers-sync"
  execution:
    mode: "sequential"  # Steps execute in order
    max-retries: 3
    error-handling: "continue-on-error"
  steps:
    - name: "extract-from-sqlserver"
      type: "extract"  # Extract from SQL Server
      source: "sqlserver-source"
      operation: "extractCustomers"  # Query to execute

    - name: "load-into-postgresql"
      type: "load"  # Load to PostgreSQL
      sink: "postgresql-target"
      operation: "upsertCustomer"  # Insert operation
      depends-on: ["extract-from-sqlserver"]  # Wait for extraction
