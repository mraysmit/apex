# =====================================================================================
# APEX Multi-Table Schema Reading with HTML Report
# =====================================================================================
#
# Purpose:
#   Tests reading schemas from 5 tables with HTML report generation for
#   comprehensive schema documentation.
#
# Test Tables:
#   1. CUSTOMERS (5 columns) - with HTML report
#   2. ORDERS (6 columns)
#   3. PRODUCTS (7 columns)
#   4. INVENTORY (4 columns)
#   5. TRANSACTIONS (8 columns)
#
# Database: H2 mem:multi_table_test (PostgreSQL mode)
#
# Report Generation:
#   - First table generates HTML report (target/reports/customers-schema.html)
#   - Tests report path resolution
#
# Expected Results:
#   - All 5 schemas read
#   - HTML report generated for CUSTOMERS
#
# Related Tests:
#   - ReadSchemaMultiTableTest: Without HTML reports
#
# =====================================================================================

metadata:
  name: "Multi-Table Schema Reader Test"
  description: "Test configuration for reading schemas from 5 H2 database tables"
  version: "1.0"

data-sources:
  - name: "h2-multi-table-db"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      database: "mem:multi_table_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "read-multi-table-schemas"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "continue-on-error"
  
  steps:
    # Table 1: customers (5 columns)
    - name: "read-schema-customers"
      type: "read-schema"  # Read schema from database table
      source: "h2-multi-table-db"
      description: "Read schema from customers table with HTML report"
      parameters:
        table: "CUSTOMERS"  # Table to analyze
        report-output: "target/reports/customers-schema.html"  # HTML report

    # Table 2: orders (6 columns)
    - name: "read-schema-orders"
      type: "read-schema"  # Read schema from database table
      source: "h2-multi-table-db"
      description: "Read schema from orders table"
      parameters:
        table: "ORDERS"  # Table to analyze

    # Table 3: products (7 columns)
    - name: "read-schema-products"
      type: "read-schema"  # Read schema from database table
      source: "h2-multi-table-db"
      description: "Read schema from products table"
      parameters:
        table: "PRODUCTS"  # Table to analyze

    # Table 4: inventory (4 columns)
    - name: "read-schema-inventory"
      type: "read-schema"  # Read schema from database table
      source: "h2-multi-table-db"
      description: "Read schema from inventory table"
      parameters:
        table: "INVENTORY"  # Table to analyze

    # Table 5: transactions (8 columns)
    - name: "read-schema-transactions"
      type: "read-schema"  # Read schema from database table
      source: "h2-multi-table-db"
      description: "Read schema from transactions table"
      parameters:
        table: "TRANSACTIONS"  # Table to analyze
