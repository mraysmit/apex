metadata:
  name: "Schema Diff - Type Narrowing"
  description: "Detect incompatible type narrowing changes"
  version: "2.1"

data-sources:
  - name: "source-db"
    type: "database"
    source-type: "h2"
    enabled: true
    connection:
      url: "jdbc:h2:mem:migration_source_narrowing;DB_CLOSE_DELAY=-1"
      username: "sa"
      password: ""

  - name: "target-db"
    type: "database"
    source-type: "h2"
    enabled: true
    connection:
      url: "jdbc:h2:mem:migration_target_narrowing;DB_CLOSE_DELAY=-1"
      username: "sa"
      password: ""

pipeline:
  name: "type-narrowing-validation"
  description: "Detect type narrowing as incompatible (VARCHAR 100→50)"
  execution:
    mode: "sequential"
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "source-db"
      parameters:
        table: "customers"

    - name: "read-target-schema"
      type: "read-schema"
      source: "target-db"
      parameters:
        table: "customers"

    - name: "compare-schemas"
      type: "schema-diff"
      description: "Compare type changes - narrowing"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        case-insensitive-names: true
        inferred-type-tolerance: false
        report-output: "target/reports/type-narrowing-migration-report.html"
