# Column Difference Detection Test

metadata:
  id: "column-difference-test"
  name: "Column Difference Detection Test"
  version: "1.0"
  type: "pipeline-config"

data-sources:
  - name: "before-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:col_diff_before;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    enabled: true

  - name: "after-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:col_diff_after;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "column-difference-pipeline"
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
  
  steps:
    - name: "read-before-schema"
      type: "read-schema"
      source: "before-database"
      parameters:
        table: "ACCOUNTS"

    - name: "read-after-schema"
      type: "read-schema"
      source: "after-database"
      parameters:
        table: "ACCOUNTS"
