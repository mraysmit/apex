# =====================================================================================
# APEX Breaking Change Detection Test Pipeline
# =====================================================================================
#
# Purpose:
#   Tests the schema-diff engine's ability to distinguish between breaking and
#   non-breaking schema changes for database migration validation using H2 databases.
#
# Test Scenarios:
#   1. Original table (source) has columns: id, username, email, status
#   2. Evolved table (target) has columns: id, username, full_name (breaking changes)
#   3. Breaking changes detected:
#      - Removed column: email (data loss)
#      - Removed column: status (data loss)
#      - Added column: full_name (safe - can be nullable)
#
# Database Setup:
#   - Platform: H2 in-memory databases (PostgreSQL compatibility mode)
#   - Source DB: mem:breaking_original (USERS table)
#   - Target DB: mem:breaking_evolved (USERS table)
#
# Test Data:
#   - USERS table evolution with intentional breaking changes
#   - Tests column removal detection which indicates potential data loss
#
# Migration Context:
#   - Simulates real-world database migration validation
#   - Removed columns represent breaking changes requiring data migration strategy
#   - Added nullable columns are safe (non-breaking)
#
# Expected Results:
#   - Schema diff flags column removals as breaking changes
#   - HTML report shows removed columns: email, status
#   - Test validates breaking change detection for migration planning
#
# Related Tests:
#   - ColumnDifferenceTest: Basic column add/remove detection
#   - NullableConversionTest: Tests nullable constraint changes
#
# =====================================================================================

metadata:
  id: "breaking-change-detection-test"
  name: "Breaking Change Detection Test"
  version: "1.0"
  type: "pipeline-config"
  author: "APEX Team"
  description: "Test pipeline for breaking change detection"

data-sources:
  # Original schema: Baseline version before changes
  - name: "original-h2-database"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      database: "mem:breaking_original;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

  # Evolved schema: New version with potential breaking changes
  - name: "evolved-h2-database"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      database: "mem:breaking_evolved;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "breaking-change-detection-pipeline"
  execution:
    mode: "sequential"  # Steps execute in order
    error-handling: "stop-on-error"  # Halt on any failure
  
  steps:
    # Read original schema (baseline version)
    - name: "read-original-schema"
      type: "read-schema"
      source: "original-h2-database"
      description: "Read original schema"
      parameters:
        table: "USERS"  # Original USERS table

    # Read evolved schema (version with changes)
    - name: "read-evolved-schema"
      type: "read-schema"
      source: "evolved-h2-database"
      description: "Read evolved schema with breaking changes"
      parameters:
        table: "USERS"  # Modified USERS table

    # Detect breaking changes (removed columns, incompatible types)
    - name: "detect-breaking-changes"
      type: "schema-diff"
      description: "Flag breaking changes for migration review"
      parameters:
        source-step: "read-original-schema"  # Baseline
        target-step: "read-evolved-schema"  # New version
        fail-on-incompatibility: false  # Report only
