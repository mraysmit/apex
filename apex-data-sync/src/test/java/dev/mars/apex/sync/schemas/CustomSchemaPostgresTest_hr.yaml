# Custom Schema Test - HR Schema (PostgreSQL)
# Tests reading schema from non-default hr schema

metadata:
  name: "Custom Schema Test - HR"
  description: "Read schema from hr.employees table"
  version: "1.0"

data-sources:
  - name: "hr-db"
    type: "database"
    source-type: "postgresql"
    connection:
      host: "localhost"
      port: 5432
      database: "custom_schema_test"
      username: "test"
      password: "test"
      schema: "hr"

pipeline:
  name: "read-hr-schema"
  execution:
    mode: "sequential"
    max-retries: 1
    error-handling: "fail-fast"
  steps:
    - name: "read-employees-schema"
      type: "read-schema"
      source: "hr-db"
      parameters:
        table: "employees"
        schema: "hr"
