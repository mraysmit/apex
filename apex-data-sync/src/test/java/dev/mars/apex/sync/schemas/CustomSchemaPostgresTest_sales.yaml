# Custom Schema Test - SALES Schema (PostgreSQL)
# Tests reading schema from non-default sales schema

metadata:
  name: "Custom Schema Test - SALES"
  description: "Read schema from sales.orders table"
  version: "1.0"

data-sources:
  - name: "sales-db"
    type: "database"
    source-type: "postgresql"
    connection:
      host: "localhost"
      port: 5432
      database: "custom_schema_test"
      username: "test"
      password: "test"
      schema: "sales"

pipeline:
  name: "read-sales-schema"
  execution:
    mode: "sequential"
    max-retries: 1
    error-handling: "fail-fast"
  steps:
    - name: "read-orders-schema"
      type: "read-schema"
      source: "sales-db"
      parameters:
        table: "orders"
        schema: "sales"
