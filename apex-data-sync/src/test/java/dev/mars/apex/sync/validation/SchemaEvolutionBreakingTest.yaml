# APEX Data Sync - Schema Evolution Breaking Change Detection
# Real-world use case: Detect breaking changes when evolving database schema

metadata:
  id: "schema-evolution-breaking-change"
  name: "Schema Evolution - Breaking Change Detector"
  version: "1.0"
  type: "pipeline-config"
  description: "Detect breaking changes in schema evolution"

data-sources:
  - name: "legacy-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:schema_evolution;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    enabled: true

  - name: "new-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:schema_evolution;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "schema-evolution-validation"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-legacy-schema"
      type: "read-schema"
      source: "legacy-database"
      parameters:
        table: "LEGACY_CUSTOMERS"

    - name: "read-new-schema"
      type: "read-schema"
      source: "new-database"
      parameters:
        table: "NEW_CUSTOMERS"

    - name: "validate-schema-evolution"
      type: "schema-diff"
      description: "Detect breaking changes in schema evolution"
      parameters:
        source-step: "read-legacy-schema"
        target-step: "read-new-schema"
        allow-removed-columns: false
        fail-on-incompatibility: true
