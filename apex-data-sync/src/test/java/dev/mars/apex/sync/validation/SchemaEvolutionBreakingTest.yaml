# =====================================================================================
# APEX Schema Evolution - Breaking Change Detection
# =====================================================================================
#
# Purpose:
#   Real-world database schema evolution test detecting breaking changes when
#   evolving from legacy to new database schema.
#
# Test Scenarios:
#   1. Legacy schema: LEGACY_CUSTOMERS table (original structure)
#   2. New schema: NEW_CUSTOMERS table (evolved with removed columns)
#   3. Breaking change detection: removed columns flagged
#
# Database Setup:
#   - Platform: H2 in-memory database (PostgreSQL compatibility mode)
#   - Database: mem:schema_evolution (shared for both tables)
#   - Tables: LEGACY_CUSTOMERS (source), NEW_CUSTOMERS (target)
#
# Schema Evolution Context:
#   - Simulates production database schema evolution
#   - Detects breaking changes before deployment
#   - Validates schema compatibility
#   - Prevents accidental data loss
#
# Breaking Change Criteria:
#   - allow-removed-columns: false (strict validation)
#   - fail-on-incompatibility: true (block breaking changes)
#   - Any removed column is breaking
#
# Expected Results:
#   - Breaking changes detected
#   - Validation fails if columns removed
#   - Schema diff report shows removed columns
#
# Related Tests:
#   - BreakingChangeDetectionTest: Unit test for breaking changes
#   - PreDeploymentValidationTest: Pre-deployment validation
#
# =====================================================================================

# APEX Data Sync - Schema Evolution Breaking Change Detection
# Real-world use case: Detect breaking changes when evolving database schema

metadata:
  id: "schema-evolution-breaking-change"
  name: "Schema Evolution - Breaking Change Detector"
  version: "1.0"
  type: "pipeline-config"
  description: "Detect breaking changes in schema evolution"

data-sources:
  # Legacy database schema (current production)
  - name: "legacy-database"
    type: "database"
    source-type: "h2"  # In-memory H2 database
    connection:
      database: "mem:schema_evolution;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

  # New database schema (proposed changes)
  - name: "new-database"
    type: "database"
    source-type: "h2"  # In-memory H2 database (same instance, different table)
    connection:
      database: "mem:schema_evolution;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"  # PostgreSQL compatibility mode
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "schema-evolution-validation"
  execution:
    mode: "sequential"  # Steps execute in order
  
  steps:
    # Read legacy schema (current production)
    - name: "read-legacy-schema"
      type: "read-schema"
      source: "legacy-database"
      parameters:
        table: "LEGACY_CUSTOMERS"  # Current production table

    # Read new schema (proposed changes)
    - name: "read-new-schema"
      type: "read-schema"
      source: "new-database"
      parameters:
        table: "NEW_CUSTOMERS"  # Proposed new table

    # Validate schema evolution (detect breaking changes)
    - name: "validate-schema-evolution"
      type: "schema-diff"
      description: "Detect breaking changes in schema evolution"
      parameters:
        source-step: "read-legacy-schema"  # Current production schema
        target-step: "read-new-schema"  # Proposed new schema
        allow-removed-columns: false  # Column removal is breaking
        fail-on-incompatibility: true  # Block breaking changes
