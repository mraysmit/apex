# APEX Report Path Resolution Test Pipeline
# Tests report output path resolution

metadata:
  id: "report-path-resolution-test"
  name: "Report Path Resolution Test"
  version: "1.0"
  type: "pipeline-config"
  author: "APEX Team"
  description: "Test pipeline for report path resolution"

data-sources:
  - name: "test-h2-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:report_path_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "report-path-resolution-pipeline"
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
  
  steps:
    - name: "read-schema"
      type: "read-schema"
      source: "test-h2-database"
      description: "Read schema for report generation"
      parameters:
        table: "INVENTORY"
