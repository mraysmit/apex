metadata:
  id: "concurrent-audit-rules"
  name: "Concurrent Audit Rules"
  version: "1.0.0"
  description: "Rules for shared-engine concurrent stage-output isolation"
  type: "rule-config"
  created-by: "APEX Test Suite"

rules:
  - id: "always-match"
    name: "Always Match"
    condition: "true"
    message: "Stage executed"
    severity: "INFO"

enrichments:
  - id: "copy-thread-id"
    name: "Copy Thread Id"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "threadId"
        target-field: "#trade.audit.values.threadId"

  - id: "copy-iteration"
    name: "Copy Iteration"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "iteration"
        target-field: "#trade.audit.values.iteration"

