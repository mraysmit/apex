# ============================================================================
# APEX RulesEngine Pipeline Integration Test - Invalid Data Source
# ============================================================================
#
# PURPOSE:
# Validates error handling when pipeline references non-existent data source.
# Tests that RulesEngine handles configuration errors gracefully.
#
# TEST COVERAGE:
# - Invalid data source reference in pipeline step
# - Graceful error handling (no exceptions during initialization)
# - Error RuleResult returned during execution
#
# USED BY: RulesEnginePipelineIntegrationTest.java
# ============================================================================

metadata:
  id: "rules-engine-pipeline-invalid-source-test"
  name: "RulesEngine Pipeline Integration - Invalid Source"
  type: "pipeline-config"
  version: "1.0"
  author: "APEX Core Team"
  tags: ["test", "pipeline", "error-handling", "invalid-source"]

# Define one data source
data-sources:
  - name: "valid-source"
    type: "inline"
    enabled: true
    description: "Valid data source"
    
    data:
      - id: 1
        name: "Test"
    
    operations:
      getAll: "SELECT * FROM data"

# Pipeline references NON-EXISTENT data source
pipeline:
  name: "invalid-source-pipeline"
  description: "Pipeline with invalid data source reference"
  
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
  
  steps:
    - name: "test-extract"
      type: "extract"
      source: "non-existent-source"  # This source does not exist!
      operation: "getAll"
      description: "Extract from non-existent source"

