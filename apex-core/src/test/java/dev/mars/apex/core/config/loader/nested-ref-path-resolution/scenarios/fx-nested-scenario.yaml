  processing-stages:

    - stage-name: "fx-validation"
      # Short relative path — resolved relative to this scenario file's directory.
      config-file: "stages/fx-stage.yaml"
      execution-order: 1
      failure-policy: "terminate"
      required: true
      depends-on: []
