---
# YAML configuration for YamlParameterBindingTest
# Tests parameter binding and query execution

metadata:
  name: parameter-binding-test
  id: parameter-binding-test
  type: rule-config
  author: Test Author
  description: Parameter binding test configuration
  version: 1.0.0
  created: 2025-11-27

data-sources:
  # H2 database for parameter binding tests
  - name: param-test-db
    type: database
    source-type: h2
    enabled: true
    description: H2 database for parameter binding tests
    connection:
      url: "jdbc:h2:mem:paramtestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
      username: sa
      password: ""
      driver-class-name: org.h2.Driver
    queries:
      createTable: "CREATE TABLE IF NOT EXISTS users (id INT PRIMARY KEY, name VARCHAR(255), email VARCHAR(255), status VARCHAR(50), last_login TIMESTAMP)"
      insertTestData: "INSERT INTO users (id, name, email, status) VALUES (1, 'Alice Johnson', 'alice@example.com', 'active'), (2, 'Bob Smith', 'bob@example.com', 'active'), (3, 'Charlie Brown', 'charlie@example.com', 'inactive')"
      getUserById: "SELECT * FROM users WHERE id = :id"
      getUsersByIdRangeAndStatus: "SELECT * FROM users WHERE id BETWEEN :minId AND :maxId AND status = :status"
      getUsersByNamePattern: "SELECT * FROM users WHERE name LIKE :namePattern"
      getUserWithOptionalField: "SELECT * FROM users WHERE id = :id AND (:optionalField IS NULL OR status = :optionalField)"
      updateUserActiveStatus: "UPDATE users SET status = CASE WHEN :isActive THEN 'active' ELSE 'inactive' END WHERE id = :id"
      updateLastLogin: "UPDATE users SET last_login = :loginDate WHERE id = :userId"
      getRecentLogins: "SELECT * FROM users WHERE last_login BETWEEN :startDate AND :endDate"
    parameter-names:
      - id
      - minId
      - maxId
      - status
      - namePattern
      - optionalField
      - isActive
      - userId
      - loginDate
      - startDate
      - endDate

  # Cache for parameter binding tests
  - name: param-test-cache
    type: cache
    source-type: memory
    enabled: true
    description: Cache for parameter binding tests
    cache:
      enabled: true
      max-size: 1000
      ttl-seconds: 300
      eviction-policy: LRU

