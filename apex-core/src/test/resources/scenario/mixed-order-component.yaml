# Mixed Order Component
# Component with both explicit execution-order and document order

metadata:
  id: "mixed-order-component"
  name: "Mixed Execution Order Component"
  version: "1.0.0"
  description: "Component demonstrating mixed execution order (explicit + document order)"
  type: "component"
  business-domain: "testing"
  owner: "APEX Demo Team"
  criticality: "low"
  sla-ms: 150
  tags:
    - testing
    - execution-order
    - mixed
  documentation-url: "https://apex-docs.example.com/components/mixed-order"

# Files with explicit execution order (execute first, in numerical order)
enrichment-refs:
  - file: "InputDataClassificationPhase1Test-enrichment-rules.yaml"
    execution-order: 10
    failure-policy: "continue-with-warnings"

rule-configurations:
  - file: "InputDataClassificationPhase1Test-validation-rules.yaml"
    execution-order: 20
    failure-policy: "terminate"

# Files without execution order (execute after explicit order, in document order)
config-files:
  - file: "BasicStageConfigurationTest-enrichment-rules.yaml"
    failure-policy: "continue-with-warnings"
  
  - file: "BasicStageConfigurationTest-validation-rules.yaml"
    failure-policy: "flag-for-review"

