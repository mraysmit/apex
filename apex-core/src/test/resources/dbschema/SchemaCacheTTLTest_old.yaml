metadata:
  id: "schema-cache-ttl-test-old"
  name: "Schema Cache TTL Test (Old)"
  created: "2025-02-03"
  description: "Cache TTL independence test - different expiration times per schema"
  author: "Mark Andrew Ray-Smith Cityline Ltd"
  version: "2.1"
  purpose: "Prove cache expiration in one schema doesn't affect other schemas"
  type: "rule-config"

# Data sources with DIFFERENT cache TTL values to test independent expiration
data-sources:
  - name: "sales-db-short-ttl"
    source-type: "postgresql"
    enabled: true
    type: "database"
    connection:
      database: "apex_cache_test"
      username: "test"
      password: "test"
      host: "localhost"
      port: 5432
      schema: "sales"
    cache:
      enabled: true
      max-size: 100
      ttl-seconds: 2  # SHORT TTL - expires quickly
      eviction-policy: "LRU"
      key-prefix: "sales-ttl"

  - name: "marketing-db-medium-ttl"
    source-type: "postgresql"
    enabled: true
    type: "database"
    connection:
      database: "apex_cache_test"
      username: "test"
      password: "test"
      host: "localhost"
      port: 5432
      schema: "marketing"
    cache:
      enabled: true
      max-size: 100
      ttl-seconds: 5  # MEDIUM TTL
      eviction-policy: "LRU"
      key-prefix: "marketing-ttl"

  - name: "finance-db-long-ttl"
    type: "database"
    connection:
      source-type: "postgresql"
      url: "jdbc:postgresql://localhost:5432/apex_cache_test"
      username: "test"
      password: "test"
      schema: "finance"
    cache:
      enabled: true
      max-size: 100
      ttl-seconds: 10  # LONG TTL - stays cached longest
      eviction-policy: "LRU"
      key-prefix: "finance-ttl"

enrichments:
  - id: "sales-lookup-short-ttl"
    type: "lookup-enrichment"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "sales-db-short-ttl"
        query: |
          SELECT name, schema_name 
          FROM customers 
          WHERE id = :key
    field-mappings:
      - source-field: "name"
        target-field: "sales_customer_name"
      - source-field: "schema_name"
        target-field: "sales_schema"

  - id: "marketing-lookup-medium-ttl"
    type: "lookup-enrichment"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "marketing-db-medium-ttl"
        query: |
          SELECT name, schema_name 
          FROM customers 
          WHERE id = :key
    field-mappings:
      - source-field: "name"
        target-field: "marketing_customer_name"
      - source-field: "schema_name"
        target-field: "marketing_schema"

  - id: "finance-lookup-long-ttl"
    type: "lookup-enrichment"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "finance-db-long-ttl"
        query: |
          SELECT name, schema_name 
          FROM customers 
          WHERE id = :key
    field-mappings:
      - source-field: "name"
        target-field: "finance_customer_name"
      - source-field: "schema_name"
        target-field: "finance_schema"

rules:
  - id: "validate-all-schemas-enriched"
    name: "Validate All Schemas Enriched"
    description: "All three schemas should return data even with different TTLs"
    condition: >
      sales_customer_name != null &&
      marketing_customer_name != null &&
      finance_customer_name != null
    message: "All schemas successfully enriched data"
    severity: "INFO"
