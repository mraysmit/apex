# This file references circular-a.yaml (CIRCULAR REFERENCE!)
enrichment-refs:
  - name: "circular-a-enrichments"
    source: "config/circular-a.yaml"
    enabled: true
    description: "Load enrichments from file A (circular!)"

# Enrichment in file B
enrichments:
  - id: enrichment_b
    name: Enrichment B
    description: Enrichment in file B
    enabled: true
    type: field-enrichment
    field-mappings:
      - source-field: "'value_b'"
        target-field: 'fieldB'

