metadata:
  id: circular-a
  name: Circular Reference A
  version: 1.0.0
  description: File A that references File B (which references File A back)
  type: external-data-config
  author: APEX Core Team
  created: '2025-11-10'
  tags:
    - test
    - circular

# This file references circular-b.yaml
enrichment-refs:
  - name: "circular-b-enrichments"
    source: "config/circular-b.yaml"
    enabled: true
    description: "Load enrichments from file B"

# Enrichment in file A
enrichments:
  - id: enrichment_a
    name: Enrichment A
    description: Enrichment in file A
    enabled: true
    type: field-enrichment
    field-mappings:
      - source-field: "'value_a'"
        target-field: 'fieldA'

