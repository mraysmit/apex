metadata:
  id: classpath-external-enrichments
  name: Classpath External Enrichments
  version: 1.0.0
  description: External enrichments loaded from classpath for groups-only logic testing
  type: external-data-config
  author: APEX Core Team
  created: '2025-11-10'
  tags:
    - test
    - classpath
    - groups-only-logic

# Enrichment that will be referenced by a group
enrichments:
  - id: external_enrichment_1
    name: External Enrichment 1
    description: Enrichment loaded from classpath
    enabled: true
    type: field-enrichment
    field-mappings:
      - source-field: "'external_value_1'"
        target-field: 'externalField1'

# Enrichment group that will be referenced by another group in the main file
enrichment-groups:
  - id: external_group_1
    name: External Group 1
    operator: AND
    stop-on-first-failure: false
    enrichment-ids:
      - external_enrichment_1

