metadata:
  id: mixed-main
  name: Mixed References - Main File
  version: 1.0.0
  description: Main file that references both file system and classpath files
  type: external-data-config
  author: APEX Core Team
  created: '2025-11-10'
  tags:
    - test
    - mixed

# Reference file from file system (using relative path)
enrichment-refs:
  - name: "filesystem-enrichments"
    source: "src/test/resources/config/groups-only-logic/mixed-filesystem.yaml"
    enabled: true
    description: "Load enrichments from file system"
  - name: "classpath-enrichments"
    source: "config/groups-only-logic/mixed-classpath.yaml"
    enabled: true
    description: "Load enrichments from classpath"

# Composite enrichment-group that references both external groups
enrichment-groups:
  - id: composite_mixed_group
    name: Composite Mixed Group
    description: References groups from both file system and classpath
    enabled: true
    error-handling: continue-on-error
    enrichment-group-references:
      - filesystem_group
      - classpath_group

