# APEX Schema Diff Pipeline - Detect Added Columns
# Tests schema-diff detecting added columns in target

metadata:
  id: "test-schema-diff-added-columns"
  name: "Schema Diff - Added Columns Test"
  version: "1.0"
  type: "pipeline-config"

data-sources:
  - name: "csv-source"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

  - name: "csv-target"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

pipeline:
  name: "detect-added-columns"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "csv-source"
      parameters:
        file: "src/test/resources/test-data/customers.csv"

    - name: "read-target-schema"
      type: "read-schema"
      source: "csv-target"
      parameters:
        file: "src/test/resources/test-data/customers_with_phone.csv"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        allow-added-columns: true
