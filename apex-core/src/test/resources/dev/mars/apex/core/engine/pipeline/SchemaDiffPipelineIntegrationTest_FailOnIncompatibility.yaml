# APEX Schema Diff Pipeline - Fail on Incompatibility
# Tests fail-on-incompatibility parameter causes pipeline failure

metadata:
  id: "test-schema-diff-fail-on-incompatibility"
  name: "Schema Diff - Fail on Incompatibility Test"
  version: "1.0"
  type: "pipeline-config"

data-sources:
  - name: "csv-source"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

  - name: "csv-target"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

pipeline:
  name: "fail-on-incompatibility"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "csv-source"
      parameters:
        file: "src/test/resources/test-data/customers.csv"

    - name: "read-target-schema"
      type: "read-schema"
      source: "csv-target"
      parameters:
        file: "src/test/resources/test-data/customers_no_email.csv"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        fail-on-incompatibility: true
