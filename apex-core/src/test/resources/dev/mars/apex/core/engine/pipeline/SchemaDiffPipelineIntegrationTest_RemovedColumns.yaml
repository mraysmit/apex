# APEX Schema Diff Pipeline - Detect Removed Columns
# Tests schema-diff detecting removed columns as breaking change

metadata:
  id: "test-schema-diff-removed-columns"
  name: "Schema Diff - Removed Columns Test"
  description: "Tests schema-diff detecting removed columns as breaking change"
  version: "1.0"
  author: "Mark Andrew Ray-Smith Cityline Ltd "
  type: "pipeline-config"

data-sources:
  - name: "csv-source"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

  - name: "csv-target"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

pipeline:
  name: "detect-removed-columns"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "csv-source"
      parameters:
        file: "src/test/resources/test-data/customers.csv"

    - name: "read-target-schema"
      type: "read-schema"
      source: "csv-target"
      parameters:
        file: "src/test/resources/test-data/customers_no_email.csv"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        allow-removed-columns: false
