# APEX Schema Diff Pipeline - Type Mappings
# Tests type mapping for SQL Server to PostgreSQL migration

metadata:
  id: "test-schema-diff-type-mappings"
  name: "Schema Diff - Type Mappings Test"
  description: "Tests type mapping for SQL Server to PostgreSQL migration"
  version: "1.0"
  author: "APEX Test Team"
  type: "pipeline-config"

data-sources:
  - name: "csv-sqlserver-types"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

  - name: "csv-postgres-types"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

pipeline:
  name: "type-mappings-comparison"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "csv-sqlserver-types"
      parameters:
        file: "src/test/resources/test-data/customers_sqlserver_types.csv"

    - name: "read-target-schema"
      type: "read-schema"
      source: "csv-postgres-types"
      parameters:
        file: "src/test/resources/test-data/customers_postgres_types.csv"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        type-mappings:
          NVARCHAR: VARCHAR
          DATETIME2: TIMESTAMP
          BIT: BOOLEAN
