# ============================================================================
# APEX RulesEngine Pipeline Integration Test - Pipeline + Enrichments
# ============================================================================
#
# PURPOSE:
# Validates document-order processing where pipeline executes before enrichments.
# Tests that RulesEngine.evaluate() processes sections in correct order.
#
# TEST COVERAGE:
# - Document order: pipeline section processed first
# - Enrichments section processed after pipeline
# - Both sections execute successfully in single evaluate() call
#
# USED BY: RulesEnginePipelineIntegrationTest.java
# ============================================================================

metadata:
  id: "rules-engine-pipeline-enrichments-test"
  name: "RulesEngine Pipeline Integration - With Enrichments"
  description: "Tests pipeline execution with enrichment processing"
  type: "rule-config"
  version: "1.0"
  author: "Mark A Ray-Smith Cityline Ltd"
  tags: ["test", "pipeline", "enrichments", "document-order"]

# Inline data source for pipeline
data-sources:
  - name: "test-enrichment-source"
    type: "database"
    source-type: "h2"
    enabled: true
    description: "H2 in-memory database for pipeline + enrichments"

    connection:
      database: "mem:enrichment_pipeline_test"
      username: "sa"
      password: ""

    custom-properties:
      schema:
        auto-create: true
        init-script: |
          CREATE TABLE IF NOT EXISTS test_data (
            id INTEGER PRIMARY KEY,
            name VARCHAR(255)
          );

          INSERT INTO test_data (id, name) VALUES
            (1, 'Test Record 1');

    queries:
      getAll: "SELECT id, name FROM test_data"

# Simple pipeline
pipeline:
  name: "test-pipeline-with-enrichments"
  description: "Pipeline that executes before enrichments"
  
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
  
  steps:
    - name: "test-extract"
      type: "extract"
      source: "test-enrichment-source"
      operation: "getAll"
      description: "Extract test data"

# Enrichments that execute after pipeline
enrichments:
  - id: "enrich-customer-tier"
    name: "Enrich Customer Tier"
    type: "lookup-enrichment"
    condition: "#customerId != null"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "inline"
        key-field: "customerId"
        data:
          - customerId: "CUST001"
            tier: "GOLD"
            discount: 0.15
          - customerId: "CUST002"
            tier: "SILVER"
            discount: 0.10
    field-mappings:
      - source-field: "tier"
        target-field: "customerTier"
      - source-field: "discount"
        target-field: "customerDiscount"

