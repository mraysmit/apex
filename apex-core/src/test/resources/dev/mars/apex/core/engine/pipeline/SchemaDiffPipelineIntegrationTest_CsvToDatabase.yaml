# APEX Schema Diff Pipeline - CSV to Database Comparison
# Tests comparing CSV schema to H2 database schema with matching columns

metadata:
  id: "test-schema-diff-csv-to-database"
  name: "CSV to Database Schema Comparison Test"
  version: "1.0"
  type: "pipeline-config"
  author: "APEX Team"
  description: "Test schema-diff with CSV and database sources"

data-sources:
  - name: "csv-source"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/core/engine/pipeline"

  - name: "h2-database"
    type: "database"
    source-type: "h2"
    connection:
      database: "mem:schema_diff_test;DB_CLOSE_DELAY=-1"
      username: "sa"
      password: ""
    enabled: true

pipeline:
  name: "csv-to-database-schema-comparison"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-csv-schema"
      type: "read-schema"
      source: "csv-source"
      parameters:
        file: "src/test/resources/test-data/customers.csv"

    - name: "read-database-schema"
      type: "read-schema"
      source: "h2-database"
      parameters:
        table: "customers"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-csv-schema"
        target-step: "read-database-schema"
        case-insensitive-names: true
        inferred-type-tolerance: true
