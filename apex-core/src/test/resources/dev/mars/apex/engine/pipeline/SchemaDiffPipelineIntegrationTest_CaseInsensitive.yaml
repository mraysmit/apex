# APEX Schema Diff Pipeline - Case-Insensitive Column Names
# Tests case-insensitive column name matching

metadata:
  id: "test-schema-diff-case-insensitive"
  name: "Schema Diff - Case-Insensitive Test"
  description: "Tests case-insensitive column name matching"
  version: "1.0"
  author: "Mark Andrew Ray-Smith Cityline Ltd "
  type: "pipeline-config"

data-sources:
  - name: "csv-source"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/engine/pipeline"

  - name: "csv-target"
    type: "file-system"
    source-type: "csv"
    enabled: true
    connection:
      base-path: "src/test/java/dev/mars/apex/engine/pipeline"

pipeline:
  name: "case-insensitive-comparison"
  execution:
    mode: "sequential"
  
  steps:
    - name: "read-source-schema"
      type: "read-schema"
      source: "csv-source"
      parameters:
        file: "src/test/resources/test-data/customers_uppercase.csv"

    - name: "read-target-schema"
      type: "read-schema"
      source: "csv-target"
      parameters:
        file: "src/test/resources/test-data/customers_lowercase.csv"

    - name: "compare-schemas"
      type: "schema-diff"
      parameters:
        source-step: "read-source-schema"
        target-step: "read-target-schema"
        case-insensitive-names: true
