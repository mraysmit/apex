# ============================================================================
# Document-order contract test.
# Items are listed enrichment-first, rule-second. The enrichment writes a
# field that the rule then evaluates. If ordering is broken (rules first),
# the rule would see null and fail.
# ============================================================================
metadata:
  id: "document-order-contract"
  name: "Document Order Contract Test"
  description: "Tests enrichment-before-rule document ordering"
  version: "1.0"
  author: "Mark A Ray-Smith Cityline Ltd"
  type: "rule-config"

# Enrichment FIRST: sets 'enrichedFlag' to true
enrichments:
  - id: "set-flag"
    type: "field-enrichment"
    field-mappings:
      - source-field: "constant"
        target-field: "enrichedFlag"
        expression: "'ENRICHED'"

# Rule SECOND: checks the enriched field
rules:
  - id: "check-flag"
    name: "Check Enriched Flag"
    condition: "#enrichedFlag == 'ENRICHED'"
    message: "Enriched flag was set by prior enrichment"
