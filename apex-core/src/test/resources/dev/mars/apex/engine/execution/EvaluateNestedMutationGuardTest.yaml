# ============================================================================
# Minimal enrichment config that writes into a nested target path.
# Used by EvaluateNestedMutationGuardTest to verify that the plain
# engine.evaluate() path does NOT mutate the caller's nested Maps.
# ============================================================================
metadata:
  id: "nested-mutation-guard"
  name: "Nested Mutation Guard"
  type: "rule-config"
  author: "Mark Andrew Ray-Smith Cityline Ltd"
  version: "1.0.0"
  description: "Writes source-field values into a pre-existing nested structure"

enrichments:
  - id: "write-to-nested"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "sourceValue"
        target-field: "#settlement.details.amount"
