# ============================================================================
# Copy-back contract test: verifies that after evaluate(), the caller's
# original inputData map is updated with enriched values.
# ============================================================================
metadata:
  id: "copy-back-contract"
  name: "InputData Copy-Back Contract Test"
  description: "Tests that inputData map is updated with enriched values after evaluate()"
  version: "1.0"
  author: "Mark A Ray-Smith Cityline Ltd"
  type: "rule-config"

enrichments:
  - id: "add-new-field"
    type: "field-enrichment"
    field-mappings:
      - source-field: "constant"
        target-field: "settlementStatus"
        expression: "'SETTLEMENT_READY'"

  - id: "lookup-currency"
    type: "lookup-enrichment"
    name: "Currency Lookup"
    lookup-config:
      lookup-key: "#currencyCode"
      lookup-dataset:
        type: "inline"
        key-field: "code"
        data:
          - code: "USD"
            name: "US Dollar"
          - code: "EUR"
            name: "Euro"
    field-mappings:
      - source-field: "name"
        target-field: "currencyName"
