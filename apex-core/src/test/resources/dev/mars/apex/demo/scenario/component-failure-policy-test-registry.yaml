# Component Failure Policy Test - Scenario Registry
# Tests that failure policies work correctly for components

metadata:
  id: "component-failure-policy-test-registry"
  name: "Component Failure Policy Test Registry"
  version: "1.0.0"
  description: "Registry for testing component failure policy handling"
  type: "scenario-registry"
  author: "APEX Demo Team"
  created: "2025-11-13"
  created-by: "APEX Demo Team"

# Scenario definitions
scenarios:
  # Test 1: Successful component execution
  - scenario-id: "component-success-test"
    config-file: "src/test/resources/dev/mars/apex/demo/scenario/component-success-test-scenario.yaml"

  # Test 2: Component-ref with continue-with-warnings policy
  - scenario-id: "component-continue-test"
    config-file: "src/test/resources/dev/mars/apex/demo/scenario/component-continue-test-scenario.yaml"

  # Test 3: Config-file with terminate policy
  - scenario-id: "component-terminate-test"
    config-file: "src/test/resources/dev/mars/apex/demo/scenario/component-terminate-test-scenario.yaml"

