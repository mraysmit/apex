    - demo
  documentation-url: "https://apex-docs.example.com/components/basic-validation"

# Rule configuration files
rule-configurations:
  - file: "BasicStageConfigurationTest-validation-rules.yaml"
    execution-order: 1
    failure-policy: "terminate"

