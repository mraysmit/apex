# Test overrides for apex-yaml-manager Spring context tests.
# The module does not require a database for controller/service tests,
# so disable JDBC/JPA auto-configuration to prevent context boot failures.
server.servlet.context-path=/yaml-manager
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.JdbcTemplateAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
