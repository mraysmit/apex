# APEX YAML Manager Application Configuration

# Server Configuration
server.port=8082
server.servlet.context-path=/yaml-manager

# Application Name
spring.application.name=apex-yaml-manager
spring.banner.location=classpath:banner.txt

# Logging Configuration
logging.level.root=INFO
logging.level.dev.mars.apex=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Jackson Configuration
spring.jackson.serialization.indent-output=true
spring.jackson.default-property-inclusion=non_null

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# YAML Manager Configuration
yaml-manager.max-file-size=10485760
yaml-manager.scan-timeout-seconds=300
yaml-manager.cache-enabled=true
yaml-manager.cache-ttl-minutes=60

# Default YAML base path (relative to project root when running with mvn spring-boot:run)
# This is used when the working directory is the project root
yaml-manager.default-base-path=apex-yaml-manager/src/test/resources/apex-yaml-samples/graph-100
yaml-manager.default-root-file=00-scenario-registry.yaml

