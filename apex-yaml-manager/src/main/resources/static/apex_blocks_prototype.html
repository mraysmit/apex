<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>Apex Blocks - Visual Rule Editor</title>
        <script src="https://unpkg.com/blockly/blockly.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <style>
            body {
                background-color: #f5f5f5;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            header {
                background-color: #2c3e50;
                color: white;
                padding: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
            }

            #main-container {
                display: flex;
                flex: 1;
                overflow: hidden;
            }

            #blocklyDiv {
                flex: 2;
                height: 100%;
            }

            #outputDiv {
                flex: 1;
                background-color: #1e1e1e;
                color: #d4d4d4;
                padding: 1rem;
                overflow: auto;
                border-left: 1px solid #ccc;
                font-family: 'Consolas', 'Monaco', monospace;
                display: flex;
                flex-direction: column;
            }

            #yamlOutput {
                white-space: pre;
                flex: 1;
            }

            .btn {
                background-color: #3498db;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                cursor: pointer;
                border-radius: 4px;
                font-size: 1rem;
            }

            .btn:hover {
                background-color: #2980b9;
            }

            h2 {
                margin-top: 0;
                color: #ecf0f1;
                font-size: 1.2rem;
                border-bottom: 1px solid #555;
                padding-bottom: 0.5rem;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Apex Blocks <span style="font-size: 0.8rem; opacity: 0.8;">(Prototype)</span></h1>
            <button class="btn" onclick="downloadYaml()">Download YAML</button>
        </header>

        <div id="main-container">
            <div id="blocklyDiv"></div>
            <div id="outputDiv">
                <h2>Generated YAML</h2>
                <div id="yamlOutput"># Drag blocks to generate YAML...</div>
            </div>
        </div>

        <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none">
            <category name="Configuration" colour="#5C81A6">
                <block type="apex_rule_config"></block>
                <block type="apex_data_source_config"></block>
            </category>
            <category name="Sections" colour="#7C5CA6">
                <block type="apex_section_data_source_refs"></block>
                <block type="apex_section_enrichment_groups"></block>
                <block type="apex_section_enrichments"></block>
                <block type="apex_section_rule_groups"></block>
                <block type="apex_section_rules"></block>
                <block type="apex_section_transformations"></block>
            </category>
            <category name="Data Sources" colour="#A65C5C">
                <block type="apex_data_source_database"></block>
                <block type="apex_data_source_rest"></block>
                <block type="apex_data_source_file"></block>
                <block type="apex_data_source_query"></block>
                <block type="apex_data_source_endpoint"></block>
                <block type="apex_data_source_ref"></block>
            </category>
            <category name="Rules" colour="#5CA681">
                <block type="apex_rule"></block>
                <block type="apex_rule_group"></block>
                <block type="apex_rule_ref"></block>
            </category>
            <category name="Transformations" colour="#A6815C">
                <block type="apex_conditional_transformation"></block>
                <block type="apex_action_set_field"></block>
            </category>
            <category name="Enrichments" colour="#A65C81">
                <block type="apex_enrichment_group"></block>
                <block type="apex_enrichment_ref"></block>
                <block type="apex_enrichment_calculation"></block>
                <block type="apex_enrichment_field"></block>
                <block type="apex_field_mapping"></block>
            </category>
            <category name="Lookups" colour="#805CA6">
                <block type="apex_enrichment_lookup"></block>
                <block type="apex_lookup_dataset_reference"></block>
                <block type="apex_lookup_dataset_database"></block>
                <block type="apex_lookup_parameter"></block>
            </category>
            <category name="Logic" colour="#5C81A6">
                <block type="apex_condition_compare"></block>
                <block type="apex_condition_logic"></block>
                <block type="apex_field_ref"></block>
                <block type="text"></block>
                <block type="math_number"></block>
                <block type="logic_boolean"></block>
            </category>
        </xml>

            apexGenerator.forBlock['apex_rule_config'] = function (block, generator) {
                const id = block.getFieldValue('ID');
                const version = block.getFieldValue('VERSION');
                const description = block.getFieldValue('DESCRIPTION');
                const author = block.getFieldValue('AUTHOR');
                const businessDomain = block.getFieldValue('BUSINESS_DOMAIN');
                const effectiveDate = block.getFieldValue('EFFECTIVE_DATE');
                const expirationDate = block.getFieldValue('EXPIRATION_DATE');
                const tagsStr = block.getFieldValue('TAGS');
                const sectionsCode = generator.statementToCode(block, 'SECTIONS');

                // Parse sections
                let rules = [];
                let ruleGroups = [];
                let enrichments = [];
                let enrichmentGroups = [];
                let transformations = [];
                let dataSourceRefs = [];

                if (sectionsCode) {
                    const sections = JSON.parse(`[${sectionsCode.replace(/,\s*$/, '')}]`);
                    sections.forEach(section => {
                        if (section.type === 'rules') rules = section.content;
                        if (section.type === 'rule-groups') ruleGroups = section.content;
                        if (section.type === 'enrichments') enrichments = section.content;
                        if (section.type === 'enrichment-groups') enrichmentGroups = section.content;
                        if (section.type === 'transformations') transformations = section.content;
                        if (section.type === 'data-source-refs') dataSourceRefs = section.content;
                    });
                }

                const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

                const metadata = {
                    id: id,
                    type: transformations.length > 0 ? "transformation-config" : "rule-config",
                    version: version
                };

                // Conditionally add optional fields
                if (description) metadata.description = description;
                if (author) metadata.author = author;
                if (businessDomain) metadata["business-domain"] = businessDomain;
                if (effectiveDate) metadata["effective-date"] = effectiveDate;
                if (expirationDate) metadata["expiration-date"] = expirationDate;
                if (tags.length > 0) metadata.tags = tags;

                const config = {
                    metadata: metadata
                };

                // Only add non-empty sections
                if (dataSourceRefs.length > 0) config["data-source-refs"] = dataSourceRefs;
                if (rules.length > 0) config.rules = rules;
                if (ruleGroups.length > 0) config["rule-groups"] = ruleGroups;
                if (enrichments.length > 0) config.enrichments = enrichments;
                if (enrichmentGroups.length > 0) config["enrichment-groups"] = enrichmentGroups;
                if (transformations.length > 0) config.transformations = transformations;

                return JSON.stringify(config, null, 2);
            };

            apexGenerator.forBlock['apex_action_set_field'] = function (block, generator) {
                const fieldCode = generator.valueToCode(block, 'FIELD', 0) || "'fieldName'";
                const valueCode = generator.valueToCode(block, 'VALUE', 0) || "null";

                // Process Field
                let field = fieldCode;
                if (field.startsWith("'") || field.startsWith('"')) {
                    field = field.replace(/^['"]|['"]$/g, "");
                }
                if (field.startsWith("#")) {
                    field = field.substring(1);
                }

                // Process Value
                let value = valueCode;
                if (typeof value === 'string') {
                    if (value.startsWith("'") || value.startsWith('"')) {
                        value = value.replace(/^['"]|['"]$/g, "");
                    } else if (value === "true" || value === "false") {
                        value = (value === "true");
                    } else if (!isNaN(value) && value.trim() !== '') {
                        value = Number(value);
                    }
                }

                const actionObj = {
                    "type": "set-field",
                    "field": field,
                    "value": value
                };

                return JSON.stringify(actionObj) + ',';
            };

                const actionsTrueCode = generator.statementToCode(block, 'ACTIONS_TRUE');
                const actionsFalseCode = generator.statementToCode(block, 'ACTIONS_FALSE');

                const actionsTrue = actionsTrueCode ? JSON.parse(`[${actionsTrueCode.replace(/,\s*$/, '')}]`) : [];
                const actionsFalse = actionsFalseCode ? JSON.parse(`[${actionsFalseCode.replace(/,\s*$/, '')}]`) : [];

                const ruleObj = {
                    "condition": condition.replace(/^"|"$/g, '')
                };

                if (actionsTrue.length > 0) {
                    ruleObj["actions-true"] = actionsTrue;
                }
                if (actionsFalse.length > 0) {
                    ruleObj["actions-false"] = actionsFalse;
                }

                const transformObj = {
                    "type": "conditional-transformation",
                    "enabled": enabled,
                    "transformation-rules": [ ruleObj ]
                };

                if (id) {
                    transformObj.id = id;
                }

                return JSON.stringify(transformObj) + ',';
            };

            apexGenerator.forBlock['apex_field_ref'] = function (block, generator) {
                const field = block.getFieldValue('FIELD');
                return [`#${field}`, 0];
            };

            apexGenerator.forBlock['apex_condition_compare'] = function (block, generator) {
                const a = generator.valueToCode(block, 'A', 0) || 'null';
                const op = block.getFieldValue('OP');
                const b = generator.valueToCode(block, 'B', 0) || 'null';
                return [`${a} ${op} ${b}`, 0];
            };

            apexGenerator.forBlock['apex_condition_logic'] = function (block, generator) {
                const a = generator.valueToCode(block, 'A', 0) || 'false';
                const op = block.getFieldValue('OP');
                const b = generator.valueToCode(block, 'B', 0) || 'false';
                return [`${a} ${op} ${b}`, 0];
            };

            apexGenerator.forBlock['text'] = function (block, generator) {
                const text = block.getFieldValue('TEXT');
                return [`'${text}'`, 0];
            };

            apexGenerator.forBlock['math_number'] = function (block, generator) {
                const num = block.getFieldValue('NUM');
                return [num, 0];
            };

            apexGenerator.forBlock['logic_boolean'] = function (block, generator) {
                const bool = block.getFieldValue('BOOL');
                return [bool.toLowerCase(), 0];
            };

            apexGenerator.scrub_ = function (block, code) {
                const nextBlock = block.nextConnection && block.nextConnection.targetBlock();
                const nextCode = apexGenerator.blockToCode(nextBlock);
                return code + nextCode;
            };

            // --- 2b. Custom Context Menu Configuration ---
            
            const CONTEXT_MENU_CONFIG = {
                'apex_rule_config': [
                    { input: 'SECTIONS', type: 'apex_section_data_source_refs', text: "Add Data Source Refs Section" },
                    { input: 'SECTIONS', type: 'apex_section_rules', text: "Add Rules Section" },
                    { input: 'SECTIONS', type: 'apex_section_rule_groups', text: "Add Rule Groups Section" },
                    { input: 'SECTIONS', type: 'apex_section_enrichments', text: "Add Enrichments Section" },
                    { input: 'SECTIONS', type: 'apex_section_enrichment_groups', text: "Add Enrichment Groups Section" },
                    { input: 'SECTIONS', type: 'apex_section_transformations', text: "Add Transformations Section" }
                ],
                'apex_data_source_config': [
                    { input: 'DATA_SOURCES', type: 'apex_data_source_database', text: 'Add Database Source' },
                    { input: 'DATA_SOURCES', type: 'apex_data_source_rest', text: 'Add REST Source' },
                    { input: 'DATA_SOURCES', type: 'apex_data_source_file', text: 'Add File Source' }
                ],
                'apex_section_data_source_refs': [
                    { input: 'DATA_SOURCE_REFS', type: 'apex_data_source_ref', text: 'Add Data Source Ref' }
                ],
                'apex_section_rules': [
                    { input: 'RULES', type: 'apex_rule', text: 'Add Rule' }
                ],
                'apex_section_rule_groups': [
                    { input: 'RULE_GROUPS', type: 'apex_rule_group', text: 'Add Rule Group' }
                ],
                'apex_section_enrichments': [
                    { input: 'ENRICHMENTS', type: 'apex_enrichment_calculation', text: 'Add Calculation Enrichment' },
                    { input: 'ENRICHMENTS', type: 'apex_enrichment_field', text: 'Add Field Enrichment' },
                    { input: 'ENRICHMENTS', type: 'apex_enrichment_lookup', text: 'Add Lookup Enrichment' }
                ],
                'apex_section_enrichment_groups': [
                    { input: 'ENRICHMENT_GROUPS', type: 'apex_enrichment_group', text: 'Add Enrichment Group' }
                ],
                'apex_section_transformations': [
                    { input: 'TRANSFORMATIONS', type: 'apex_conditional_transformation', text: 'Add Conditional Transformation' },
                    { input: 'TRANSFORMATIONS', type: 'apex_action_set_field', text: 'Add Set Field Action' }
                ],
                'apex_rule': [
                    { input: 'CONDITION', type: 'apex_condition_compare', text: 'Add Condition (Compare)' },
                    { input: 'CONDITION', type: 'apex_condition_logic', text: 'Add Condition (Logic)' },
                    { input: 'RESULT_FIELD', type: 'text', text: 'Add Result Field (Text)' },
                    { input: 'RESULT_FIELD', type: 'apex_field_ref', text: 'Add Result Field (Ref)' }
                ],
                'apex_rule_group': [
                    { input: 'RULE_IDS', type: 'apex_rule_ref', text: 'Add Rule Reference' }
                ],
                'apex_enrichment_group': [
                    { input: 'ENRICHMENT_IDS', type: 'apex_enrichment_ref', text: 'Add Enrichment Reference' }
                ],
                'apex_enrichment_calculation': [
                    { input: 'CONDITION', type: 'apex_condition_compare', text: 'Add Condition' },
                    { input: 'EXPRESSION', type: 'text', text: 'Add Expression (Text)' }
                ],
                'apex_enrichment_field': [
                    { input: 'CONDITION', type: 'apex_condition_compare', text: 'Add Condition' },
                    { input: 'MAPPINGS', type: 'apex_field_mapping', text: 'Add Field Mapping' }
                ],
                'apex_field_mapping': [
                    { input: 'EXPRESSION', type: 'text', text: 'Add Expression (Text)' }
                ],
                'apex_enrichment_lookup': [
                    { input: 'CONDITION', type: 'apex_condition_compare', text: 'Add Condition' },
                    { input: 'KEY', type: 'text', text: 'Add Key (Text)' },
                    { input: 'KEY', type: 'apex_field_ref', text: 'Add Key (Field Ref)' },
                    { input: 'DATASET', type: 'apex_lookup_dataset_reference', text: 'Add Dataset Reference' },
                    { input: 'DATASET', type: 'apex_lookup_dataset_database', text: 'Add Database Dataset' },
                    { input: 'MAPPINGS', type: 'apex_field_mapping', text: 'Add Field Mapping' }
                ],
                'apex_data_source_database': [
                    { input: 'QUERIES', type: 'apex_data_source_query', text: 'Add Query' }
                ],
                'apex_data_source_rest': [
                    { input: 'ENDPOINTS', type: 'apex_data_source_endpoint', text: 'Add Endpoint' }
                ],
                'apex_lookup_dataset_database': [
                    { input: 'PARAMETERS', type: 'apex_lookup_parameter', text: 'Add Parameter' }
                ],
                'apex_conditional_transformation': [
                    { input: 'CONDITION', type: 'apex_condition_compare', text: 'Add Condition' },
                    { input: 'ACTIONS_TRUE', type: 'apex_action_set_field', text: 'Add Action (True)' },
                    { input: 'ACTIONS_FALSE', type: 'apex_action_set_field', text: 'Add Action (False)' }
                ],
                'apex_action_set_field': [
                    { input: 'FIELD', type: 'apex_field_ref', text: 'Add Field Ref' },
                    { input: 'VALUE', type: 'text', text: 'Add Text Value' },
                    { input: 'VALUE', type: 'math_number', text: 'Add Number Value' },
                    { input: 'VALUE', type: 'logic_boolean', text: 'Add Boolean Value' }
                ],
                'apex_condition_compare': [
                    { input: 'A', type: 'apex_field_ref', text: 'Add Field Ref (Left)' },
                    { input: 'B', type: 'text', text: 'Add Text Value (Right)' },
                    { input: 'B', type: 'math_number', text: 'Add Number Value (Right)' }
                ],
                'apex_condition_logic': [
                    { input: 'A', type: 'apex_condition_compare', text: 'Add Comparison (Left)' },
                    { input: 'A', type: 'apex_condition_logic', text: 'Add Logic Group (Left)' },
                    { input: 'B', type: 'apex_condition_compare', text: 'Add Comparison (Right)' },
                    { input: 'B', type: 'apex_condition_logic', text: 'Add Logic Group (Right)' }
                ]
            };

            // Apply Context Menus
            for (const blockType in CONTEXT_MENU_CONFIG) {
                if (Blockly.Blocks[blockType]) {
                    Blockly.Blocks[blockType].customContextMenu = function(options) {
                        const menuItems = CONTEXT_MENU_CONFIG[blockType];
                        
                        menuItems.forEach(item => {
                            const input = this.getInput(item.input);
                            if (!input) return;

                            // Check if we can connect (Stack vs Single)
                            const isStack = input.type === Blockly.NEXT_STATEMENT; // 3 is NEXT_STATEMENT
                            const isConnected = input.connection && input.connection.targetConnection;
                            
                            // For Value/Single inputs, only show if empty
                            if (!isStack && isConnected) return;

                            const option = {
                                enabled: true,
                                text: item.text,
                                callback: function() {
                                    const workspace = this.workspace;
                                    const newBlock = workspace.newBlock(item.type);
                                    newBlock.initSvg();
                                    newBlock.render();

                                    let parentConnection = input.connection;
                                    
                                    if (isStack) {
                                        // Find the last connection in the stack
                                        while (parentConnection.targetConnection) {
                                            parentConnection = parentConnection.targetConnection.sourceBlock_.nextConnection;
                                            if (!parentConnection) break; // Should not happen for well-formed stacks
                                        }
                                        if (parentConnection) {
                                            parentConnection.connect(newBlock.previousConnection);
                                        }
                                    } else {
                                        // Connect directly (Value or Statement)
                                        const childConnection = newBlock.outputConnection || newBlock.previousConnection;
                                        parentConnection.connect(childConnection);
                                    }
                                    
                                    newBlock.select();
                                }.bind(this)
                            };
                            options.push(option);
                        });
                    };
                }
            }

            // --- 3. Initialize Workspace ---

            const workspace = Blockly.inject('blocklyDiv', {
                toolbox: document.getElementById('toolbox'),
                scrollbars: true,
                trashcan: true,
                zoom: {
                    controls: true,
                    wheel: true,
                    startScale: 1.0,
                    maxScale: 3,
                    minScale: 0.3,
                    scaleSpeed: 1.2,
                    pinch: true
                }
            });

            // --- 4. Live Update Logic ---

            function updateYaml() {
                const topBlocks = workspace.getTopBlocks(true); // Order by position
                if (topBlocks.length === 0) {
                    document.getElementById('yamlOutput').textContent = "# Drag 'Configuration' or 'Data Source Config' block to start";
                    return;
                }

                const configBlocks = topBlocks.filter(b => b.type === 'apex_rule_config' || b.type === 'apex_data_source_config');
                
                if (configBlocks.length === 0) {
                    document.getElementById('yamlOutput').textContent = "# Please start with a 'Configuration' or 'Data Source Config' block";
                    return;
                }

                try {
                    const yamlParts = [];
                    
                    configBlocks.forEach(block => {
                        const jsonStr = apexGenerator.blockToCode(block);
                        if (jsonStr && jsonStr.trim()) {
                            const jsonObj = JSON.parse(jsonStr);
                            const yamlStr = jsyaml.dump(jsonObj);
                            yamlParts.push(yamlStr);
                        }
                    });
                    
                    if (yamlParts.length > 0) {
                        document.getElementById('yamlOutput').textContent = yamlParts.join('\n---\n');
                    }
                } catch (e) {
                    console.error(e);
                    document.getElementById('yamlOutput').textContent = "# Error generating YAML: " + e.message;
                }
            }

            workspace.addChangeListener(updateYaml);

            // --- 5. Download Function ---
            function downloadYaml() {
                const yamlContent = document.getElementById('yamlOutput').textContent;
                const blob = new Blob([yamlContent], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'apex-rules.yaml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // --- 6. Click-to-Fill Support (Event Listener) ---
            
            const AUTO_FILL_MAP = {
                'apex_rule_config': {
                    'SECTIONS': [
                        'apex_section_data_source_refs',
                        'apex_section_rules',
                        'apex_section_rule_groups',
                        'apex_section_enrichments',
                        'apex_section_enrichment_groups',
                        'apex_section_transformations'
                    ]
                },
                'apex_data_source_config': {
                    'DATA_SOURCES': [
                        'apex_data_source_database',
                        'apex_data_source_rest',
                        'apex_data_source_file',
                        'apex_data_source_query',
                        'apex_data_source_endpoint',
                        'apex_data_source_ref'
                    ]
                },
                'apex_section_data_source_refs': { 'DATA_SOURCE_REFS': 'apex_data_source_ref' },
                'apex_section_rules': { 'RULES': 'apex_rule' },
                'apex_section_rule_groups': { 'RULE_GROUPS': 'apex_rule_group' },
                'apex_section_enrichments': { 
                    'ENRICHMENTS': [
                        'apex_enrichment_calculation',
                        'apex_enrichment_field',
                        'apex_enrichment_lookup'
                    ]
                },
                'apex_section_enrichment_groups': { 'ENRICHMENT_GROUPS': 'apex_enrichment_group' },
                'apex_section_transformations': { 
                    'TRANSFORMATIONS': [
                        'apex_conditional_transformation',
                        'apex_action_set_field'
                    ]
                },
                
                'apex_rule': {
                    'CONDITION': 'apex_condition_compare',
                    'RESULT_FIELD': 'text'
                },
                'apex_rule_group': { 'RULE_IDS': 'apex_rule_ref' },
                
                'apex_enrichment_group': { 'ENRICHMENT_IDS': 'apex_enrichment_ref' },
                'apex_enrichment_calculation': { 
                    'CONDITION': 'apex_condition_compare',
                    'EXPRESSION': 'text'
                },
                'apex_enrichment_field': {
                    'CONDITION': 'apex_condition_compare',
                    'MAPPINGS': 'apex_field_mapping'
                },
                'apex_enrichment_lookup': {
                    'CONDITION': 'apex_condition_compare',
                    'KEY': 'text',
                    'DATASET': 'apex_lookup_dataset_reference',
                    'MAPPINGS': 'apex_field_mapping'
                },
                
                'apex_data_source_database': { 'QUERIES': 'apex_data_source_query' },
                'apex_data_source_rest': { 'ENDPOINTS': 'apex_data_source_endpoint' },
                'apex_lookup_dataset_database': { 'PARAMETERS': 'apex_lookup_parameter' },
                
                'apex_conditional_transformation': {
                    'CONDITION': 'apex_condition_compare',
                    'ACTIONS_TRUE': 'apex_action_set_field',
                    'ACTIONS_FALSE': 'apex_action_set_field'
                },
                
                'apex_action_set_field': {
                    'FIELD': 'apex_field_ref',
                    'VALUE': 'text'
                },
                'apex_field_mapping': { 'EXPRESSION': 'text' },
                
                'apex_condition_compare': {
                    'A': 'apex_field_ref',
                    'B': 'text'
                },
                'apex_condition_logic': {
                    'A': 'apex_condition_compare',
                    'B': 'apex_condition_compare'
                }
            };

            let lastClickTime = 0;
            let lastClickedBlockId = null;

            function onBlockClick(event) {
                // We only care about click events on blocks
                if (event.type === Blockly.Events.CLICK && event.blockId) {
                    const workspace = Blockly.getMainWorkspace();
                    const block = workspace.getBlockById(event.blockId);
                    
                    if (!block) return;

                    // Double Click to Delete
                    const currentTime = new Date().getTime();
                    const isDoubleClick = (event.blockId === lastClickedBlockId) && ((currentTime - lastClickTime) < 400);
                    
                    lastClickTime = currentTime;
                    lastClickedBlockId = event.blockId;

                    if (isDoubleClick) {
                        if (block.isDeletable()) {
                            block.dispose(true);
                            updateYaml();
                        }
                        return;
                    }
                    
                    const config = AUTO_FILL_MAP[block.type];
                    if (!config) return;

                    // Find the first empty input defined in our map
                    for (const inputName in config) {
                        const input = block.getInput(inputName);
                        if (!input || !input.connection) continue;
                        
                        const targetConfig = config[inputName];
                        
                        // Case 1: Array (Rotation/Cycle - Replace existing)
                        if (Array.isArray(targetConfig)) {
                            const parentConnection = input.connection;
                            const targetConnection = parentConnection.targetConnection;
                            
                            let nextType = targetConfig[0];
                            
                            if (targetConnection) {
                                // There is already a block connected
                                const existingBlock = targetConnection.sourceBlock_;
                                
                                // Check if the existing block has any children (content)
                                // We iterate over inputs (like 'RULES', 'ENRICHMENTS') to see if they are populated
                                const hasChildren = existingBlock.inputList.some(inp => 
                                    inp.connection && inp.connection.targetConnection
                                );

                                if (hasChildren) {
                                    // If populated, do NOT rotate/replace. 
                                    // This prevents accidental deletion of user data.
                                    return;
                                }

                                const idx = targetConfig.indexOf(existingBlock.type);
                                
                                // Calculate next type
                                if (idx !== -1) {
                                    nextType = targetConfig[(idx + 1) % targetConfig.length];
                                }
                                
                                // Remove the existing block (healStack=true preserves blocks connected after it)
                                existingBlock.dispose(true);
                            }
                            
                            // Create and connect the new block
                            createAndConnect(workspace, nextType, parentConnection);
                            return; 
                        }
                        // Case 2: String (Single Input or Append to Stack)
                        else if (typeof targetConfig === 'string') {
                            // Check if it's a statement input (stack) - 3 is NEXT_STATEMENT (Input Type)
                            if (input.type === 3) { 
                                // Walk to the end of the stack
                                let connection = input.connection;
                                while (connection.targetConnection) {
                                    connection = connection.targetConnection.sourceBlock_.nextConnection;
                                    if (!connection) break; 
                                }
                                if (connection) {
                                    createAndConnect(workspace, targetConfig, connection);
                                    return;
                                }
                            } else {
                                // Value or Dummy input - only fill if empty
                                if (!input.connection.targetConnection) {
                                    createAndConnect(workspace, targetConfig, input.connection);
                                    return;
                                }
                            }
                        }
                    }
                }
            }
            
            function createAndConnect(workspace, type, parentConnection) {
                 console.log("Auto-filling " + type);
                 const newBlock = workspace.newBlock(type);
                 newBlock.initSvg();
                 newBlock.render();
                 
                 const childConnection = newBlock.outputConnection || newBlock.previousConnection;
                 if (childConnection) {
                     parentConnection.connect(childConnection);
                     newBlock.select();
                     updateYaml();
                 }
            }

            workspace.addChangeListener(onBlockClick);

            // Create a default starting block
            const startBlock = workspace.newBlock('apex_rule_config');
            startBlock.initSvg();
            startBlock.render();
            startBlock.moveBy(50, 50);

            // Force initial update
            if (typeof jsyaml === 'undefined') {
                document.getElementById('yamlOutput').textContent = "# Error: js-yaml library failed to load. Please check your internet connection.";
            } else {
                updateYaml();
            }
        </script>
    </body>
