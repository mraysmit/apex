<!DOCTYPE html>
<html>

    <head>
        <meta charset="utf-8">
        <title>Apex Blocks - Visual Rule Editor</title>
        <script src="https://unpkg.com/blockly/blockly.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
        <style>
            body {
                background-color: #f5f5f5;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                display: flex;
                flex-direction: column;
                height: 100vh;
            }

            header {
                background-color: #2c3e50;
                color: white;
                padding: 1rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            h1 {
                margin: 0;
                font-size: 1.5rem;
            }

            #main-container {
                display: flex;
                flex: 1;
                overflow: hidden;
            }

            #blocklyDiv {
                flex: 2;
                height: 100%;
            }

            #outputDiv {
                flex: 1;
                background-color: #1e1e1e;
                color: #d4d4d4;
                padding: 1rem;
                overflow: auto;
                border-left: 1px solid #ccc;
                font-family: 'Consolas', 'Monaco', monospace;
                display: flex;
                flex-direction: column;
            }

            #yamlOutput {
                white-space: pre;
                flex: 1;
            }

            .btn {
                background-color: #3498db;
                color: white;
                border: none;
                padding: 0.5rem 1rem;
                cursor: pointer;
                border-radius: 4px;
                font-size: 1rem;
            }

            .btn:hover {
                background-color: #2980b9;
            }

            h2 {
                margin-top: 0;
                color: #ecf0f1;
                font-size: 1.2rem;
                border-bottom: 1px solid #555;
                padding-bottom: 0.5rem;
            }
        </style>
    </head>

    <body>
        <header>
            <h1>Apex Blocks <span style="font-size: 0.8rem; opacity: 0.8;">(Prototype)</span></h1>
            <button class="btn" onclick="downloadYaml()">Download YAML</button>
        </header>

        <div id="main-container">
            <div id="blocklyDiv"></div>
            <div id="outputDiv">
                <h2>Generated YAML</h2>
                <div id="yamlOutput"># Drag blocks to generate YAML...</div>
            </div>
        </div>

        <xml xmlns="https://developers.google.com/blockly/xml" id="toolbox" style="display: none">
            <category name="Configuration" colour="#5C81A6">
                <block type="apex_rule_config"></block>
                <block type="apex_data_source_config"></block>
            </category>
            <category name="Sections" colour="#7C5CA6">
                <block type="apex_section_data_source_refs"></block>
                <block type="apex_section_enrichment_groups"></block>
                <block type="apex_section_enrichments"></block>
                <block type="apex_section_rule_groups"></block>
                <block type="apex_section_rules"></block>
                <block type="apex_section_transformations"></block>
            </category>
            <category name="Data Sources" colour="#A65C5C">
                <block type="apex_data_source_database"></block>
                <block type="apex_data_source_rest"></block>
                <block type="apex_data_source_file"></block>
                <block type="apex_data_source_query"></block>
                <block type="apex_data_source_endpoint"></block>
                <block type="apex_data_source_ref"></block>
            </category>
            <category name="Rules" colour="#5CA681">
                <block type="apex_rule"></block>
                <block type="apex_rule_group"></block>
                <block type="apex_rule_ref"></block>
            </category>
            <category name="Transformations" colour="#A6815C">
                <block type="apex_conditional_transformation"></block>
                <block type="apex_action_set_field"></block>
            </category>
            <category name="Enrichments" colour="#A65C81">
                <block type="apex_enrichment_group"></block>
                <block type="apex_enrichment_ref"></block>
                <block type="apex_enrichment_calculation"></block>
                <block type="apex_enrichment_field"></block>
                <block type="apex_enrichment_lookup"></block>
                <block type="apex_field_mapping"></block>
            </category>
            <category name="Logic" colour="#5C81A6">
                <block type="apex_condition_compare"></block>
                <block type="apex_condition_logic"></block>
                <block type="apex_field_ref"></block>
                <block type="text"></block>
                <block type="math_number"></block>
                <block type="logic_boolean"></block>
            </category>
        </xml>

        <script>

            apexGenerator.forBlock['apex_rule_config'] = function (block, generator) {
                const id = block.getFieldValue('ID');

                const description = block.getFieldValue('DESCRIPTION');
                const author = block.getFieldValue('AUTHOR');
                const businessDomain = block.getFieldValue('BUSINESS_DOMAIN');
                const effectiveDate = block.getFieldValue('EFFECTIVE_DATE');
                const expirationDate = block.getFieldValue('EXPIRATION_DATE');
                const tagsStr = block.getFieldValue('TAGS');
                const sectionsCode = generator.statementToCode(block, 'SECTIONS');

                // Parse sections
                let rules = [];
                let ruleGroups = [];
                let enrichments = [];
                let enrichmentGroups = [];
                let transformations = [];
                let dataSourceRefs = [];

                if (sectionsCode) {
                    const sections = JSON.parse(`[${sectionsCode.replace(/,\s*$/, '')}]`);
                    sections.forEach(section => {
                        if (section.type === 'rules') rules = section.content;
                        if (section.type === 'rule-groups') ruleGroups = section.content;
                        if (section.type === 'enrichments') enrichments = section.content;
                        if (section.type === 'enrichment-groups') enrichmentGroups = section.content;
                        if (section.type === 'transformations') transformations = section.content;
                        if (section.type === 'data-source-refs') dataSourceRefs = section.content;
                    });
                }

                const tags = tagsStr ? tagsStr.split(',').map(t => t.trim()).filter(t => t.length > 0) : [];

                const metadata = {
                    id: id,
                    type: transformations.length > 0 ? "transformation-config" : "rule-config",
                    version: version
                };

                // Conditionally add optional fields
                if (description) metadata.description = description;
                if (author) metadata.author = author;
                if (businessDomain) metadata["business-domain"] = businessDomain;
                if (effectiveDate) metadata["effective-date"] = effectiveDate;
                if (expirationDate) metadata["expiration-date"] = expirationDate;
                if (tags.length > 0) metadata.tags = tags;

                const config = {
                    metadata: metadata
                };

                // Only add non-empty sections
                if (dataSourceRefs.length > 0) config["data-source-refs"] = dataSourceRefs;
                if (rules.length > 0) config.rules = rules;
                if (ruleGroups.length > 0) config["rule-groups"] = ruleGroups;
                if (enrichments.length > 0) config.enrichments = enrichments;
                if (enrichmentGroups.length > 0) config["enrichment-groups"] = enrichmentGroups;
                if (transformations.length > 0) config.transformations = transformations;

                return JSON.stringify(config, null, 2);

                const valueCode = generator.valueToCode(block, 'VALUE', 0) || "null";

                // Process Field
                let field = fieldCode;
                if (field.startsWith("'") || field.startsWith('"')) {
                    field = field.replace(/^['"]|['"]$/g, "");
                }
                if (field.startsWith("#")) {
                    field = field.substring(1);
                }

                // Process Value
                let value = valueCode;
                if (typeof value === 'string') {
                    if (value.startsWith("'") || value.startsWith('"')) {
                        value = value.replace(/^['"]|['"]$/g, "");
                    } else if (value === "true" || value === "false") {
                        value = (value === "true");
                    } else if (!isNaN(value) && value.trim() !== '') {
                        value = Number(value);
                    }
                }

                const actionObj = {
                    "type": "set-field",
                    "field": field,
                    "value": value
                };

                return JSON.stringify(actionObj) + ',';

                const ruleObj = {

                const transformObj = {

            // --- 4. Live Update Logic ---

            function updateYaml() {
                const topBlocks = workspace.getTopBlocks(true); // Order by position
                if (topBlocks.length === 0) {
                    document.getElementById('yamlOutput').textContent = "# Drag 'Configuration' or 'Data Source Config' block to start";
                    return;
                }

                const configBlocks = topBlocks.filter(b => b.type === 'apex_rule_config' || b.type === 'apex_data_source_config');
                
                if (configBlocks.length === 0) {
                    document.getElementById('yamlOutput').textContent = "# Please start with a 'Configuration' or 'Data Source Config' block";
                    return;
                }

                try {
                    const yamlParts = [];
                    
                    configBlocks.forEach(block => {
                        const jsonStr = apexGenerator.blockToCode(block);
                        if (jsonStr && jsonStr.trim()) {
                            const jsonObj = JSON.parse(jsonStr);
                            const yamlStr = jsyaml.dump(jsonObj);
                            yamlParts.push(yamlStr);
                        }
                    });
                    
                    if (yamlParts.length > 0) {
                        document.getElementById('yamlOutput').textContent = yamlParts.join('\n---\n');
                    }
                } catch (e) {
                    console.error(e);
                    document.getElementById('yamlOutput').textContent = "# Error generating YAML: " + e.message;
                }
            }

            workspace.addChangeListener(updateYaml);

            // --- 5. Download Function ---
            function downloadYaml() {
                const yamlContent = document.getElementById('yamlOutput').textContent;
                const blob = new Blob([yamlContent], { type: 'text/yaml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'apex-rules.yaml';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            }

            // Create a default starting block
            const startBlock = workspace.newBlock('apex_rule_config');
            startBlock.initSvg();
            startBlock.render();
            startBlock.moveBy(50, 50);

            // Force initial update
            if (typeof jsyaml === 'undefined') {
                document.getElementById('yamlOutput').textContent = "# Error: js-yaml library failed to load. Please check your internet connection.";
            } else {
                updateYaml();
            }
        </script>
    </body>

</html>
