<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js YAML Dependency Tree Viewer</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/d3-tree-viewer.css">
    
    <!-- External Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-regex.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/d3-tree-viewer.js" defer></script>
</head>
<body>
    <div class="main-container">
        <!-- Left Panel: Tree Viewer -->
        <div class="tree-panel">
            <!-- Tree Header with Toolbar -->
            <div class="tree-header">
                <h2>Dependency Tree</h2>
                <div class="tree-toolbar">
                    <button class="toolbar-btn" id="zoom-in-btn" title="Zoom In">Zoom In</button>
                    <button class="toolbar-btn" id="zoom-out-btn" title="Zoom Out">Zoom Out</button>
                    <button class="toolbar-btn" id="reset-zoom-btn" title="Reset Zoom">Reset</button>
                    <button class="toolbar-btn" id="expand-all-btn" title="Expand All">Expand All</button>
                    <button class="toolbar-btn" id="collapse-all-btn" title="Collapse All">Collapse All</button>
                </div>
            </div>
            
            <!-- Tree Container -->
            <div id="tree-container">
                <div id="loading">Loading tree data...</div>
                <div id="error" style="display: none;"></div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>

        <!-- Right Panel: File Content -->
        <div class="content-panel">
            <div class="content-header">
                <h3>File Content</h3>
            </div>

            <div class="content-body">
                <!-- File Metadata Section -->
                <div class="file-metadata" id="file-metadata" style="display: none;">
                    <div class="metadata-grid" id="metadata-grid">
                        <!-- Metadata items will be populated by JavaScript -->
                    </div>
                </div>

                <div class="placeholder-content" id="placeholder-content">
                    Click on any node in the tree to view its YAML content here.
                </div>
                <div class="yaml-content" id="yaml-content" style="display: none;">
                    <pre><code class="language-yaml" id="yaml-code"></code></pre>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
