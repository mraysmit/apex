<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D3.js YAML Dependency Tree Viewer</title>
    
    <!-- External CSS -->
    <link rel="stylesheet" href="css/d3-tree-viewer.css?v=2">
    
    <!-- External Libraries -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-regex.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/apex-keyword-tooltips.js?v=1" defer></script>
    <script src="js/d3-tree-viewer.js?v=2" defer></script>
</head>
<body>
    <div class="main-container">
        <!-- Left Sidebar (Collapsible) -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>File Browser</h3>
                <button class="sidebar-close-btn" id="sidebar-close-btn" title="Close Sidebar">×</button>
            </div>
            <div class="sidebar-content">
                <!-- Directory Accordion -->
                <div class="accordion-section">
                    <div class="accordion-header" data-section="directory">
                        <span>Directory</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content" id="accordion-directory">
                        <input type="text" id="directory-input" class="sidebar-input"
                               placeholder="Enter directory path..."
                               value="C:/Users/mraysmit/dev/idea-projects/apex-rules-engine/apex-yaml-manager/src/test/resources/apex-yaml-samples/graph-100">
                        <button class="sidebar-btn" id="browse-btn">Browse</button>
                        <label class="sidebar-checkbox">
                            <input type="checkbox" id="include-subfolders" checked>
                            Include Subfolders
                        </label>
                    </div>
                </div>

                <!-- Search Accordion -->
                <div class="accordion-section">
                    <div class="accordion-header" data-section="search">
                        <span>Search</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content" id="accordion-search">
                        <input type="text" id="search-input" class="sidebar-input" placeholder="Search files...">
                    </div>
                </div>

                <!-- Filter by Type Accordion -->
                <div class="accordion-section">
                    <div class="accordion-header" data-section="filter">
                        <span>Filter by Type</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content" id="accordion-filter">
                        <label class="sidebar-checkbox">
                            <input type="checkbox" class="file-type-filter" value="scenario" checked>
                            Scenarios
                        </label>
                        <label class="sidebar-checkbox">
                            <input type="checkbox" class="file-type-filter" value="rules" checked>
                            Rules
                        </label>
                        <label class="sidebar-checkbox">
                            <input type="checkbox" class="file-type-filter" value="enrichment" checked>
                            Enrichments
                        </label>
                        <label class="sidebar-checkbox">
                            <input type="checkbox" class="file-type-filter" value="other" checked>
                            Other
                        </label>
                    </div>
                </div>

                <!-- Statistics Accordion -->
                <div class="accordion-section">
                    <div class="accordion-header" data-section="statistics">
                        <span>Statistics</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content" id="accordion-statistics">
                        <div class="sidebar-stats" id="sidebar-stats">
                            <div class="stat-item">
                                <span class="stat-label">Total Files:</span>
                                <span class="stat-value" id="stat-total">0</span>
                            </div>
                            <!-- Dynamic type statistics will be added here -->
                        </div>
                    </div>
                </div>

                <!-- Display Options Accordion -->
                <div class="accordion-section">
                    <div class="accordion-header" data-section="display">
                        <span>Display Options</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="accordion-content" id="accordion-display">
                        <label class="sidebar-checkbox">
                            <input type="checkbox" id="tooltip-toggle" checked>
                            Show Hover Tooltips
                        </label>
                        <label class="sidebar-checkbox">
                            <input type="checkbox" id="show-path-toggle" checked>
                            Show Directory Path
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar Toggle Button (when sidebar is closed) -->
        <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Open Sidebar">
            ☰
        </button>

        <!-- Left Panel: Tree Viewer -->
        <div class="tree-panel">
            <!-- Tree Header with Toolbar -->
            <div class="tree-header">
                <div class="tree-title-container">
                    <h2>Dependency Tree</h2>
                    <span class="tree-path" id="tree-path" style="display: none;"></span>
                </div>
                <div class="tree-toolbar">
                    <button class="toolbar-btn" id="zoom-in-btn" title="Zoom In">Zoom In</button>
                    <button class="toolbar-btn" id="zoom-out-btn" title="Zoom Out">Zoom Out</button>
                    <button class="toolbar-btn" id="reset-zoom-btn" title="Reset Zoom">Reset</button>
                    <button class="toolbar-btn" id="expand-all-btn" title="Expand All">Expand All</button>
                    <button class="toolbar-btn" id="collapse-all-btn" title="Collapse All">Collapse All</button>
                </div>
            </div>
            
            <!-- Tree Container -->
            <div id="tree-container">
                <div id="loading">Loading tree data...</div>
                <div id="error" style="display: none;"></div>
            </div>

            <!-- Floating Tooltip for File Preview -->
            <div id="file-tooltip" class="file-tooltip" style="display: none;">
                <div class="tooltip-header">
                    <span class="tooltip-title" id="tooltip-title">File Preview</span>
                    <span class="tooltip-close" id="tooltip-close">×</span>
                </div>
                <div class="tooltip-metadata" id="tooltip-metadata"></div>
                <div class="tooltip-content">
                    <pre><code class="language-yaml" id="tooltip-code"></code></pre>
                </div>
            </div>
        </div>

        <!-- Resizer -->
        <div class="resizer" id="resizer"></div>

        <!-- Content Panel Toggle Button (when panel is closed) -->
        <button class="content-toggle-btn" id="content-toggle-btn" title="Open Content Panel">
            ☰
        </button>

        <!-- Right Panel: File Content -->
        <div class="content-panel" id="content-panel">
            <div class="content-header">
                <div style="display: flex; justify-content: space-between; align-items: center; width: 100%;">
                    <h3>File Content</h3>
                    <button class="content-close-btn" id="content-close-btn" title="Close Panel">×</button>
                </div>
            </div>

            <div class="content-body">
                <div class="placeholder-content" id="placeholder-content">
                    Click on any node in the tree to view its YAML content here.
                </div>

                <!-- Metadata Accordion -->
                <div class="content-accordion-section" id="metadata-section" style="display: none;">
                    <div class="content-accordion-header" data-section="metadata">
                        <span>File Metadata</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="content-accordion-content" id="content-accordion-metadata">
                        <div class="file-metadata" id="file-metadata">
                            <div class="metadata-grid" id="metadata-grid">
                                <!-- Metadata items will be populated by JavaScript -->
                            </div>
                        </div>
                    </div>
                </div>

                <!-- YAML Content Accordion -->
                <div class="content-accordion-section" id="yaml-section" style="display: none;">
                    <div class="content-accordion-header" data-section="yaml">
                        <span>YAML Content</span>
                        <span class="accordion-icon">▼</span>
                    </div>
                    <div class="content-accordion-content" id="content-accordion-yaml">
                        <div class="yaml-content" id="yaml-content">
                            <pre><code class="language-yaml" id="yaml-code"></code></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
