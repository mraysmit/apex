# PostgreSQL Custom Schema Lookup Configuration
# Demonstrates PostgreSQL database integration with custom schema ("myschema")
# Use Case: Customer profile data source in a non-default schema for enrichment lookups

# ============================================================================
# APEX YAML Configuration File
# ============================================================================
# Used by: PostgreSQLSchemaSimpleLookupTest.java
# Purpose: PostgreSQL simple lookup demonstration using custom schema "myschema"
#          with APEX lookup enrichments and PostgreSQL-specific features
# Status: ACTIVE - Integrated with PostgreSQL custom schema lookup tests
# ============================================================================

metadata:
  id: "postgresql-schema-simple-lookup-demo"
  name: "PostgreSQL Custom Schema Simple Lookup Demo"
  version: "2.0.0"
  description: "Data source configuration for PostgreSQL with custom schema 'myschema' via Testcontainers"
  type: "enrichment"
  author: "apex.demo.team@company.com"
  created: "2024-12-24"
  updated-date: "2025-09-20"
  tags: ["apex-demo", "lookup", "postgresql", "testcontainers", "custom-schema", "myschema"]

# PostgreSQL data source configuration with custom schema
data-sources:
  - name: "postgresql-myschema-database"
    type: "database"
    source-type: "postgresql"
    enabled: true
    description: "Customer master data from PostgreSQL custom schema 'myschema' via Testcontainers"

    connection:
      # PostgreSQL connection details (will be dynamically updated by test)
      database: "apex_schema_test"
      username: "apex_user"
      password: "apex_pass"
      host: "localhost"
      port: 5432
      # Custom schema specification
      schema: "myschema"

      # PostgreSQL-optimized connection pool configuration
      connection-pool:
        max-size: 10
        min-size: 2
        initial-size: 2
        connection-timeout: 30000
        idle-timeout: 600000
        max-lifetime: 1800000
        leak-detection-threshold: 60000
        connection-test-query: "SELECT 1"
        test-on-borrow: true
        test-while-idle: true
        validation-timeout: 5000

    # PostgreSQL-optimized caching configuration
    cache:
      enabled: true
      ttlSeconds: 1800  # 30 minutes cache for PostgreSQL
      maxSize: 5000
      eviction-policy: "LRU"
      statistics-enabled: true

    # PostgreSQL health check configuration
    healthCheck:
      enabled: true
      query: "SELECT 1"
      intervalSeconds: 60
      timeoutSeconds: 10

    # PostgreSQL query definitions using custom schema "myschema"
    queries:
      customerProfile: |
        SELECT
          customer_id,
          customer_name,
          customer_type,
          tier,
          region,
          status,
          created_date,
          last_updated,
          metadata,
          tags
        FROM customers
        WHERE customer_id = :customerId

      customerSummary: |
        SELECT
          customer_id,
          customer_name,
          customer_type,
          tier,
          region,
          status,
          EXTRACT(YEAR FROM created_date) as creation_year,
          CASE
            WHEN metadata->>'revenue' IS NOT NULL THEN (metadata->>'revenue')::BIGINT
            WHEN metadata->>'aum' IS NOT NULL THEN (metadata->>'aum')::BIGINT
            ELSE 0
          END as financial_value
        FROM customers
        WHERE customer_id = :customerId

    # Parameter definitions
    parameterNames:
      - "customerId"

# PostgreSQL enrichment rules using real database lookups in custom schema
enrichments:
  - id: "postgresql-myschema-simple-lookup-demo"
    name: "PostgreSQL Customer Profile Lookup (Custom Schema)"
    description: "Simple customer profile lookup using PostgreSQL custom schema 'myschema' via Testcontainers"
    type: "lookup-enrichment"
    enabled: true
    priority: 10

    # Condition: Only process if customerId is present
    condition: "#customerId != null && #customerId != ''"

    # PostgreSQL database lookup configuration with custom schema
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "postgresql-myschema-database"
        # Query uses schema from connection's currentSchema parameter
        query: "SELECT customer_name, customer_type, tier, region, status, created_date, metadata, tags FROM customers WHERE customer_id = :customerId"
        parameters:
          - field: "customerId"
            type: "string"

        # PostgreSQL-specific caching
        cache-enabled: true
        cache-ttl-seconds: 900  # 15 minutes for individual lookups

    # Field mappings for enrichment results (PostgreSQL returns lowercase column names)
    field-mappings:
      - source-field: "customer_name"
        target-field: "customerName"
        required: true
      - source-field: "customer_type"
        target-field: "customerType"
        required: true
      - source-field: "tier"
        target-field: "customerTier"
        required: true
      - source-field: "region"
        target-field: "customerRegion"
        required: true
      - source-field: "status"
        target-field: "customerStatus"
        required: true
      - source-field: "created_date"
        target-field: "customerCreatedDate"
        required: false
      - source-field: "metadata"
        target-field: "customerMetadata"
        required: false
      - source-field: "tags"
        target-field: "customerTags"
        required: false

  # Additional enrichment for testing PostgreSQL JSON features in custom schema
  - id: "postgresql-myschema-json-enrichment"
    name: "PostgreSQL JSON Metadata Enrichment (Custom Schema)"
    description: "Extract specific fields from PostgreSQL JSONB metadata column in custom schema 'myschema'"
    type: "lookup-enrichment"
    enabled: true
    priority: 20

    condition: "#customerId != null && #customerMetadata != null"

    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "postgresql-myschema-database"
        # Query uses schema from connection's currentSchema parameter
        query: |
          SELECT
            metadata->>'industry' as industry,
            metadata->>'employees' as employee_count,
            COALESCE(metadata->>'revenue', metadata->>'aum') as financial_value,
            array_to_string(tags, ',') as tag_list
          FROM customers
          WHERE customer_id = :customerId
        parameters:
          - field: "customerId"
            type: "string"

    field-mappings:
      - source-field: "industry"
        target-field: "customerIndustry"
        required: false
      - source-field: "employee_count"
        target-field: "customerEmployeeCount"
        required: false
        expression: "#value != null ? T(java.lang.Integer).parseInt(#value.toString()) : 0"
      - source-field: "financial_value"
        target-field: "customerFinancialValue"
        required: false
        expression: "#value != null ? T(java.lang.Long).parseLong(#value.toString()) : 0L"
      - source-field: "tag_list"
        target-field: "customerTagList"
        required: false

  # VIEW-based enrichment - demonstrates querying a PostgreSQL VIEW via YAML
  - id: "postgresql-myschema-view-enrichment"
    name: "PostgreSQL VIEW Lookup (Custom Schema)"
    description: "Lookup customer data from a PostgreSQL VIEW in custom schema 'myschema'"
    type: "lookup-enrichment"
    enabled: true
    priority: 30

    condition: "#customerId != null && #customerId != ''"

    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "database"
        data-source-ref: "postgresql-myschema-database"
        # Query the VIEW (not a table) - demonstrates APEX view support
        # Schema is set via connection's currentSchema parameter, no prefix needed
        query: |
          SELECT
            customer_name,
            customer_type,
            tier,
            industry,
            financial_value,
            tag_count
          FROM customer_summary_view
          WHERE customer_id = :customerId
        parameters:
          - field: "customerId"
            type: "string"

        cache-enabled: true
        cache-ttl-seconds: 900

    field-mappings:
      - source-field: "customer_name"
        target-field: "viewCustomerName"
        required: false
      - source-field: "customer_type"
        target-field: "viewCustomerType"
        required: false
      - source-field: "tier"
        target-field: "viewTier"
        required: false
      - source-field: "industry"
        target-field: "viewIndustry"
        required: false
      - source-field: "financial_value"
        target-field: "viewFinancialValue"
        required: false
      - source-field: "tag_count"
        target-field: "viewTagCount"
        required: false
