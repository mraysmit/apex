# ============================================================================
# SpEL failure when intermediate structure is missing - PROPERLY REPORTED
# ============================================================================
# Tests: testSpelFailureWhenStructureMissingIsReported
#
# BEHAVIOR:
# When using SpEL path like "#missing.nested.field", if the "missing" object
# does not exist in the input data, SpEL cannot create it automatically.
# The enrichment FAILS and the failure is PROPERLY REPORTED in the RuleResult.
#
# EXAMPLE:
# Input:  { "value": "TEST" }                    <- no "missing" key exists
# Target: "#missing.nested.field"
# Result: RuleResult.isSuccess() = false         <- failure is reported
#         enrichedData unchanged                 <- field not set
#
# WHY THIS HAPPENS:
# SpEL can navigate INTO existing structures and SET leaf values, but it
# cannot CREATE intermediate Map objects that don't exist.
#
# SOLUTION:
# Pre-create the nested structure before enrichment runs.
# See NestedTargetFieldEnrichmentTest-workaround.yaml for the solution.
# ============================================================================

metadata:
  id: "missing-structure-demo"
  name: "Missing Structure Failure Demonstration"
  version: "1.0.0"
  description: "Demonstrates that SpEL failure is properly reported when intermediate structure is missing"

enrichments:
  - id: "missing-structure-enrichment"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "value"
        target-field: "#missing.nested.field"

