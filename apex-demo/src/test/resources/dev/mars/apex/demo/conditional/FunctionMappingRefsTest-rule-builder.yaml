# ============================================================================
# External "Rule Builder" enrichment group
# ============================================================================
# Used by: FunctionMappingRefsTest.java (loaded via enrichment-refs)
# Purpose: Reusable enrichment group invoked only via function mapping
# Pattern: Markit converted YAML - imported like a Java import, never auto-executed
# ============================================================================

metadata:
  id: "rule-builder-translate"
  name: "Rule Builder - Translate Code"
  version: "1.0.0"
  type: "rule-config"

# Enrichments that the group references
enrichments:
  - id: "rb-translate-enrichment"
    type: "field-enrichment"
    field-mappings:
      - source-field: "constant"
        target-field: "translation_result"
        expression: "'TRANSLATED_' + #Translation_Type + '_' + #Input_Code"

# The enrichment group (Rule Builder)
enrichment-groups:
  - id: "translate-group"
    name: "Translate External to Internal Code"
    operator: AND
    stop-on-first-failure: true
    enrichment-ids: [ rb-translate-enrichment ]
