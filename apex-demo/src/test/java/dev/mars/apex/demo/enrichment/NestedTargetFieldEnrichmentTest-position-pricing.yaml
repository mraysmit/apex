# ============================================================================
# Enriching portfolio position pricing with calculated values
# ============================================================================
# Tests: testPositionPricingEnrichment
#
# USE CASE:
# Portfolio positions need market value calculations written into nested
# pricing structures. This demonstrates using SpEL expressions to calculate
# values and write them to deeply nested target fields.
#
# STRUCTURE BEING ENRICHED:
# position
#   └── pricing
#         ├── marketValue      <- quantity * price (local currency)
#         └── marketValueBase  <- quantity * price * fxRate (base currency)
#
# KEY POINTS:
# 1. source-field: "constant" indicates no source field - use expression only
# 2. expression: "#quantity * #price" calculates the value using SpEL
# 3. The calculated result is written to the nested target-field path
# 4. Multiple calculations can be done in a single enrichment
# 5. The position.pricing structure must already exist
#
# EXAMPLE CALCULATION:
# Input: quantity=1000, price=105.50, fxRate=1.08
# Result: marketValue=105500.0, marketValueBase=113940.0
# ============================================================================

metadata:
  id: "position-pricing"
  name: "Position Pricing Enrichment"
  version: "1.0.0"
  description: "Demonstrates enriching position pricing with calculated values"

enrichments:
  - id: "calculate-market-value"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "constant"
        expression: "#quantity * #price"
        target-field: "#position.pricing.marketValue"
      - source-field: "constant"
        expression: "#quantity * #price * #fxRate"
        target-field: "#position.pricing.marketValueBase"

