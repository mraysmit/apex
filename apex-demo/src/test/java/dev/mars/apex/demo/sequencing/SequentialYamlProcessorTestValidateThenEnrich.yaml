metadata:
  name: "Validate-Then-Enrich Test"
  type: "rule-config"
  description: "Demonstrates validate-then-enrich pattern with rules before enrichments"

rules:
  - id: "pre-validation"
    name: "Pre-Validation Check"
    condition: "#customerId != null"
    message: "Customer ID is present"
    priority: 200
    severity: "INFO"

enrichments:
  - id: "post-enrichment"
    name: "Post-Validation Enrichment"
    type: "lookup-enrichment"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "inline"
        key-field: "customerId"
        data:
          - customerId: "CUST001"
            customerName: "John Doe"
    field-mappings:
      - source-field: "customerName"
        target-field: "customerData"

