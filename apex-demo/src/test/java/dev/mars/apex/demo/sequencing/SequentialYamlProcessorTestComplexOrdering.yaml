metadata:
  name: "Complex Ordering Test"
  type: "rule-config"
  processing-mode: "sequential"
  description: "Tests complex section ordering with multiple section types"

categories:
  - id: "validation"
    name: "Validation Rules"

data-sources:
  - name: "customer-db"
    type: "memory"
    data:
      - customerId: "CUST001"
        customerName: "John Doe"

transformations:
  - id: "data-transform"
    name: "Data Transformation"
    type: "field-transformation"
    source-field: "customerId"
    target-field: "transformedCustomerId"

enrichments:
  - id: "enrich-customer"
    name: "Customer Data Enrichment"
    type: "lookup-enrichment"
    lookup-config:
      lookup-key: "#customerId"
      lookup-dataset:
        type: "inline"
        key-field: "customerId"
        data:
          - customerId: "CUST001"
            customerName: "John Doe"
    field-mappings:
      - source-field: "customerName"
        target-field: "customerData"

rules:
  - id: "validate-customer"
    name: "Customer Data Validation"
    condition: "#customerData != null"
    message: "Customer data is valid"
    severity: "INFO"
    priority: 1

rule-groups:
  - id: "customer-validation-group"
    name: "Customer Validation Group"
    operator: "AND"
    rule-ids:
      - "validate-customer"

