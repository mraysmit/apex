metadata:
  name: "Retry Delay Test"
  description: "Tests that retry-delay-ms is respected between retry attempts"
  version: "1.0"

data-sources:
  - name: "test-source"
    type: "file-system"
    enabled: true
    connection:
      base-path: "./target/demo/etl/execution-tests"
      file-pattern: "sample.csv"
    operations:
      getData: "SELECT * FROM csv"

data-sinks:
  - name: "test-sink"
    type: "database"
    source-type: "h2"
    enabled: true
    connection:
      database: "./target/demo/etl/execution-tests/output/retry_delay_db"
      username: "sa"
      password: ""
    schema:
      auto-create: true
      init-script: |
        CREATE TABLE IF NOT EXISTS test_data (
          id INTEGER PRIMARY KEY,
          name VARCHAR(255),
          val INTEGER
        );
    operations:
      writeData: "INSERT INTO test_data (id, name, val) VALUES (:column_1, :column_2, :column_3)"

pipeline:
  name: "retry-delay-pipeline"
  description: "Pipeline that tests retry delay timing"
  
  steps:
    - name: "step-1-extract"
      type: "extract"
      source: "test-source"
      operation: "getData"
      description: "Extract data from CSV"
    
    - name: "step-2-load-to-fail"
      type: "load"
      sink: "nonexistent-sink"
      operation: "writeData"
      description: "Load to nonexistent sink - will fail and retry with delay"
  
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
    max-retries: 2
    retry-delay-ms: 1000

