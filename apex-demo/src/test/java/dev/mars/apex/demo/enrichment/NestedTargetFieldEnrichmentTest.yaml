# ============================================================================
# Enriching deeply nested OTC trade leg structures
# ============================================================================
# Tests: testOtcLegEnrichmentWithExistingStructure
#
# USE CASE:
# OTC (Over-The-Counter) derivatives like Interest Rate Swaps have complex
# nested structures with multiple legs. Each leg has properties like rate type,
# notional amount, payment frequency, etc. This demonstrates how to enrich
# a specific field deep within that structure.
#
# STRUCTURE BEING ENRICHED:
# trade
#   └── otcTrade
#         └── otcLeg[0]                    <- first leg of the swap
#               └── legInterestRateType    <- field being set to "FIXED"
#
# KEY POINTS:
# 1. The "#" prefix enables SpEL path navigation into nested structures
# 2. Array notation [0] accesses the first element of the otcLeg list
# 3. The nested structure (trade.otcTrade.otcLeg[0]) must already exist
# 4. The source-field "rateTypeCode" value is copied to the target path
# ============================================================================

metadata:
  id: "otc-leg-enrichment"
  name: "OTC Leg Interest Rate Enrichment"
  version: "1.0.0"
  description: "Demonstrates enriching deeply nested OTC trade leg structures"

enrichments:
  - id: "set-leg-rate-type"
    type: "field-enrichment"
    condition: "#legIndex != null"
    field-mappings:
      - source-field: "rateTypeCode"
        target-field: "#trade.otcTrade.otcLeg[0].legInterestRateType"

