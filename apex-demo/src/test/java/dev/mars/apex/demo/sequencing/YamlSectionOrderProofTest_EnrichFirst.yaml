metadata:
  name: "PROOF: Enrichments BEFORE Rules"
  description: "Demonstrates that enrichments execute FIRST when they appear before rules in YAML"
  version: "1.0.0"

data-sources:
  - name: "test-data"
    type: "cache"

# SECTION ORDER: enrichments BEFORE rules
# Expected execution: enrichments execute FIRST, then rules

enrichments:
  - id: "calculate-risk-score"
    name: "Calculate Risk Score"
    type: "calculation-enrichment"
    condition: "#customerId != null"
    calculation-config:
      expression: "0.5"
      result-field: "riskScore"

rules:
  - id: "validate-risk-score"
    name: "Validate Risk Score"
    condition: "#riskScore != null && #riskScore < 0.8"
    message: "Risk score is acceptable"
    severity: "INFO"
    priority: 100

