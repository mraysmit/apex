# DESIGN FLAW DEMONSTRATION: Same YAML, Different Results
# This YAML file will produce DIFFERENT results depending on which processor is used
#
# Developer Intent: Process enrichments FIRST, then rules
# YAML Structure: enrichments section appears BEFORE rules section

metadata:
  id: "processor-comparison-demo"
  name: "Processor Comparison Demo"
  version: "1.0.0"
  description: "Proves different processors produce different results from same YAML"
  type: "rule-config"
  author: "apex.demo.team@company.com"
  created-date: "2025-10-30"
  tags: ["design-flaw", "processor-comparison", "demo"]

# DEVELOPER INTENT: Calculate risk score FIRST
enrichments:
  - id: "calculate-risk-score"
    description: "Calculate risk score based on transaction amount"
    type: "calculation-enrichment"
    target-field: "riskScore"
    field-mappings:
      - source-field: "amount"
        target-field: "riskScore"
        calculation: "#amount / 100000.0"  # Risk score from 0.0 to 1.0+

# DEVELOPER INTENT: Validate enriched data SECOND
rules:
  - id: "validate-risk-score"
    name: "validate-risk-score"
    description: "Validate that risk score was calculated"
    condition: "#riskScore != null && #riskScore >= 0"
    message: "Risk score validation passed"

# EXPECTED BEHAVIOR (if YAML order was respected):
# 1. Calculate riskScore = 50000 / 100000 = 0.5
# 2. Validate riskScore exists and >= 0 → PASS

# ACTUAL BEHAVIOR:
# YamlEnrichmentProcessor: Rules FIRST, Enrichments SECOND
#   - Rules try to validate fields that don't exist yet → FAIL
#   - Then enrichments calculate the fields
#   - Final result: enriched data but failed rule validation
#
# RulesEngine.evaluate(): Enrichments FIRST, Rules SECOND
#   - Enrichments calculate fields first
#   - Rules validate existing fields → PASS
#   - Final result: enriched data with successful rule validation
#
# SAME YAML → DIFFERENT RESULTS → DESIGN FLAW PROVEN
