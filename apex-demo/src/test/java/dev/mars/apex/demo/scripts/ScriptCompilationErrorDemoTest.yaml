metadata:
  name: "Script Compilation Error Demo"
  type: "rule-config"
  version: "1.0"
  description: >
    Demonstrates error behaviour when a Groovy script has a syntax error
    and cannot be compiled.  The enrichment should fail with a
    ScriptCompilationException.

runtime-scripts:
  enabled: true
  locations:
    - "classpath:dev/mars/apex/demo/scripts/groovy"
  engine: "groovy"
  polling-interval-ms: 0
  execution-timeout-ms: 5000

enrichments:
  - id: "call-broken-script"
    name: "Call Script With Syntax Error"
    type: "calculation-enrichment"
    description: "References a script that has an unclosed brace"
    calculation-config:
      expression: "#script('ScriptCompilationErrorDemoTest-broken-syntax', #root)"
      result-field: "result"
    field-mappings:
      - source-field: "result"
        target-field: "result"

rules:
  - id: "placeholder-rule"
    name: "Placeholder"
    condition: "true"
    message: "If this fires the compilation error was not detected"
    severity: "INFO"
