# ============================================================================
# APEX Trade Validation Rules for BasicStageConfigurationTest
# ============================================================================
# Validation rules for basic trade data processing scenario
# Used to demonstrate stage-based scenario execution
# ============================================================================

metadata:
  id: "trade-validation-rules"
  name: "Trade Validation Rules"
  version: "1.0.0"
  description: "Basic validation rules for trade data processing"
  type: "rule-config"
  author: "APEX Demo"

# Trade validation rules
# NOTE: Validation rules should return TRUE when validation SUCCEEDS (data is valid)
# When rules don't match (return false), it indicates validation failure
rules:
  - id: "trade-id-required"
    name: "Trade ID Required"
    description: "Validate that trade ID is present and not empty"
    condition: "['tradeId'] != null && !['tradeId'].toString().isEmpty()"
    message: "Trade ID is valid"
    severity: "ERROR"
    enabled: true

  - id: "instrument-type-valid"
    name: "Instrument Type Valid"
    description: "Validate that instrument type is one of the allowed values"
    condition: "['instrumentType'] != null && (['instrumentType'] == 'EQUITY' || ['instrumentType'] == 'BOND' || ['instrumentType'] == 'OPTION' || ['instrumentType'] == 'FUTURE')"
    message: "Instrument type is valid"
    severity: "ERROR"
    enabled: true

  - id: "quantity-positive"
    name: "Quantity Positive"
    description: "Validate that quantity is positive"
    condition: "['quantity'] != null && T(java.lang.Double).parseDouble(['quantity'].toString()) > 0"
    message: "Quantity is valid"
    severity: "ERROR"
    enabled: true

  - id: "price-positive"
    name: "Price Positive"
    description: "Validate that price is positive"
    condition: "['price'] != null && T(java.lang.Double).parseDouble(['price'].toString()) > 0"
    message: "Price is valid"
    severity: "ERROR"
    enabled: true

  - id: "currency-valid"
    name: "Currency Valid"
    description: "Validate that currency is a valid 3-character code"
    condition: "['currency'] != null && ['currency'].toString().length() == 3"
    message: "Currency is valid"
    severity: "WARNING"
    enabled: true
