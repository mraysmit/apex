name: "Test 5: Numbered Suffixes Basic"
description: "Tests that enrichments-1, enrichments-2, enrichments-3 are merged and executed in document order"

# First batch of enrichments
enrichments-1:
  - id: "batch1-item1"
    name: "Batch 1 Item 1"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('batch1-item1', 'value1')"
      result-field: "value1"
    field-mappings:
      - source-field: "value1"
        target-field: "value1"
    enabled: true

  - id: "batch1-item2"
    name: "Batch 1 Item 2"
    type: "calculation-enrichment"
    calculation-config:
