metadata:
  name: "Script Returns Null Demo"
  type: "rule-config"
  version: "1.0"
  description: >
    Demonstrates behaviour when a script returns null.  This is not
    necessarily an error — the enrichment succeeds but the target field
    is set to null.

runtime-scripts:
  enabled: true
  locations:
    - "classpath:dev/mars/apex/demo/scripts/groovy"
  engine: "groovy"
  polling-interval-ms: 0
  execution-timeout-ms: 5000

enrichments:
  - id: "call-null-script"
    name: "Call Null-Returning Script"
    type: "calculation-enrichment"
    description: "Calls a script that intentionally returns null"
    calculation-config:
      expression: "#script('ScriptRuntimeExecutionErrorDemoTest-returns-null', #root)"
      result-field: "result"
    field-mappings:
      - source-field: "result"
        target-field: "result"

rules:
  - id: "check-null"
    name: "Check Null Result"
    condition: "result == null"
    message: "Script returned null — field is unset"
    severity: "WARNING"
