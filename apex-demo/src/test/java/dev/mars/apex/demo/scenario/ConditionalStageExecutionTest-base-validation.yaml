# Base Validation Rules
# Used by ConditionalStageExecutionTest to demonstrate conditional stage execution
# This stage always executes (no condition) and provides base validation for all trades

metadata:
  id: "base-validation-rules"
  name: "Base Trade Validation"
  description: "Common validation rules for all OTC options trades"
  version: "1.0.0"
  author: "Mark Andrew Ray-Smith Cityline Ltd"
  created: "2024-11-13"

type: "rule-config"

rules:
  - id: "product-type-required"
    name: "Product Type Required"
    description: "Product type must be specified"
    condition: "#data['productType'] != null && #data['productType'].length() > 0"
    message: "Product type is required for all trades"
    enabled: true
    priority: 1

  - id: "notional-amount-positive"
    name: "Notional Amount Positive"
    description: "Notional amount must be positive"
    condition: "#data['notionalAmount'] != null && #data['notionalAmount'] > 0"
    message: "Notional amount must be greater than zero"
    enabled: true
    priority: 2

  - id: "region-required"
    name: "Region Required"
    description: "Trading region must be specified"
    condition: "#data['region'] != null && #data['region'].length() > 0"
    message: "Trading region is required"
    enabled: true
    priority: 3

  - id: "trade-date-required"
    name: "Trade Date Required"
    description: "Trade date must be specified"
    condition: "#data['tradeDate'] != null"
    message: "Trade date is required"
    enabled: true
    priority: 4

