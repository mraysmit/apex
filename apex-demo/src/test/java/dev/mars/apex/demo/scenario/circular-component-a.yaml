# Circular Component A
# Component that references Component B (creates circular dependency)

metadata:
  id: "circular-component-a"
  name: "Circular Component A"
  version: "1.0.0"
  description: "Component A that references Component B (circular dependency test)"
  type: "component"
  business-domain: "testing"
  owner: "APEX Demo Team"
  criticality: "low"
  tags:
    - testing
    - circular
    - error-case

# Reference to Component B (which references back to A)
component-refs:
  - file: "circular-component-b.yaml"
    execution-order: 1
    failure-policy: "terminate"

