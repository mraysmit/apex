# EMEA Compliance Validation Rules
# Used by ConditionalStageExecutionTest to demonstrate conditional stage execution
# This stage only executes when condition: "#'region'] == 'EMEA'" is true

metadata:
  id: "emea-compliance-rules"
  name: "EMEA Compliance Validation"
  description: "EMEA-specific regulatory compliance checks for OTC options"
  version: "1.0.0"
  author: "Mark Andrew Ray-Smith Cityline Ltd"
  created: "2024-11-13"

type: "rule-config"

rules:
  - id: "emea-mifid-check"
    name: "MiFID II Compliance Check"
    description: "Verify trade complies with MiFID II regulations"
    condition: "#'productType'] == 'OTC_OPTION'"
    message: "Trade must comply with MiFID II regulations for OTC derivatives"
    enabled: true
    priority: 1

  - id: "emea-emir-reporting"
    name: "EMIR Reporting Requirement"
    description: "Ensure trade meets EMIR reporting requirements"
    condition: "#'notionalAmount'] > 500000"
    message: "High-value OTC trades require EMIR reporting"
    enabled: true
    priority: 2

  - id: "emea-counterparty-check"
    name: "EMEA Counterparty Validation"
    description: "Validate counterparty is authorized for EMEA trades"
    condition: "#'counterparty'] != null && #'counterparty'].length() > 0"
    message: "Counterparty must be specified for EMEA trades"
    enabled: true
    priority: 3

