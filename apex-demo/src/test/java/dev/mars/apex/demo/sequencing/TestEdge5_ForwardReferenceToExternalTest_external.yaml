name: "External Enrichments for Edge Case Test 5"
description: "External file with enrichment referenced by main file's group"

enrichments:
  - id: "external-1"
    type: "calculation-enrichment"
    calculation-config:
      expression: "'value-from-external'"
      result-field: "externalResult"
    field-mappings:
      - source-field: "externalResult"
        target-field: "externalResult"
    enabled: true

