# ============================================================================
# Setting a literal/constant value to a deeply nested field
# ============================================================================
# Tests: testLiteralValueToNestedOtcLegField
#
# USE CASE:
# Sometimes you need to set a fixed/constant value to a deeply nested field,
# rather than copying a value from another field in the input data.
#
# HOW IT WORKS:
# - source-field: "constant"     <- special keyword indicating no source field
# - expression: "'FIXED'"        <- SpEL expression that evaluates to the literal string "FIXED"
# - target-field: "#trade.otcTrade.otcLeg[0].legInterestRateType"  <- deeply nested path
#
# The expression is evaluated and the result is written to the target path.
# Note: The nested structure (trade.otcTrade.otcLeg[0]) must already exist.
#
# EXAMPLES OF EXPRESSIONS:
# - "'FIXED'"                    <- literal string
# - "100"                        <- literal number
# - "'USD'"                      <- literal currency code
# - "T(java.time.LocalDate).now()" <- current date
# - "#quantity * #price"         <- calculated value from other fields
# ============================================================================

metadata:
  id: nested-literal-enrichment-test
  name: Literal Value to Nested Field Enrichment
  description: Demonstrates setting a literal constant value to a deeply nested target field

enrichments:
  - id: set-literal-rate-type
    type: field-enrichment
    description: Set a literal value directly to a nested OTC leg field
    field-mappings:
      - source-field: "constant"
        target-field: "#trade.otcTrade.otcLeg[0].legInterestRateType"
        expression: "'FIXED'"

