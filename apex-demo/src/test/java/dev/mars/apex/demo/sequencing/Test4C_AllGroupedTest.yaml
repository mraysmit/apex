name: "Test 4C - All Grouped Enrichments"
description: "Proves when ALL enrichments are in groups, NONE execute at definition position"

enrichments:
  - id: "grouped-1"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('grouped-1', 'value1')"
      result-field: "field1"
    field-mappings:
      - source-field: "field1"
        target-field: "field1"
    enabled: true

  - id: "grouped-2"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('grouped-2', 'value2')"
      result-field: "field2"
    field-mappings:
      - source-field: "field2"
        target-field: "field2"
    enabled: true

  - id: "grouped-3"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('grouped-3', 'value3')"
      result-field: "field3"
    field-mappings:
      - source-field: "field3"
        target-field: "field3"
    enabled: true

  - id: "grouped-4"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('grouped-4', 'value4')"
      result-field: "field4"
    field-mappings:
      - source-field: "field4"
        target-field: "field4"
    enabled: true

# ALL enrichments are in groups - none should execute at definition position
enrichment-groups:
  - id: "group-A"
    name: "Group A"
    operator: "AND"
    enrichment-ids:
      - "grouped-1"
      - "grouped-2"

  - id: "group-B"
    name: "Group B"
    operator: "AND"
    enrichment-ids:
      - "grouped-3"
      - "grouped-4"

