metadata:
  name: "Script Too Few Arguments Demo"
  type: "rule-config"
  version: "1.0"
  description: >
    Demonstrates error when #script() is called with only 1 argument
    (the script ID) instead of the required minimum of 2.

runtime-scripts:
  enabled: true
  locations:
    - "classpath:dev/mars/apex/demo/scripts/groovy"
  engine: "groovy"
  polling-interval-ms: 0
  execution-timeout-ms: 5000

enrichments:
  - id: "call-with-too-few-args"
    name: "Call With Too Few Arguments"
    type: "calculation-enrichment"
    description: "#script() called with only the script ID — missing payload"
    calculation-config:
      expression: "#script('RuntimeScriptDemoTest-risk-score')"
      result-field: "result"
    field-mappings:
      - source-field: "result"
        target-field: "result"

rules:
  - id: "placeholder-rule"
    name: "Placeholder"
    condition: "true"
    message: "If this fires, the argument error was not detected"
    severity: "INFO"
