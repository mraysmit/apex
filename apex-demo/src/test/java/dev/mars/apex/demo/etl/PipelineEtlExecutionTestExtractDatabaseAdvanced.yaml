# ============================================================================
# APEX ETL Pipeline Configuration - Advanced Database Extract Test
# ============================================================================
#
# OVERVIEW:
# This configuration tests advanced database extraction features including
# complex queries, joins, aggregations, and parameterized queries.
#
# BUSINESS SCENARIO:
# Extract customer order analytics from relational database with joins
# and aggregations to validate advanced database extraction capabilities.
#
# TECHNICAL FEATURES:
# ✓ Database data source with H2
# ✓ Complex SQL queries with JOINs
# ✓ Aggregation queries (COUNT, SUM, AVG)
# ✓ Parameterized queries
# ✓ Multiple extraction operations
#
# PIPELINE ARCHITECTURE:
# ┌─────────────────────────────────────────────────────────────┐
# │              Advanced Database Extract Pipeline             │
# ├─────────────────────────────────────────────────────────────┤
# │                                                             │
# │  Step 1: Extract Customer Order Summary                    │
# │  ├─ Source: advanced-db-source                             │
# │  ├─ Operation: getCustomerOrderSummary                     │
# │  └─ Output: Customer order analytics with aggregations     │
# │                                                             │
# └─────────────────────────────────────────────────────────────┘
#
# ============================================================================

metadata:
  id: "advanced-database-extract-test-pipeline"
  name: "Advanced Database Extract Test Pipeline"
  type: "pipeline-config"
  version: "1.0.0"
  description: "Test pipeline for advanced database extraction with joins and aggregations"
  author: "APEX Test Suite"
  created-date: "2025-10-27"

# Pipeline definition
pipeline:
  name: "advanced-database-extract-pipeline"
  description: "Extract customer order analytics from database"
  
  execution:
    mode: "sequential"
    error-handling: "stop-on-error"
    max-retries: 0
    retry-delay-ms: 0
  
  # Pipeline steps
  steps:
    - name: "extract-customer-order-summary"
      type: "extract"
      source: "advanced-db-source"
      operation: "getCustomerOrderSummary"
      description: "Extract customer order summary with aggregations"

# Input data sources
data-sources:
  - name: "advanced-db-source"
    type: "database"
    source-type: "h2"
    enabled: true
    description: "H2 database with customer and order data"

    connection:
      database: "./target/test/etl/database/advanced_test_db"
      username: "sa"
      password: ""

    queries:
      # Complex query with JOIN and aggregations
      getCustomerOrderSummary: |
        SELECT 
          c.id as customer_id,
          c.name as customer_name,
          c.email as customer_email,
          c.status as customer_status,
          COUNT(o.id) as total_orders,
          COALESCE(SUM(o.total_amount), 0) as total_spent,
          COALESCE(AVG(o.total_amount), 0) as avg_order_value,
          MAX(o.order_date) as last_order_date
        FROM customers c
        LEFT JOIN orders o ON c.id = o.customer_id
        GROUP BY c.id, c.name, c.email, c.status
        ORDER BY total_spent DESC
      
      # Query for active customers only
      getActiveCustomerSummary: |
        SELECT 
          c.id as customer_id,
          c.name as customer_name,
          COUNT(o.id) as total_orders,
          SUM(o.total_amount) as total_spent
        FROM customers c
        LEFT JOIN orders o ON c.id = o.customer_id
        WHERE c.status = 'ACTIVE'
        GROUP BY c.id, c.name
        HAVING COUNT(o.id) > 0
        ORDER BY total_spent DESC
      
      # Query for order details with product information
      getOrderDetails: |
        SELECT 
          o.id as order_id,
          o.order_date,
          o.total_amount,
          o.status as order_status,
          c.name as customer_name,
          c.email as customer_email,
          oi.product_id,
          oi.product_name,
          oi.quantity,
          oi.unit_price,
          oi.subtotal
        FROM orders o
        INNER JOIN customers c ON o.customer_id = c.id
        INNER JOIN order_items oi ON o.id = oi.order_id
        ORDER BY o.order_date DESC, o.id, oi.product_id
      
      # Aggregation query for product sales
      getProductSales: |
        SELECT 
          oi.product_id,
          oi.product_name,
          COUNT(DISTINCT o.id) as order_count,
          SUM(oi.quantity) as total_quantity_sold,
          SUM(oi.subtotal) as total_revenue,
          AVG(oi.unit_price) as avg_price
        FROM order_items oi
        INNER JOIN orders o ON oi.order_id = o.id
        WHERE o.status != 'CANCELLED'
        GROUP BY oi.product_id, oi.product_name
        ORDER BY total_revenue DESC

