metadata:
  name: "Script Method Not Found Error Demo"
  type: "rule-config"
  version: "1.0"
  description: >
    Demonstrates error when #script() names a function that does not
    exist in the target script.

runtime-scripts:
  enabled: true
  locations:
    - "classpath:dev/mars/apex/demo/scripts/groovy"
  engine: "groovy"
  polling-interval-ms: 0
  execution-timeout-ms: 5000

enrichments:
  - id: "call-nonexistent-method"
    name: "Call Non-Existent Method"
    type: "calculation-enrichment"
    description: "Calls a function name that is not defined in the script"
    calculation-config:
      expression: "#script('ScriptMethodDispatchErrorDemoTest-dispatch', 'noSuchFunction', #root)"
      result-field: "result"
    field-mappings:
      - source-field: "result"
        target-field: "result"

rules:
  - id: "placeholder-rule"
    name: "Placeholder"
    condition: "true"
    message: "If this fires, the method-not-found error was not detected"
    severity: "INFO"
