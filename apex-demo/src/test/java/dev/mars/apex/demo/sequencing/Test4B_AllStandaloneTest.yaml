name: "Test 4B - All Standalone Enrichments"
description: "Proves when NO groups exist, ALL enrichments execute at their definition positions"

enrichments:
  - id: "standalone-1"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('standalone-1', 'value1')"
      result-field: "field1"
    field-mappings:
      - source-field: "field1"
        target-field: "field1"
    enabled: true

