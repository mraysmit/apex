name: "Test 1: enrichment-refs Position Guarantee"
description: "Proves that enrichment-refs executes at EXACT reference position in YAML document"

# Position 1: Inline enrichment BEFORE enrichment-refs
enrichments:
  - id: "inline-before"
    type: "calculation-enrichment"
    calculation-config:
      expression: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('inline-before', 'value-before')"
      result-field: "valueBefore"
    field-mappings:
      - source-field: "valueBefore"
        target-field: "valueBefore"

# Position 2: Reference to external enrichments
# MUST execute at THIS EXACT POSITION
enrichment-refs:
  - name: "external-enrichments"
    source: "src/test/java/dev/mars/apex/demo/sequencing/order_guarantee/Test1_EnrichmentRefsPositionTest-external.yaml"

# Position 3: Rule AFTER enrichment-refs (to verify order)
rules:
  - id: "inline-after"
    name: "Inline After Rule"
    condition: "T(dev.mars.apex.demo.sequencing.ExecutionTracker).recordAndReturn('inline-after', false)"
    message: "This rule records execution order"
    severity: "INFO"

