# APEX ETL Pipeline - Invalid Execution Mode Test
# Tests that invalid execution mode values default to sequential behavior

metadata:
  id: "pipeline-execution-invalid-mode-test"
  name: "Invalid Execution Mode Test"
  version: "1.0.0"
  description: "Test handling of invalid execution mode"
  type: "pipeline-config"

data-sources:
  - name: "test-source"
    type: "file-system"
    enabled: true
    connection:
      base-path: "./target/demo/etl/execution-tests"
      file-pattern: "sample.csv"
    operations:
      getData: "SELECT * FROM csv"

data-sinks:
  - name: "test-sink"
    type: "database"
    source-type: "h2"
    enabled: true
    connection:
      database: "./target/demo/etl/execution-tests/output/invalid_mode_db"
      username: "sa"
      password: ""
    schema:
      auto-create: true
      init-script: |
        CREATE TABLE IF NOT EXISTS test_data (
          id INTEGER PRIMARY KEY,
          name VARCHAR(255),
          val INTEGER
        );
    operations:
      writeData: "INSERT INTO test_data (id, name, val) VALUES (:column_1, :column_2, :column_3)"

pipeline:
  name: "invalid-mode-pipeline"
  description: "Pipeline with invalid execution mode (should default to sequential)"
  
  steps:
    - name: "step-1-extract"
      type: "extract"
      source: "test-source"
      operation: "getData"
      description: "Extract data from CSV"
    
    - name: "step-2-load"
      type: "load"
      sink: "test-sink"
      operation: "writeData"
      description: "Load data to database"
  
  execution:
    mode: "invalid-mode-value"
    error-handling: "stop-on-error"
    max-retries: 0
    retry-delay-ms: 0

