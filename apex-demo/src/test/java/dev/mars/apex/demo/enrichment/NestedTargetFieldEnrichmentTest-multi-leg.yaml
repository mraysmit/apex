# ============================================================================
# Enriching multiple trade legs in a single pipeline pass
# ============================================================================
# Tests: testMultipleLegEnrichments
#
# USE CASE:
# Interest Rate Swaps and other multi-leg derivatives have a "pay leg" and
# a "receive leg". Each leg needs to be enriched with its own rate and type.
# This demonstrates enriching multiple array elements in a single pass.
#
# STRUCTURE BEING ENRICHED:
# trade
#   └── legs[0]          <- pay leg
#   │     ├── rate       <- set to 0.025 (2.5% fixed rate)
#   │     └── legType    <- set to "FIXED"
#   └── legs[1]          <- receive leg
#         ├── rate       <- set to 0.0 (floating, rate determined later)
#         └── legType    <- set to "FLOAT"
#
# KEY POINTS:
# 1. Two separate enrichments target different array indices [0] and [1]
# 2. Each enrichment can have multiple field-mappings
# 3. The legs list must already exist with at least 2 elements
# 4. Existing fields in each leg (like legId) are preserved
# ============================================================================

metadata:
  id: "multi-leg-enrichment"
  name: "Multiple Leg Enrichment"
  version: "1.0.0"
  description: "Demonstrates enriching multiple trade legs in a single pass"

enrichments:
  - id: "enrich-leg-0"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "payLegRate"
        target-field: "#trade.legs[0].rate"
      - source-field: "payLegType"
        target-field: "#trade.legs[0].legType"
  - id: "enrich-leg-1"
    type: "field-enrichment"
    condition: "true"
    field-mappings:
      - source-field: "receiveLegRate"
        target-field: "#trade.legs[1].rate"
      - source-field: "receiveLegType"
        target-field: "#trade.legs[1].legType"

