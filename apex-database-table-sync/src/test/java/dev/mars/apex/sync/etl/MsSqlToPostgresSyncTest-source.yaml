metadata:
  id: "mssql-legacy-source"
  name: "mssql-legacy-source"
  type: "external-data-config"
  author: "Integration Team"
  version: "1.0"

data-sources:
  - name: "legacy-sqlserver"
    type: "database"
    source-type: "h2"
    connection:
      # Hardcoded for test because DataSourceResolver doesn't support resolution in v2.0
      url: "jdbc:h2:mem:mssql_test;MODE=MSSQLServer"
      username: "sa"
      password: "pass"
    queries:
      extractCustomersBatch: |
        SELECT customer_id, name, status, email 
        FROM dbo.Customers 
