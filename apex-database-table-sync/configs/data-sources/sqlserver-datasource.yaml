# SQL Server Data Source Configuration
# Connection settings and extraction queries for SQL Server source database
metadata:
  id: "sqlserver-datasource"
  name: "sqlserver-datasource"
  version: "1.0"
  type: "external-data-config"
  author: "APEX Database Sync Module"
  description: "SQL Server database connection and extraction queries"

data-sources:
  - name: "sqlserver-source"
    type: "database"
    source-type: "sqlserver"
    connection:
      driver: "${SQLSERVER_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}"
      url: "${SQLSERVER_URL:jdbc:sqlserver://localhost:1433;databaseName=SourceDB;encrypt=true;trustServerCertificate=true}"
      username: "${SQLSERVER_USERNAME:sa}"
      password: "${SQLSERVER_PASSWORD:YourPassword123}"
      connectionPool:
        initialSize: 2
        maxSize: 10
        maxIdleTime: 300000
        connectionTimeout: 30000
        validationTimeout: 5000
    queries:
      extractCustomers: "SELECT customer_id, customer_name, email, phone, status FROM dbo.Customers"
      extractProducts: "SELECT product_id, product_name, category, unit_price, status FROM dbo.Products"
      extractOrders: "SELECT order_id, customer_id, order_date, total_amount, currency, status FROM dbo.Orders"
      extractOrderItems: "SELECT item_id, order_id, product_id, quantity, unit_price, discount FROM dbo.OrderItems"
      extractAuditLog: "SELECT log_id, table_name, record_id, action, action_date, user_id, details FROM dbo.AuditLog"
