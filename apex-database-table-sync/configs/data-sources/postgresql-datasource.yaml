# PostgreSQL Data Source Configuration
# Connection settings and load queries for PostgreSQL target database
metadata:
  id: "postgresql-datasource"
  name: "postgresql-datasource"
  version: "1.0"
  type: "external-data-config"
  author: "APEX Database Sync Module"
  description: "PostgreSQL database connection and load queries"

data-sources:
  - name: "postgresql-target"
    type: "database"
    source-type: "postgresql"
    connection:
      driver: "${POSTGRES_DRIVER:org.postgresql.Driver}"
      url: "${POSTGRES_URL:jdbc:postgresql://localhost:5432/TargetDB}"
      username: "${POSTGRES_USERNAME:postgres}"
      password: "${POSTGRES_PASSWORD:postgres}"
      connectionPool:
        initialSize: 2
        maxSize: 10
        maxIdleTime: 300000
        connectionTimeout: 30000
        validationTimeout: 5000
    queries:
      upsertCustomer: |
        INSERT INTO customers (customer_id, customer_name, email, phone, status)
        VALUES (:customer_id, :customer_name, :email, :phone, :status)
        ON CONFLICT (customer_id) DO UPDATE SET
          customer_name = EXCLUDED.customer_name,
          email = EXCLUDED.email,
          phone = EXCLUDED.phone,
          status = EXCLUDED.status
      upsertProduct: |
        INSERT INTO products (product_id, product_name, category, unit_price, status)
        VALUES (:product_id, :product_name, :category, :unit_price, :status)
        ON CONFLICT (product_id) DO UPDATE SET
          product_name = EXCLUDED.product_name,
          category = EXCLUDED.category,
          unit_price = EXCLUDED.unit_price,
          status = EXCLUDED.status
      upsertOrder: |
        INSERT INTO orders (order_id, customer_id, order_date, total_amount, currency, status)
        VALUES (:order_id, :customer_id, :order_date, :total_amount, :currency, :status)
        ON CONFLICT (order_id) DO UPDATE SET
          customer_id = EXCLUDED.customer_id,
          order_date = EXCLUDED.order_date,
          total_amount = EXCLUDED.total_amount,
          currency = EXCLUDED.currency,
          status = EXCLUDED.status
      upsertOrderItem: |
        INSERT INTO order_items (item_id, order_id, product_id, quantity, unit_price, discount)
        VALUES (:item_id, :order_id, :product_id, :quantity, :unit_price, :discount)
        ON CONFLICT (item_id) DO UPDATE SET
          order_id = EXCLUDED.order_id,
          product_id = EXCLUDED.product_id,
          quantity = EXCLUDED.quantity,
          unit_price = EXCLUDED.unit_price,
          discount = EXCLUDED.discount
      insertAuditLog: |
        INSERT INTO audit_log (log_id, table_name, record_id, action, action_date, user_id, details)
        VALUES (:log_id, :table_name, :record_id, :action, :action_date, :user_id, :details)
        ON CONFLICT (log_id) DO UPDATE SET
          table_name = EXCLUDED.table_name,
          record_id = EXCLUDED.record_id,
          action = EXCLUDED.action,
          action_date = EXCLUDED.action_date,
          user_id = EXCLUDED.user_id,
          details = EXCLUDED.details
