# SQL Server Extraction Queries - Simple Example
metadata:
  name: "sqlserver-queries-simple"
  version: "1.0"
  type: "query-config"
  description: "Simple SQL Server extraction queries"

dataSourceRefs:
  - name: "sqlserver-source"
    source: "data-sources/sqlserver-datasource.yaml"
    enabled: true

queries:
  - name: "extractCustomers"
    dataSourceRef: "sqlserver-source"
    sql: |
      SELECT customer_id, customer_name, email, phone, status
      FROM dbo.Customers

  - name: "extractProducts"
    dataSourceRef: "sqlserver-source"
    sql: |
      SELECT product_id, product_name, category, unit_price, status
      FROM dbo.Products
