# PostgreSQL Load/Upsert Queries
# References the data source defined in postgresql-datasource.yaml
metadata:
  name: "postgresql-load-queries"
  version: "1.0"
  type: "query-config"
  description: "PostgreSQL upsert queries for table sync (config-b)"

dataSourceRefs:
  - name: "postgresql-target"
    source: "data-sources/postgresql-datasource.yaml"
    enabled: true

queries:
  - name: "upsertCustomer"
    dataSourceRef: "postgresql-target"
    sql: |
      INSERT INTO customers (
        customer_id, customer_name, email, phone, 
        created_date, modified_date, status
      ) VALUES (
        :customer_id, :customer_name, :email, :phone,
        :created_date, :modified_date, :status
      )
      ON CONFLICT (customer_id) 
      DO UPDATE SET
        customer_name = EXCLUDED.customer_name,
        email = EXCLUDED.email,
        phone = EXCLUDED.phone,
        modified_date = EXCLUDED.modified_date,
        status = EXCLUDED.status

  - name: "upsertOrder"
    dataSourceRef: "postgresql-target"
    sql: |
      INSERT INTO orders (
        order_id, customer_id, order_date, total_amount,
        currency, status, modified_date
      ) VALUES (
        :order_id, :customer_id, :order_date, :total_amount,
        :currency, :status, :modified_date
      )
      ON CONFLICT (order_id)
      DO UPDATE SET
        customer_id = EXCLUDED.customer_id,
        order_date = EXCLUDED.order_date,
        total_amount = EXCLUDED.total_amount,
        currency = EXCLUDED.currency,
        status = EXCLUDED.status,
        modified_date = EXCLUDED.modified_date

  - name: "upsertOrderItem"
    dataSourceRef: "postgresql-target"
    sql: |
      INSERT INTO order_items (
        item_id, order_id, product_id, quantity,
        unit_price, discount, modified_date
      ) VALUES (
        :item_id, :order_id, :product_id, :quantity,
        :unit_price, :discount, :modified_date
      )
      ON CONFLICT (item_id)
      DO UPDATE SET
        order_id = EXCLUDED.order_id,
        product_id = EXCLUDED.product_id,
        quantity = EXCLUDED.quantity,
        unit_price = EXCLUDED.unit_price,
        discount = EXCLUDED.discount,
        modified_date = EXCLUDED.modified_date

  - name: "upsertProduct"
    dataSourceRef: "postgresql-target"
    sql: |
      INSERT INTO products (
        product_id, product_name, category, unit_price,
        stock_quantity, status, modified_date
      ) VALUES (
        :product_id, :product_name, :category, :unit_price,
        :stock_quantity, :status, :modified_date
      )
      ON CONFLICT (product_id)
      DO UPDATE SET
        product_name = EXCLUDED.product_name,
        category = EXCLUDED.category,
        unit_price = EXCLUDED.unit_price,
        stock_quantity = EXCLUDED.stock_quantity,
        status = EXCLUDED.status,
        modified_date = EXCLUDED.modified_date

  - name: "insertAuditLog"
    dataSourceRef: "postgresql-target"
    sql: |
      INSERT INTO audit_log (
        log_id, table_name, record_id, action,
        action_date, user_id, details
      ) VALUES (
        :log_id, :table_name, :record_id, :action,
        :action_date, :user_id, :details
      )
      ON CONFLICT (log_id) DO NOTHING
