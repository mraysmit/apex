# APEX Database Table Sync - Standardized Pipeline Configuration B
# This configuration syncs 5 tables from SQL Server to PostgreSQL using standard APEX Core ETL steps.

metadata:
  id: "sqlserver-to-postgresql-sync-b"
  name: "Advanced Table Sync"
  version: "1.0"
  type: "pipeline"
  author: "APEX Database Sync Module"
  description: "Standardized pipeline to sync 5 tables from SQL Server to PostgreSQL"

# External data source references
data-source-refs:
  - name: "sqlserver-source"
    path: "../data-sources/sqlserver-datasource.yaml"
    enabled: true
  - name: "postgresql-target"
    path: "../data-sources/postgresql-datasource.yaml"
    enabled: true

# Pipeline configuration
pipeline:
  name: "sqlserver-to-postgresql-sync-b"
  execution:
    mode: "sequential"
    error-handling: "continue-on-error"
  steps:
    # ---------------------------------------------------------
    # CUSTOMERS
    # ---------------------------------------------------------
    - name: "extract-customers"
      type: "extract"
      source: "sqlserver-source"
      operation: "extractCustomers"
      description: "Extract customers from SQL Server"

    - name: "transform-customers"
      type: "transform"
      depends-on: ["extract-customers"]
      description: "Validate customer records"
      transformations:
        - field: "customer_id"
          type: "validation"
          rule: "required"
        - field: "email"
          type: "validation"
          rule: "status-format" # Using an existing rule for illustration

    - name: "load-customers"
      type: "load"
      sink: "postgresql-target"
      operation: "upsertCustomer"
      depends-on: ["transform-customers"]
      description: "Load customers into PostgreSQL"

    # ---------------------------------------------------------
    # PRODUCTS
    # ---------------------------------------------------------
    - name: "extract-products"
      type: "extract"
      source: "sqlserver-source"
      operation: "extractProducts"
      description: "Extract products from SQL Server"

    - name: "transform-products"
      type: "transform"
      depends-on: ["extract-products"]
      description: "Validate product records"
      transformations:
        - field: "product_name"
          type: "validation"
          rule: "required"

    - name: "load-products"
      type: "load"
      sink: "postgresql-target"
      operation: "upsertProduct"
      depends-on: ["transform-products"]
      description: "Load products into PostgreSQL"

    # ---------------------------------------------------------
    # ORDERS (Depends on Customers)
    # ---------------------------------------------------------
    - name: "extract-orders"
      type: "extract"
      source: "sqlserver-source"
      operation: "extractOrders"
      depends-on: ["load-customers"]
      description: "Extract orders from SQL Server"

    - name: "transform-orders"
      type: "transform"
      depends-on: ["extract-orders"]
      description: "Validate order records"
      transformations:
        - field: "order_id"
          type: "validation"
          rule: "required"

    - name: "load-orders"
      type: "load"
      sink: "postgresql-target"
      operation: "upsertOrder"
      depends-on: ["transform-orders"]
      description: "Load orders into PostgreSQL"

    # ---------------------------------------------------------
    # ORDER ITEMS (Depends on Orders)
    # ---------------------------------------------------------
    - name: "extract-order-items"
      type: "extract"
      source: "sqlserver-source"
      operation: "extractOrderItems"
      depends-on: ["load-orders"]
      description: "Extract order items from SQL Server"

    - name: "load-order-items"
      type: "load"
      sink: "postgresql-target"
      operation: "upsertOrderItem"
      depends-on: ["extract-order-items"]
      description: "Load order items into PostgreSQL"

    # ---------------------------------------------------------
    # AUDIT LOG (Depends on Order Items)
    # ---------------------------------------------------------
    - name: "extract-audit-log"
      type: "extract"
      source: "sqlserver-source"
      operation: "extractAuditLog"
      depends-on: ["load-order-items"]
      description: "Extract audit logs from SQL Server"

    - name: "load-audit-log"
      type: "load"
      sink: "postgresql-target"
      operation: "insertAuditLog"
      depends-on: ["extract-audit-log"]
      description: "Load audit logs into PostgreSQL"

# Validation rules (for reference and future engine extensibility)
rules:
  - id: "SYNC-CUST-001"
    name: "Customer ID Required"
    condition: "#customer_id != null"
    message: "Customer ID is required for sync"
    severity: "ERROR"

  - id: "SYNC-CUST-002"
    name: "Customer Email Format"
    condition: "#email == null || #email.contains('@')"
    message: "Invalid email format"
    severity: "WARNING"

  - id: "SYNC-ORD-001"
    name: "Order ID Required"
    condition: "#order_id != null"
    message: "Order ID is required for sync"
    severity: "ERROR"

  - id: "SYNC-PROD-001"
    name: "Product Name Required"
    condition: "#product_name != null"
    message: "Product name is required"
    severity: "ERROR"
